// MODE DÉMO — une session publique, pré-remplie, sans compte ni serveur réel. Chaque appel
// passe quand même par apiRequest() comme d'habitude (le code appelant reste identique partout
// ailleurs sur le site), mais est intercepté ici avant d'atteindre le réseau. Seule une liste
// explicite d'actions est simulée avec succès — panier, commande, apparence — exactement ce qui
// a été demandé pour l'expérience démo. Tout le reste, y compris ajouter un vrai produit,
// renvoie un message clair plutôt qu'un mensonge silencieux ou une action qui semble marcher
// mais ne mène nulle part.
// ============================================================
let __demoIdCounter = 900000;
function demoNextId(){ return __demoIdCounter++; }
function demoInterceptRequest(path, options){
  const method = options.method || 'GET';
  const body = options.body || {};

  if(method==='GET') return Promise.resolve({});

  if(/\/basket-items$/.test(path) && method==='POST'){
    return Promise.resolve({ basketItem: { id: demoNextId(), qty: body.qty } });
  }
  if(/\/basket-items\/\d+$/.test(path) && method==='PATCH'){
    return Promise.resolve({ basketItem: { id: demoNextId(), qty: body.qty } });
  }
  if(/\/basket-items\/\d+$/.test(path) && method==='DELETE'){
    return Promise.resolve({});
  }

  // Passer une commande — validée immédiatement (le patron démo n'a personne à qui demander).
  if(/\/orders$/.test(path) && method==='POST'){
    return Promise.resolve({ order: { id: demoNextId(), status: 'validee' } });
  }

  // Paramètres de l'établissement (apparence, mais aussi tous les autres réglages qui passent
  // par le même endpoint) — on reproduit le COALESCE du vrai serveur : un champ absent du body
  // garde sa valeur actuelle plutôt que d'être écrasé par "undefined", exactement comme le
  // ferait la vraie base de données.
  if(/\/restaurants\/\d+$/.test(path) && method==='PATCH'){
    const resto = RESTOS.find(r=>r.id===state.resto) || {};
    const keep = (bodyVal, currentVal) => bodyVal !== undefined ? bodyVal : currentVal;
    return Promise.resolve({ restaurant: {
      name: keep(body.name, resto.name), address: keep(body.address, resto.address),
      postal_code: keep(body.postalCode, resto.postalCode), city: keep(body.city, resto.city),
      currency: keep(body.currency, resto.currency), siret: keep(body.siret, resto.siret),
      accent_color: keep(body.accentColor, resto.accentColor), color_theme: keep(body.colorTheme, resto.colorTheme),
      font_style: keep(body.fontStyle, resto.fontStyle), tagline: keep(body.tagline, resto.tagline),
      default_dark_mode: keep(body.defaultDarkMode, resto.defaultDarkMode),
      logo_url: keep(body.logoUrl, resto.logoDataUrl), cover_photo_data_url: keep(body.coverPhotoDataUrl, resto.coverPhotoDataUrl),
      hide_financials: keep(body.hideFinancials, resto.hideFinancials), solo_mode: keep(body.soloMode, resto.soloMode),
      haccp_enabled: keep(body.haccpEnabled, resto.haccpEnabled), recipes_enabled: keep(body.recipesEnabled, resto.recipesEnabled),
      stock_counts_enabled: keep(body.stockCountsEnabled, resto.stockCountsEnabled),
    } });
  }

  // Ajouter un produit : le formulaire reste entièrement utilisable — on voit toute
  // l'interface, on peut la remplir — mais rien n'est réellement conservé. Exactement ce qui a
  // été demandé, ni plus ni moins.
  if(/\/products$/.test(path) && method==='POST'){
    const err = new Error("Vous ne pouvez pas créer de produit dans cette démo publique — le formulaire fonctionne, mais rien n'est conservé. Essayez plutôt de passer une commande avec un produit déjà au catalogue !");
    err.code = 'DEMO_READONLY';
    return Promise.reject(err);
  }

  // Tout le reste (équipe, HACCP, fiches techniques, inventaire, facturation...) : bloqué par
  // défaut, avec un message clair plutôt qu'un mensonge silencieux.
  const err = new Error("Cette action n'est pas disponible dans la démo publique.");
  err.code = 'DEMO_READONLY';
  return Promise.reject(err);
}
function updateFavicon(logoDataUrl){
  let link = document.querySelector('link[rel="icon"]');
  if(!link){
    link = document.createElement('link');
    link.rel = 'icon';

  }

}
function accentTextColor(hex){
  // Choisit blanc ou noir comme couleur de texte selon la vraie clarté de la couleur d'accent
  // (par défaut ou choisie par le restaurant) — pour ne jamais se retrouver avec un texte
  // blanc sur un fond devenu clair (ex : en mode sombre) ou l'inverse.
  const h = (hex||'#111111').replace('#','');
  if(h.length!==6) return '#fff';
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#111111' : '#ffffff';
}

function parseNum(value){
  // Certains navigateurs/claviers (réglages en français) peuvent renvoyer une virgule à la
  // place du point comme séparateur décimal — on la convertit avant de faire le calcul, pour
  // ne jamais silencieusement tronquer un nombre comme "1,45" en "1".
  if(value==null || value==='') return NaN;
  return parseFloat(String(value).replace(',', '.'));
}

// Calcule une vraie note de fiabilité à partir de l'historique réel des écarts détectés à la
// réception — plus une valeur figée ou modifiable à la main comme c'était le cas avant.
// Retourne null si pas encore assez de commandes reçues pour que ce soit significatif.
function calculateSupplierReliability(id){
  // Avant : seules les commandes entièrement "livrées" comptaient — une commande souvent
  // livrée incomplète (statut "partiellement reçue") n'apparaissait jamais dans le calcul,
  // ce qui pouvait afficher 100% de fiabilité pour un fournisseur qui manque pourtant
  // régulièrement des articles. On les inclut désormais, comptées comme un écart.
  const relevant = ORDERS.filter(o=>o.supplier===id && (o.status==='livree' || o.status==='partiellement_recue'));
  if(relevant.length === 0) return null;
  const withIssue = relevant.filter(o=>o.hasDiscrepancy || o.status==='partiellement_recue').length;
  const score = Math.round(((relevant.length - withIssue) / relevant.length) * 100);
  return { score, totalOrders: relevant.length, discrepancyCount: withIssue };
}
function supplierLastOrderDate(id){
  const withDates = ORDERS.filter(o=>o.supplier===id && o.createdAt);
  if(withDates.length===0) return '—';
  const latest = withDates.reduce((a,b)=> new Date(a.createdAt) > new Date(b.createdAt) ? a : b);
  return fmtDateShort(new Date(latest.createdAt));
}
// Jours écoulés depuis la dernière commande — sépare "jamais commandé" (null) de "commandé il y
// a longtemps" (un nombre), pour ne pas les traiter pareil : un fournisseur jamais sollicité
// n'est pas un fournisseur oublié, juste un fournisseur pas encore utilisé.
function supplierDaysSinceLastOrder(id){
  const withDates = ORDERS.filter(o=>o.supplier===id && o.createdAt && o.status!=='refusee');
  if(withDates.length===0) return null;
  const latest = withDates.reduce((a,b)=> new Date(a.createdAt) > new Date(b.createdAt) ? a : b);
  return Math.floor((new Date() - new Date(latest.createdAt)) / (1000*60*60*24));
}
const STALE_SUPPLIER_THRESHOLD_DAYS = 21;
// Ne remonte que les fournisseurs déjà utilisés au moins une fois (sinon un fournisseur tout
// juste ajouté, jamais encore commandé, apparaîtrait à tort comme "oublié" dès le premier jour).
function staleSuppliers(){
  return SUPPLIERS
    .map(s => ({ supplier: s, daysSince: supplierDaysSinceLastOrder(s.id) }))
    .filter(x => x.daysSince !== null && x.daysSince >= STALE_SUPPLIER_THRESHOLD_DAYS)
    .sort((a,b) => b.daysSince - a.daysSince);
}
// Rappel proactif sur le tableau de bord patron — un repère, pas une alerte anxiogène : ce
// n'est pas forcément un oubli (certains fournisseurs sont ponctuels par nature), juste une
// information qu'on ne verrait sinon qu'en allant chercher soi-même sur la page Fournisseurs.

  const stale = staleSuppliers();
  if(!stale.length) return '';
  const names = stale.slice(0,3).map(x=>`${escapeHtml(x.supplier.name)} (${x.daysSince} j)`).join(', ');
  const extra = stale.length>3 ? ` et ${stale.length-3} autre${stale.length-3>1?'s':''}` : '';
  return `
    <div class="card" style="margin-bottom:18px;border:1.5px solid var(--border);background:var(--paper);">
      <div class="flex center gap8" style="margin-bottom:4px;">

      </div>

    </div>
  `;
}

// ============================================================
// FICHES TECHNIQUES — conversion d'unités et calcul de coût. Un produit est acheté dans une
// unité, mais utilisé en cuisine dans une autre — deux façons de relier les deux :
//   1. Conversion directe : l'unité d'achat est déjà un poids ou un volume (Kg, Litre...) —
//      g/Kg ou mL/cl/Litre sont alors interchangeables sans rien à renseigner de plus.
//   2. Via le contenu net : l'unité d'achat n'est PAS un poids/volume (Caisse, Carton,
//      Bouteille...) — un produit acheté "par Caisse" ne peut alors être utilisé en grammes
//      dans une recette QUE si quelqu'un a renseigné, une fois sur le produit, "cette Caisse
//      contient 10 Kg" (voir net_content_qty/net_content_unit). Sans cette information, la
//      seule unité disponible reste celle de l'achat lui-même — mieux vaut un choix limité
//      mais honnête qu'une fausse conversion inventée.
// ============================================================
const RECIPE_UNIT_GROUPS = {
  weight: { g:1, Kg:1000 },
  volume: { mL:1, cl:10, Litre:1000, L:1000 },
};
function recipeUnitGroup(unit){
  const u = (unit||'').trim();
  if(RECIPE_UNIT_GROUPS.weight[u] !== undefined) return 'weight';
  if(RECIPE_UNIT_GROUPS.volume[u] !== undefined) return 'volume';
  return null;
}
// Unités utilisables dans une recette pour ce produit — l'unité d'achat elle-même reste
// toujours proposée, complétée par g/Kg ou mL/cl/Litre si une conversion existe (directe, ou
// via le contenu net renseigné sur le produit).
function recipeCompatibleUnits(product){
  const directGroup = recipeUnitGroup(product.unit);
  if(directGroup) return directGroup==='weight' ? ['g','Kg'] : ['mL','cl','Litre'];
  const options = [product.unit || 'unité'];
  if(product.netContentQty && product.netContentUnit){
    const netGroup = recipeUnitGroup(product.netContentUnit);
    if(netGroup) options.push(...(netGroup==='weight' ? ['g','Kg'] : ['mL','cl','Litre']));
  }
  return options;
}
// Convertit une quantité de recette (dans `unit`) en une FRACTION D'UNITÉ D'ACHAT du produit,
// pour pouvoir la multiplier directement par son prix — renvoie null si aucune conversion
// fiable n'existe entre les deux (ex. grammes vers litres, ou pas de contenu net renseigné
// pour un produit acheté par Caisse).
function convertToProductUnit(quantity, unit, product){
  const productUnit = product.unit;
  const directGroup = recipeUnitGroup(productUnit);
  if(directGroup){
    const table = RECIPE_UNIT_GROUPS[directGroup];
    if(table[unit] !== undefined && table[productUnit] !== undefined){
      return quantity * table[unit] / table[productUnit];
    }
  }
  if(unit === productUnit) return quantity;
  // Passe par le contenu net : ex. 200g vers "Caisse", sachant qu'une Caisse = 10 Kg.
  if(product.netContentQty && product.netContentUnit){
    const netGroup = recipeUnitGroup(product.netContentUnit);
    if(netGroup){
      const table = RECIPE_UNIT_GROUPS[netGroup];
      if(table[unit] !== undefined && table[product.netContentUnit] !== undefined){
        const qtyInNetUnit = quantity * table[unit] / table[product.netContentUnit];
        return qtyInNetUnit / product.netContentQty;
      }
    }
  }
  return null;
}
// Coût d'un ingrédient — toujours calculé à partir du produit ACTUEL en mémoire (pas d'un
// instantané figé au moment de l'ajout de l'ingrédient), pour que changer un prix ou un
// contenu net se répercute immédiatement sur le coût de revient, sans attendre une
// resynchronisation. Si le produit a été supprimé du catalogue depuis, on retombe sur le
// dernier instantané connu plutôt que de perdre le coût du jour au jour.
//
// Un ingrédient peut aussi venir d'une AUTRE fiche technique (sous-recette, ex. une sauce
// maison) plutôt que d'un produit — visitedRecipeIds trace les fiches déjà traversées dans la
// chaîne d'appel, pour ne jamais tourner en boucle si une recette finissait par se référencer
// elle-même, même indirectement (A utilise B qui utilise A).
function recipeIngredientCost(ing, visitedRecipeIds){
  visitedRecipeIds = visitedRecipeIds || new Set();
  if(ing.subRecipeId){
    const subRecipe = RECIPES.find(r=>r.id===ing.subRecipeId);
    if(!subRecipe || !subRecipe.yieldQty || !subRecipe.yieldUnit) return null; // pas (ou plus) utilisable comme sous-recette
    const subBreakdown = recipeCostBreakdown(subRecipe.id, visitedRecipeIds);
    // Pas seulement la boucle elle-même : si LA SOUS-RECETTE a le moindre ingrédient de coût
    // inconnu (boucle plus profonde, produit supprimé...), son propre total ne veut rien dire —
    // mieux vaut remonter "coût inconnu" ici aussi que d'afficher un chiffre silencieusement
    // sous-évalué, calculé à partir d'un total partiel.
    if(subBreakdown.circular || subBreakdown.hasUnknownCost) return null;
    const costPerYieldUnit = subBreakdown.totalCostHT / subRecipe.yieldQty;
    // Le rendement EST déjà une unité de poids/volume (ex. "500g") — on le traite comme
    // l'unité d'achat d'un produit, pour réutiliser exactement la même logique de conversion.
    const convertedQty = convertToProductUnit(ing.quantity, ing.unit, { unit: subRecipe.yieldUnit });
    if(convertedQty == null) return null;
    return convertedQty * costPerYieldUnit;
  }
  const liveProduct = ing.productId ? PRODUCTS.find(p=>p.id===ing.productId) : null;
  const price = liveProduct ? liveProduct.price : ing.currentProductPrice;
  const unit = liveProduct ? liveProduct.unit : ing.currentProductUnit;
  const netContentQty = liveProduct ? liveProduct.netContentQty : ing.currentProductNetContentQty;
  const netContentUnit = liveProduct ? liveProduct.netContentUnit : ing.currentProductNetContentUnit;
  if(price == null || !unit) return null; // produit supprimé du catalogue et jamais synchronisé
  const product = { unit, netContentQty, netContentUnit };
  const convertedQty = convertToProductUnit(ing.quantity, ing.unit, product);
  if(convertedQty == null) return null;
  return convertedQty * price;
}
function recipeCostBreakdown(recipeId, visitedRecipeIds){
  visitedRecipeIds = visitedRecipeIds || new Set();
  if(visitedRecipeIds.has(recipeId)){
    // Boucle détectée (une chaîne de sous-recettes qui finit par se référencer elle-même) — on
    // arrête net plutôt que de planter, et on le signale plutôt que d'afficher un faux chiffre.
    return { lines:[], totalCostHT:0, hasUnknownCost:true, circular:true };
  }
  const nextVisited = new Set(visitedRecipeIds); nextVisited.add(recipeId);
  const lines = RECIPE_INGREDIENTS.filter(i=>i.recipeId===recipeId).map(ing=>({ ...ing, cost: recipeIngredientCost(ing, nextVisited) }));
  const totalCostHT = Math.round(lines.reduce((a,l)=>a+(l.cost||0),0)*100)/100;
  const hasUnknownCost = lines.some(l=>l.cost==null);
  return { lines, totalCostHT, hasUnknownCost, circular:false };
}
// Le prix de vente est saisi TTC (c'est ce qui figure sur la carte) ; le coût matière est HT
// (c'est ce que facture le fournisseur). Comparer les deux donne un food cost indicatif, pas
// un chiffre comptable strict — précisé clairement dans l'interface plutôt que présenté comme
// une vérité absolue.
function recipeMargin(recipe){
  const { totalCostHT, hasUnknownCost } = recipeCostBreakdown(recipe.id);
  if(recipe.sellingPriceTtc == null) return { totalCostHT, margin:null, foodCostPct:null, hasUnknownCost };
  const margin = Math.round((recipe.sellingPriceTtc - totalCostHT)*100)/100;
  const foodCostPct = recipe.sellingPriceTtc > 0 ? Math.round((totalCostHT/recipe.sellingPriceTtc)*1000)/10 : null;
  return { totalCostHT, margin, foodCostPct, hasUnknownCost };
}
// ============================================================
// TVA — les 4 taux standards français en vigueur (stables depuis 2014). Le prix d'un produit
// est toujours stocké HT (l'usage entre professionnels) ; ces fonctions dérivent le TTC et la
// ventilation par taux au moment d'afficher un document, sans jamais transformer la donnée
// stockée elle-même.
// ============================================================
const TVA_RATES = [
  { value: 20, label: '20 % — Taux normal' },
  { value: 10, label: '10 % — Taux intermédiaire (restauration, travaux)' },
  { value: 5.5, label: '5,5 % — Taux réduit (produits alimentaires de base)' },
  { value: 2.1, label: '2,1 % — Taux particulier (presse, médicaments remboursés)' },
];
function tvaRateLabel(rate){
  const known = TVA_RATES.find(t=>Math.abs(t.value-rate)<0.01);
  return known ? known.label.split(' — ')[0] : `${fmtNum(rate)} %`;
}
function fmtNum(n){ return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:0, maximumFractionDigits:2}); }
function calcTTC(priceHT, tvaRate){ return Number(priceHT||0) * (1 + Number(tvaRate||0)/100); }
function calcTvaAmount(priceHT, tvaRate){ return Number(priceHT||0) * Number(tvaRate||0)/100; }
// Regroupe une liste de lignes {totalHT, tvaRate} par taux de TVA — c'est la présentation
// attendue sur un document professionnel : une ligne par taux avec sa base HT et son montant
// de TVA, plutôt qu'un seul total TVA global qui ne dit pas comment il a été obtenu.
function tvaBreakdown(lines){
  const byRate = {};
  lines.forEach(l=>{
    const rate = Number(l.tvaRate||0);
    if(!byRate[rate]) byRate[rate] = { rate, baseHT: 0, tvaAmount: 0 };
    byRate[rate].baseHT += l.totalHT;
    byRate[rate].tvaAmount += calcTvaAmount(l.totalHT, rate);
  });
  // Arrondi au centime PAR TAUX avant de renvoyer — pas seulement au moment de l'affichage.
  // Sans ça, le "Total TVA" (somme des valeurs exactes non arrondies) pouvait afficher un
  // centime de moins que ce qu'on obtient en additionnant à la main les lignes de détail
  // arrondies affichées juste au-dessus — un écart qui saute aux yeux sur un document
  // professionnel, même s'il ne vient que d'une imprécision binaire classique (0,1 + 0,2 ≠
  // 0,3). Arrondir ici garantit que le total est toujours exactement la somme de ce qui est
  // montré, comme le ferait n'importe quel comptable.
  return Object.values(byRate).map(b => ({ ...b, baseHT: Math.round(b.baseHT*100)/100, tvaAmount: Math.round(b.tvaAmount*100)/100 })).sort((a,b)=>b.rate-a.rate);
}
function fullAddress(resto){
  const line2 = [resto.postalCode, resto.city].filter(Boolean).join(' ');
  return [resto.address, line2].filter(Boolean).join(', ');
}

const MONTHS_LONG = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ============================================================
   PANIERS PAR FOURNISSEUR — on regroupe les besoins avant d'envoyer
   une seule commande par fournisseur.
============================================================ */
async function addToBasket(supplierId, productId, qty){
  qty = Math.round(qty);
  if(!supplierId || !productId || !qty || qty<=0) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplierObj = SUPPLIERS.find(s=>s.id===supplierId);
  const productObj = PRODUCTS.find(p=>p.id===productId);
  if(!resto || !resto.remoteId || !supplierObj || !productObj) return;
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/basket-items`, {
      method:'POST', body:{ supplierId: supplierObj.remoteId, productId: productObj.remoteId, qty },
    });
    if(!BASKETS[supplierId]) BASKETS[supplierId] = [];
    const existing = BASKETS[supplierId].find(li=>li.productId===productId);
    if(existing){ existing.qty = parseFloat(data.basketItem.qty); existing.remoteId = data.basketItem.id; }
    else { BASKETS[supplierId].push({productId, qty: parseFloat(data.basketItem.qty), remoteId: data.basketItem.id}); }
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function removeBasketLine(supplierId, productId){
  if(!BASKETS[supplierId]) return;
  const line = BASKETS[supplierId].find(li=>li.productId===productId);
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    if(line && line.remoteId && resto){
      await apiRequest(`/api/restaurants/${resto.remoteId}/basket-items/${line.remoteId}`, { method:'DELETE' });
    }
    BASKETS[supplierId] = BASKETS[supplierId].filter(li=>li.productId!==productId);
    if(BASKETS[supplierId].length===0) delete BASKETS[supplierId];
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function updateBasketLineQty(supplierId, productId, value){
  if(!BASKETS[supplierId]) return;
  const qty = Math.round(parseFloat(value));
  if(!qty || qty<=0){ await removeBasketLine(supplierId, productId); return; }
  const line = BASKETS[supplierId].find(li=>li.productId===productId);
  if(!line) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    if(line.remoteId && resto){
      await apiRequest(`/api/restaurants/${resto.remoteId}/basket-items/${line.remoteId}`, { method:'PATCH', body:{ qty } });
    }
    line.qty = Math.round(qty*100)/100;
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function basketTotal(supplierId){
  return (BASKETS[supplierId]||[]).reduce((a,li)=>{
    const p = PRODUCTS.find(x=>x.id===li.productId);
    return a + (p ? li.qty*p.price : 0);
  }, 0);
}
function canSendOrders(){
  if(state.role==='patron') return true;
  const m = TEAM.find(t=>t.id===state.loggedInEmployeeId);
  return !!(m && m.canOrderDirectly);
}
async function sendBasket(supplierId){
  if(!canSendOrders()){ toast("Vous n'avez pas l'autorisation de commander directement — demandez au patron",'alert'); return; }
  const items = BASKETS[supplierId];
  if(!items || items.length===0) return;
  const parts = [];
  let amount = 0;
  const enrichedItems = []; // {productId (local), remoteProductId, name, qty, price, tvaRate} — pour un affichage fiable partout
  items.forEach(li=>{
    const p = PRODUCTS.find(x=>x.id===li.productId);
    if(p){
      parts.push(`${escapeHtml(p.name)} × ${li.qty} ${p.unit}`);
      amount += li.qty*p.price;
      enrichedItems.push({ productId: li.productId, remoteProductId: p.remoteId, name: p.name, qty: li.qty, price: p.price, tvaRate: p.tvaRate??5.5 });
    }
  });
  const now = new Date();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplierObj = SUPPLIERS.find(s=>s.id===supplierId);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/orders`, {
      method:'POST',
      body:{
        supplierId: supplierObj?supplierObj.remoteId:null, items: parts.join(', '),
        lineItems: enrichedItems.map(li=>({productId:li.remoteProductId, name:li.name, qty:li.qty, price:li.price, tvaRate:li.tvaRate})),
        amount: Math.round(amount*100)/100, status:'en_attente_validation', orderDate: fmtDateShort(now),
      },
    });
    // Le statut réellement appliqué vient du serveur (validee tout de suite pour le patron ou
    // un employé autorisé sous son plafond ; en_attente_validation sinon) — on ne le devine
    // jamais côté navigateur, pour ne pas afficher un statut different de la réalité.
    const finalStatus = data.order.status;
    ORDERS.unshift({
      id:'CMD-'+nextId(), remoteId: data.order.id, supplier:supplierId, items: parts.join(', '),
      lineItems: enrichedItems.map(li=>({productId:li.productId, name:li.name, qty:li.qty, price:li.price, tvaRate:li.tvaRate})),
      amount: Math.round(amount*100)/100, status:finalStatus, date: fmtDateShort(now), createdAt: now
    });
    try{
      await apiRequest(`/api/restaurants/${resto.remoteId}/baskets/${supplierObj.remoteId}`, { method:'DELETE' });
    } catch(e){ /* la commande est déjà bien envoyée ; on nettoiera le panier au prochain chargement si besoin */ }
    delete BASKETS[supplierId];
    if(data.requiredApprovalDueToLimit){
      toast('Commande envoyée, mais au-delà de votre plafond de commande directe — en attente de validation du patron.');
    } else if(finalStatus==='validee'){
      toast('Commande envoyée — '+supplierName(supplierId));
    } else {
      toast('Commande envoyée pour validation — '+supplierName(supplierId));
    }
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function fmtDateShort(d){ return d.getDate()+' '+MONTHS_SHORT[d.getMonth()]; }
function fmtDateLong(d){ return d.getDate()+' '+MONTHS_LONG[d.getMonth()]+' '+d.getFullYear(); }

// Jeton de connexion : le cookie de session seul ne suffit pas partout — Safari (et d'autres
// navigateurs) bloquent par défaut les cookies posés par un serveur sur un autre domaine que
// celui du site visité. Ce jeton, envoyé dans l'en-tête "Authorization", contourne ce blocage.

async function apiRequest(path, options={}){
  if(state.isDemoMode) return demoInterceptRequest(path, options);
  const headers = { 'Content-Type': 'application/json' };
  if(AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
  if(TEAM_TOKEN) headers['X-Team-Token'] = TEAM_TOKEN;
  let res;
  try{
    res = await fetch(API_URL + path, {
      method: options.method || 'GET',
      headers,
      credentials: 'include', // gardé en plus, pour les navigateurs qui acceptent bien le cookie
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
  } catch(networkErr){
    // `fetch` lève une erreur technique très générique quand la connexion est coupée (wifi qui
    // tombe en plein service, coupure réseau...) — "Failed to fetch" ne veut rien dire pour un
    // restaurateur. On la remplace par un message clair sur ce qui s'est vraiment passé.
    const err = new Error("Impossible de contacter le serveur — vérifiez votre connexion internet et réessayez.");
    err.code = 'NETWORK_ERROR';
    throw err;
  }
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if(!res.ok){
    const err = new Error(data.error || 'Une erreur est survenue. Merci de réessayer.');
    err.code = data.code;
    throw err;
  }
  if(data.token){
    // Une nouvelle connexion patron doit prendre le dessus sur ce navigateur — sans ça, un
    // jeton d'employé resté actif pourrait continuer à s'appliquer après un rechargement.
    AUTH_TOKEN = data.token; localStorage.setItem(AUTH_TOKEN_KEY, data.token);
    TEAM_TOKEN = null; localStorage.removeItem(TEAM_TOKEN_KEY);
  }
  if(data.teamToken){
    // Et inversement : la connexion d'un employé (via son lien personnel) doit prendre le
    // dessus sur un jeton patron déjà présent sur cet appareil — sinon, après actualisation,
    // c'est le compte du patron qui réapparaît au lieu de rester sur SON espace personnel.
    TEAM_TOKEN = data.teamToken; localStorage.setItem(TEAM_TOKEN_KEY, data.teamToken);
    AUTH_TOKEN = null; localStorage.removeItem(AUTH_TOKEN_KEY);
  }
  return data;
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq, duration, peakGain, type, delay){
  const ctx = getAudioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime + (delay||0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakGain, t0 + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.03);
}
function playClickSound(){ playTone(680, 0.045, 0.045, 'sine'); }
function playSuccessSound(){ playTone(660, 0.09, 0.06, 'sine'); playTone(920, 0.11, 0.05, 'sine', 0.06); }
function playAlertSound(){ playTone(320, 0.09, 0.045, 'sine'); }
document.addEventListener('click', function(e){
  if(e.target.closest('button')) playClickSound();
}, false);

function toast(msg, type){
  const zone = document.getElementById('toast-zone');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='alert'?'alert':type==='mail'?'mail':'');
  el.innerHTML = iconXs(type==='alert'?I.warn:type==='mail'?I.mail:I.check) + `<span>${msg}</span>`;
  zone.appendChild(el);
  if(type==='alert') playAlertSound();
  else if(type!=='mail') playSuccessSound();
  // La durée de base (3200ms) suffit pour un court message de confirmation ("Produit créé"),
  // mais pas pour un message plus long expliquant vraiment quelque chose (comme les messages de
  // la démo publique) — la durée s'allonge donc avec la longueur du texte, à une vitesse de
  // lecture confortable, plutôt qu'un temps fixe qui coupe la lecture en plein milieu.
  const base = type==='mail' ? 4600 : 3200;
  const life = Math.max(base, msg.length * 60);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, life);
}
function maskEmail(email){
  const [user, domain] = (email||'').split('@');
  if(!domain) return email;
  return user.slice(0,2) + '***@' + domain;
}
async function notifyByEmail(roleKey, message, eventKey){
  const cfg = NOTIF_STATE[roleKey];
  if(!cfg || !cfg.enabled || !cfg.email) return;
  if(eventKey && cfg.events && cfg.events[eventKey]===false) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || !resto.remoteId) return;
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/notify`, {
      method:'POST',
      body:{ role: roleKey, message },
    });
    if(data.sent) toast(`<b>Email envoyé</b> à ${escapeHtml(maskEmail(cfg.email))} — ${message}`, 'mail');
  } catch(err){
    // Une notification manquée ne doit jamais bloquer l'action en cours (approbation d'une
    // demande, envoi d'une commande...) — on l'indique discrètement, sans interrompre.
    toast(`Email non envoyé (${err.message})`, 'alert');
  }
}

function goToSite(site){
  // Filet de sécurité universel : quitter la démo par n'importe quel chemin (bouton dédié,
  // déconnexion, bouton "précédent" du navigateur...) nettoie toujours l'état complètement.
  // Sans ça, un vrai compte connecté juste après resterait piégé dans le simulateur
  // (isDemoMode resterait à true), et aucun de ses enregistrements n'atteindrait le serveur.
  if(state.isDemoMode) demoCleanup();
  state.site = site;
  state.accountError = null;
  // Mémorise cette page dans l'historique du navigateur, pour que le bouton "précédent" du
  // navigateur ramène à CETTE page précise (ex : Tarifs) plutôt qu'à l'accueil par défaut —
  // utile en particulier après un aller-retour vers la page de paiement Stripe.
  if(!state._restoringFromHistory){
    window.history.pushState({ site }, '', window.location.pathname);
  }
  render();
  window.scrollTo(0,0);
}
window.addEventListener('popstate', (e) => {
  if(e.state && e.state.site){
    state._restoringFromHistory = true;
    if(e.state.view) state.view = e.state.view;
    goToSite(e.state.site);
    state._restoringFromHistory = false;
  }
});

    startCheckout(planId);
    return;
  }
  state.authMode = 'signup';
  goToSite('account-auth');
}
async function startCheckout(planId){
  try{
    // Mémorise la page précise où on se trouve (ex : "Multi-établissements") avant de partir
    // vers Stripe, pour que le bouton "précédent" du navigateur y ramène exactement, plutôt que
    // de retomber sur l'écran de choix du profil.
    window.history.replaceState({ site: state.site, view: state.view }, '', window.location.pathname);
    const data = await apiRequest('/api/billing/create-checkout-session', {
      method:'POST',
      body:{ plan: planId, billingCycle: state.billingCycle },
    });
    window.location.href = data.url; // vraie page de paiement hébergée par Stripe
  } catch(err){
    toast(err.message, 'alert');
  }
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* ============================================================
   VALIDATION SANS TOUT EFFACER — quand un champ est invalide, on l'entoure en rouge et on
   affiche le message d'erreur SANS redessiner toute la page (ce qui effacerait ce que la
   personne a déjà tapé dans les autres champs, valides ou non).
============================================================ */
function showFormError(errorSlotId, message, invalidFieldIds){
  const slot = document.getElementById(errorSlotId);
  if(slot){ slot.textContent = message; slot.style.display = 'block'; }
  (invalidFieldIds||[]).forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add('field-error');
  });
}
function clearFormErrors(errorSlotId, fieldIds){
  const slot = document.getElementById(errorSlotId);
  if(slot){ slot.textContent = ''; slot.style.display = 'none'; }
  (fieldIds||[]).forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.remove('field-error');
  });
}

/* ============================================================
   REMPLISSAGE INTELLIGENT DES ADRESSES — API gouvernementale gratuite, sans clé requise.
============================================================ */
async function autofillCityFromPostal(postalId, cityId){
  const postalEl = document.getElementById(postalId);
  const cityEl = document.getElementById(cityId);
  if(!postalEl || !cityEl) return;
  const code = postalEl.value.trim();
  if(!/^\d{5}$/.test(code)) return;
  try{
    const res = await fetch(`https://geo.api.gouv.fr/communes?codePostal=${code}&fields=nom&format=json`);
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      cityEl.value = data[0].nom;
    }
  } catch(e){
    // Silencieux : si l'API est indisponible, le champ reste simplement modifiable à la main.
  }
}
let addressAutocompleteTimer = null;
async function wireAddressAutocomplete(addressId, datalistId){
  const input = document.getElementById(addressId);
  const list = document.getElementById(datalistId);
  if(!input || !list) return;
  const query = input.value.trim();
  if(query.length < 4) return;
  clearTimeout(addressAutocompleteTimer);
  addressAutocompleteTimer = setTimeout(async () => {
    try{
      const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&limit=5`);
      const data = await res.json();
      const suggestions = (data.features||[]).map(f=>f.properties.label);
      list.innerHTML = suggestions.map(s=>`<option value="${s}">`).join('');
    } catch(e){
      // Silencieux : pas de suggestions si l'API est indisponible, le champ reste utilisable.
    }
  }, 300);
}

let adminFilterDebounce = null;
async function adminFilterUsers(skipDebounce){
  const doFilter = async () => {
    const search = (document.getElementById('admin-search')||{}).value || '';
    const plan = (document.getElementById('admin-filter-plan')||{}).value || '';
    const status = (document.getElementById('admin-filter-status')||{}).value || '';
    state.adminUserFilters = { search, plan, status };
    try{
      const params = new URLSearchParams();
      if(search) params.set('search', search);
      if(plan) params.set('plan', plan);
      if(status) params.set('status', status);
      const data = await apiRequest(`/api/admin/users?${params.toString()}`);
      state.adminUsers = data.users;
      render();
    } catch(err){
      state.adminError = err.message;
      render();
    }
  };
  if(skipDebounce){ await doFilter(); return; }
  // Recherche "au fil de la frappe" avec un léger délai, pour ne pas envoyer une requête à
  // chaque lettre tapée — seulement une fois que la personne s'arrête un instant.
  clearTimeout(adminFilterDebounce);
  adminFilterDebounce = setTimeout(doFilter, 300);
}

async function attemptLogin(){
  const role = state.loginSelectedRole;
  const employeeId = state.loginSelectedEmployeeId;
  const userVal = (document.getElementById('login-username')||{}).value || '';
  const passVal = (document.getElementById('login-password')||{}).value || '';
  if(employeeId){
    // Membre de l'équipe : la vérification se fait réellement côté serveur, jamais en local —
    // ni l'identifiant ni le mot de passe ne sont jamais stockés en clair dans le navigateur.
    const m = TEAM.find(t=>t.id===employeeId);
    const resto = RESTOS.find(r=>r.id===state.resto);
    if(!m || !resto || !resto.remoteId){
      showFormError('login-error-slot', "Nom d'utilisateur ou mot de passe incorrect. Merci de réessayer.", ['login-username','login-password']);
      return;
    }
    try{
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/team-login`, { method:'POST', body:{ username: userVal, password: passVal } });
      if(data.mustChangePassword){
        // On ne rentre PAS dans le tableau de bord tout de suite : la session serveur est déjà
        // valide (le jeton d'équipe est stocké), mais on impose de choisir un nouveau mot de
        // passe personnel avant de continuer.
        state.pendingPasswordChange = { role, employeeId, currentPassword: passVal };
        state.forcedPasswordChangeError = null;
        render();
        return;
      }
      login(role, employeeId);
      // Première connexion réelle de cette personne (surtout si elle arrive via son lien
      // personnel, sans être jamais passée par le compte du patron) : on recharge tout
      // maintenant que la session est bien établie côté serveur.
      syncRestoOperationalData(state.resto);
    } catch(err){
      showFormError('login-error-slot', err.message || "Nom d'utilisateur ou mot de passe incorrect. Merci de réessayer.", ['login-username','login-password']);
    }
    return;
  }
  // Patron : vérification réellement faite par le serveur (en plus de la vraie session de
  // compte déjà établie plus tôt par email/mot de passe, ou Google/Apple) — cette étape sert de
  // verrou rapide supplémentaire, mais ses identifiants sont désormais vraiment sauvegardés.
  try{
    await apiRequest('/api/account/team-login', { method:'POST', body:{ username: userVal, password: passVal } });
    login(role, null);
  } catch(err){
    showFormError('login-error-slot', err.message || "Nom d'utilisateur ou mot de passe incorrect. Merci de réessayer.", ['login-username','login-password']);
  }
}

async function submitForcedPasswordChange(){
  const pending = state.pendingPasswordChange;
  if(!pending) return;
  const newPassword = (document.getElementById('forced-new-password')||{}).value || '';

  if(newPassword.length < 8){
    showFormError('forced-pw-error-slot', 'Le mot de passe doit contenir au moins 8 caractères.', ['forced-new-password']);
    return;
  }
  if(newPassword !== confirmPassword){
    showFormError('forced-pw-error-slot', 'Les deux mots de passe ne correspondent pas.', ['forced-new-password','forced-new-password-confirm']);
    return;
  }
  const resto = RESTOS.find(r=>r.id===state.resto);
  const member = TEAM.find(t=>t.id===pending.employeeId);
  if(!resto || !resto.remoteId || !member || !member.remoteId){
    showFormError('forced-pw-error-slot', 'Une erreur est survenue. Merci de recharger la page.', []);
    return;
  }
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/team/${member.remoteId}/change-own-password`, {
      method:'POST', body:{ currentPassword: pending.currentPassword, newPassword },
    });
    const { role, employeeId } = pending;
    state.pendingPasswordChange = null;
    login(role, employeeId);
    syncRestoOperationalData(state.resto);
    toast('Mot de passe mis à jour');
  } catch(err){
    showFormError('forced-pw-error-slot', err.message || "Une erreur est survenue. Merci de réessayer.", ['forced-new-password']);
  }
}

let TOUR_STATE = { active:false, stepIndex:0, wasSidebarOpen:false };
function tourStepsForContext(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  return GUIDED_TOUR_STEPS.filter(s =>
    !(s.skipIf==='solo' && soloModeEnabled()) &&
    !(s.skipIf==='recipes' && resto && resto.recipesEnabled===false)
  );
}
function maybeAutoStartTour(){
  // Ne se déclenche qu'une fois, pour un établissement encore entièrement vide (le même signal
  // que le guide de démarrage du tableau de bord) — inutile de rejouer la visite à quelqu'un
  // qui utilise déjà le site depuis des semaines.
  if(localStorage.getItem('mise_et_sure_tour_seen')) return;
  if(state.role!=='patron' || state.view!=='dashboard') return;
  if(SUPPLIERS.length>0 || PRODUCTS.length>0) return;
  setTimeout(()=>{ if(!TOUR_STATE.active) startGuidedTour(); }, 600);
}
function startGuidedTour(){
  TOUR_STATE.active = true;
  TOUR_STATE.stepIndex = 0;
  TOUR_STATE.wasSidebarOpen = state.sidebarOpen;
  if(window.innerWidth <= 900 && !state.sidebarOpen){ state.sidebarOpen = true; render(); }
  // pointer-events:auto sur l'overlay (voir CSS) bloque déjà les clics, mais ne suffit pas
  // contre un geste de glissement tactile : sur mobile, le navigateur peut reconnaître un
  // balayage comme un défilement natif de la page AVANT même que le CSS ne l'en empêche. La
  // seule façon fiable de vraiment figer l'arrière-plan est de bloquer le défilement lui-même,
  // le temps du guide — restauré exactement à l'identique dans endTour().
  TOUR_STATE.savedBodyOverflow = document.body.style.overflow;
  TOUR_STATE.savedHtmlOverflow = document.documentElement.style.overflow;
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';
  renderTourStep();
}
function endTour(){
  TOUR_STATE.active = false;
  const el = document.getElementById('tour-overlay');
  if(el) el.remove();
  document.body.style.overflow = TOUR_STATE.savedBodyOverflow || '';
  document.documentElement.style.overflow = TOUR_STATE.savedHtmlOverflow || '';
  localStorage.setItem('mise_et_sure_tour_seen', '1');
  if(window.innerWidth <= 900 && state.sidebarOpen && !TOUR_STATE.wasSidebarOpen){ state.sidebarOpen = false; render(); }
}
function nextTourStep(){
  const steps = tourStepsForContext();
  if(TOUR_STATE.stepIndex >= steps.length-1){ endTour(); return; }
  TOUR_STATE.stepIndex++;
  renderTourStep();
}
function prevTourStep(){
  if(TOUR_STATE.stepIndex<=0) return;
  TOUR_STATE.stepIndex--;
  renderTourStep();
}
function renderTourStep(){
  const steps = tourStepsForContext();
  const step = steps[TOUR_STATE.stepIndex];
  if(!step){ endTour(); return; }
  let overlay = document.getElementById('tour-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'tour-overlay';
    overlay.className = 'tour-overlay';
    document.body.appendChild(overlay);
  }
  const targetEl = step.target ? document.querySelector(`[data-nav-id="${step.target}"]`) : null;
  const isMobile = window.innerWidth <= 900;
  let spotlightHtml = '';
  let tooltipStyle;
  if(targetEl){
    const r = targetEl.getBoundingClientRect();
    const pad = 6;
    spotlightHtml = `<div class="tour-spotlight" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;"></div>`;
  }
  if(isMobile){
    // Sur mobile, la sidebar prend presque tout l'écran — plutôt que de calculer une position
    // à côté d'un menu très étroit (risque de débordement), l'info-bulle se pose simplement en
    // bas de l'écran, dans une zone fixe et confortable.
    tooltipStyle = `left:14px;right:14px;bottom:14px;max-width:none;`;
  } else if(targetEl){
    const r = targetEl.getBoundingClientRect();
    const top = Math.max(16, Math.min(r.top, window.innerHeight - 220));
    tooltipStyle = `left:${Math.min(r.right + 18, window.innerWidth - 316)}px;top:${top}px;`;
  } else {
    tooltipStyle = `left:50%;top:50%;transform:translate(-50%,-50%);`;
  }
  const isLast = TOUR_STATE.stepIndex === steps.length-1;
  overlay.innerHTML = `
    ${spotlightHtml}
    <div class="tour-tooltip" style="${tooltipStyle}">
      <div class="tour-tooltip-title">${escapeHtml(step.title)}</div>
      <div class="tour-tooltip-text">${escapeHtml(step.text)}</div>
      <div class="tour-tooltip-footer">
        <span class="tour-progress">${TOUR_STATE.stepIndex+1}/${steps.length}</span>

function spendByCategoryData(){
  const map = {};
  ORDERS.filter(o=>o.status!=='refusee').forEach(o=>{
    (o.lineItems||[]).forEach(li=>{
      if(!li.productId) return;
      const p = PRODUCTS.find(x=>x.id===li.productId);
      const cat = (p && p.cat) || 'Non catégorisé';
      const qty = li.qtyReceived!=null ? li.qtyReceived : li.qty;
      const price = li.priceReceived!=null ? li.priceReceived : (li.price!=null ? li.price : (p?p.price:0));
      map[cat] = (map[cat]||0) + (Number(qty)||0)*(Number(price)||0);
    });
  });
  return Object.entries(map).map(([label,value])=>({label, value:Math.round(value*100)/100})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
}
// Ancienneté réelle de l'activité (en jours), à partir de la commande la plus ancienne — sert
// à adapter les fenêtres d'affichage plutôt que d'imposer 8 semaines ou 3 mois fixes à un
// établissement qui vient tout juste de commencer, ce qui ne montrerait qu'une poignée de
// barres remplies au milieu d'un graphique presque entièrement vide.
function restaurantActivityDaysSpan(){
  const validOrders = ORDERS.filter(o=>o.status!=='refusee' && o.createdAt);
  if(!validOrders.length) return 0;
  const earliest = validOrders.reduce((min,o)=> o.createdAt<min ? o.createdAt : min, validOrders[0].createdAt);
  return Math.max(0, Math.floor((new Date() - new Date(earliest)) / (1000*60*60*24)));
}
function monthlyTrendData(monthsBack){
  monthsBack = monthsBack || 6;
  const now = new Date();
  const months = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ year:d.getFullYear(), month:d.getMonth(), label: d.toLocaleDateString('fr-FR',{month:'short'}) });
  }
  return months.map(m=>{
    const total = ORDERS.filter(o=>o.status!=='refusee' && o.createdAt).filter(o=>{
      const d = new Date(o.createdAt);
      return d.getFullYear()===m.year && d.getMonth()===m.month;
    }).reduce((sum,o)=>sum+(o.amount||0),0);
    return { label: m.label, value: Math.round(total*100)/100 };
  });
}
// Semaine par semaine, sur les 8 dernières semaines au maximum — mais réduit automatiquement
// si l'établissement a commencé à commander plus récemment que ça, pour ne pas imposer 8
// colonnes dont la moitié n'a jamais pu être remplie faute d'avoir existé sur le site.
function weeklyTrendData(weeksBack){
  weeksBack = weeksBack || 8;
  const now = new Date();
  const day = now.getDay(); // 0 = dimanche
  const diffToMonday = (day===0 ? 6 : day-1);
  const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday);
  const weeks = [];
  for(let i=weeksBack-1;i>=0;i--){
    const start = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate()-i*7);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+7);
    weeks.push({ start, end, label: `${start.getDate()}/${start.getMonth()+1}` });
  }
  return weeks.map(w=>{
    const total = ORDERS.filter(o=>o.status!=='refusee' && o.createdAt).filter(o=>{
      const d = new Date(o.createdAt);
      return d>=w.start && d<w.end;
    }).reduce((sum,o)=>sum+(o.amount||0),0);
    return { label: w.label, value: Math.round(total*100)/100 };
  });
}
function yearlyTrendData(yearsBack){
  yearsBack = yearsBack || 5;
  const now = new Date();
  const years = [];
  for(let i=yearsBack-1;i>=0;i--){ years.push(now.getFullYear()-i); }
  return years.map(y=>{
    const total = ORDERS.filter(o=>o.status!=='refusee' && o.createdAt).filter(o=>{
      const d = new Date(o.createdAt);
      return d.getFullYear()===y;
    }).reduce((sum,o)=>sum+(o.amount||0),0);
    return { label: String(y), value: Math.round(total*100)/100 };
  });
}
// Calcule, pour la période choisie (semaine/mois/année), la taille de fenêtre adaptée à
// l'ancienneté réelle de l'activité — jamais plus que le maximum habituel (8/3/5), mais réduite
// si l'établissement a commencé à commander plus récemment, pour ne jamais imposer des colonnes
// vides datant d'avant l'ouverture du compte. Toujours au moins 1, même pour un tout nouveau
// compte sans aucune commande.
function adaptiveTrendWindow(trendPeriod){
  const daysActive = restaurantActivityDaysSpan();
  if(trendPeriod==='annee'){
    const yearsActive = Math.floor(daysActive/365) + 1;
    return Math.max(1, Math.min(5, yearsActive));
  }
  if(trendPeriod==='mois'){
    const monthsActive = Math.floor(daysActive/30) + 1;
    return Math.max(1, Math.min(3, monthsActive));
  }
  const weeksActive = Math.floor(daysActive/7) + 1;
  return Math.max(1, Math.min(8, weeksActive));
}
function totalSpendThisMonth(){
  const now = new Date();
  return ORDERS.filter(o=>o.status!=='refusee' && o.createdAt).filter(o=>{
    const d = new Date(o.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).reduce((sum,o)=>sum+(o.amount||0),0);
}
// Compare les dépenses du mois en cours à la moyenne des mois précédents, et projette une
// estimation de fin de mois en extrapolant le rythme observé jusqu'ici — volontairement simple
// (pas de saisonnalité, pas de pondération), pour rester lisible d'un coup d'œil plutôt que de
// viser une précision que l'historique ne permet de toute façon pas encore.
function budgetForecastInsight(){
  const trend = monthlyTrendData(7); // les 6 mois précédents + le mois en cours
  const currentMonth = trend[trend.length-1];
  const pastMonths = trend.slice(0,-1).filter(m=>m.value>0);
  if(!pastMonths.length) return null; // pas assez d'historique pour comparer à quoi que ce soit
  const avgPast = pastMonths.reduce((s,m)=>s+m.value,0)/pastMonths.length;
  const now = new Date();
  const dayOfMonth = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const projected = (currentMonth.value / dayOfMonth) * daysInMonth;
  return {
    currentSpend: currentMonth.value, avgPast, projected,
    deltaPct: avgPast>0 ? Math.round(((projected-avgPast)/avgPast)*100) : null,
  };
}

function buildAIInsights(){
  const insights = [];
  if(PRODUCTS.length===0 && ORDERS.length===0){
    insights.push("Ajoutez vos premiers produits et fournisseurs : les informations clés apparaîtront ici automatiquement.");
    return insights;
  }
  if(ORDERS.length>0){
    if(financialsHidden()){
      insights.push(`Vous avez passé <b>${ORDERS.length}</b> commande${ORDERS.length>1?'s':''} au total.`);
    } else {
      const totalAchats = ORDERS.reduce((a,o)=>a+o.amount,0);
      const avg = totalAchats/ORDERS.length;
      insights.push(`Vous avez dépensé <b>${fmtEUR(totalAchats)}</b> sur <b>${ORDERS.length}</b> commande${ORDERS.length>1?'s':''} — soit une moyenne de <b>${fmtEUR(avg)}</b> par commande.`);
    }
  } else {
    insights.push("Aucune commande enregistrée pour le moment.");
  }
  const freq = {};
  ORDERS.forEach(o=>(o.lineItems||[]).forEach(li=>{ if(li.productId) freq[li.productId] = (freq[li.productId]||0) + li.qty; }));
  const topId = Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0];
  if(topId){
    const p = PRODUCTS.find(x=>x.id===topId);
    if(p) insights.push(`<b>${escapeHtml(p.name)}</b> est le produit le plus commandé, avec ${freq[topId]} ${p.unit} au total sur votre historique.`);
  }
  if(SUPPLIERS.length){
    const bySpend = SUPPLIERS.map(s=>({s, spend:supplierSpend(s.id)})).filter(x=>x.spend>0).sort((a,b)=>b.spend-a.spend)[0];
    if(bySpend){
      insights.push(financialsHidden()
        ? `<b>${escapeHtml(bySpend.s.name)}</b> est votre fournisseur le plus sollicité.`
        : `<b>${escapeHtml(bySpend.s.name)}</b> est votre fournisseur le plus sollicité, avec ${fmtEUR(bySpend.spend)} d'achats au total.`);
    } else {
      insights.push(`${SUPPLIERS.length} fournisseur${SUPPLIERS.length>1?'s':''} référencé${SUPPLIERS.length>1?'s':''} — aucun achat enregistré pour le moment.`);
    }
  }
  const pending = ORDERS.filter(o=>o.status==='en_attente_validation').length;
  if(pending>0) insights.push(`${pending} commande${pending>1?'s':''} fournisseur${pending>1?'s':''} en attente de votre validation.`);
  // Relance douce : signale le fournisseur le plus longtemps délaissé (au-delà d'un mois), sans
  // rien bloquer — juste une question, au cas où ce serait un oubli plutôt qu'un choix assumé.
  // On ignore les fournisseurs jamais commandés (ce n'est pas un "oubli", juste un nouveau
  // fournisseur pas encore utilisé).
  if(SUPPLIERS.length){
    const REMINDER_THRESHOLD_DAYS = 30;
    const now = new Date();
    const overdue = SUPPLIERS.map(s=>{
        const supplierOrders = ORDERS.filter(o=>o.supplier===s.id && o.status!=='refusee' && o.createdAt);
        if(!supplierOrders.length) return null;
        const lastOrderTime = Math.max(...supplierOrders.map(o=>new Date(o.createdAt).getTime()));
        const daysSince = Math.floor((now - lastOrderTime) / 86400000);
        return { supplier: s, daysSince };
      })
      .filter(x=>x && x.daysSince >= REMINDER_THRESHOLD_DAYS)
      .sort((a,b)=>b.daysSince-a.daysSince)[0];
    if(overdue){
      insights.push(`Aucune commande chez <b>${escapeHtml(overdue.supplier.name)}</b> depuis <b>${overdue.daysSince} jours</b> — un oubli, ou c'est voulu ?`);
    }
  }
  if(insights.length===0) insights.push('Aucune information disponible pour le moment.');
  return insights.slice(0,5);
}

// Amène directement à la file de validation depuis les cartes de résumé du tableau de bord.
// Défilement doux plutôt qu'un saut brutal, pour que la personne garde le fil de la page.
// Révélation au défilement de la page publique. Un seul observateur pour toute la page :
// chaque élément marqué .reveal apparaît quand il entre dans l'écran, avec un léger décalage
// entre voisins d'un même groupe. Le décalage est posé ici puis retiré une fois l'animation
// finie — laissé en CSS, il rendrait les survols mous pendant toute la vie de la page.
let REVEAL_OBSERVER = null;
function armScrollReveals(){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.reveal:not(.revealed)');
  if(!items.length) return;
  // Mouvement réduit : on montre tout immédiatement, sans animation ni observateur.
  if(reduced){ items.forEach(el=>el.classList.add('revealed','reveal-done')); return; }
  if(!REVEAL_OBSERVER){
    REVEAL_OBSERVER = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const el = entry.target;
        const idx = Number(el.dataset.revealIndex || 0);
        el.style.transitionDelay = Math.min(idx, 6) * 70 + 'ms';
        el.classList.add('revealed');
        el.addEventListener('transitionend', ()=>{
          el.style.transitionDelay = '';
          el.classList.add('reveal-done');
        }, { once:true });
        REVEAL_OBSERVER.unobserve(el);
      });
    }, { threshold:0.12, rootMargin:'0px 0px -40px 0px' });
  }
  items.forEach(el=>REVEAL_OBSERVER.observe(el));
  // Filet de sécurité contre le défilement rapide : quand on saute d'un coup vers le bas
  // (molette rapide, touche Fin, lien d'ancrage), l'observateur ne reçoit aucun signal pour
  // les éléments survolés au passage — ils resteraient invisibles pour de bon. Ce balayage
  // révèle tout ce qui se trouve déjà au-dessus du bas de l'écran.
  if(!armScrollReveals._sweepArmed){
    armScrollReveals._sweepArmed = true;
    let pending = false;
    const sweep = () => {
      pending = false;
      const rest = document.querySelectorAll('.reveal:not(.revealed)');
      if(!rest.length) return;
      rest.forEach(el=>{
        if(el.getBoundingClientRect().top < window.innerHeight){
          el.classList.add('revealed');
          el.addEventListener('transitionend', ()=>{
            el.style.transitionDelay = '';
            el.classList.add('reveal-done');
          }, { once:true });
          if(REVEAL_OBSERVER) REVEAL_OBSERVER.unobserve(el);
        }
      });
    };
    const onScroll = () => { if(!pending){ pending = true; requestAnimationFrame(sweep); } };
    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll, { passive:true });
  }
}

function matchesProductSearch(p, q){
  if(!q) return true;
  q = q.toLowerCase();
  if((p.name||'').toLowerCase().includes(q)) return true;
  if((p.cat||'').toLowerCase().includes(q)) return true;
  if((p.supplierReference||'').toLowerCase().includes(q)) return true;
  if(supplierName(p.supplier).toLowerCase().includes(q)) return true;
  if((p.zoneIds||[]).some(zid=>{ const z=ZONES.find(zz=>zz.id===zid); return z && (z.name||'').toLowerCase().includes(q); })) return true;
  return false;
}
function filterProductsList(products, f){
  return products.filter(p=>{
    if(f.search && !matchesProductSearch(p, f.search)) return false;
    if(f.category && f.category!=='tous' && p.cat!==f.category) return false;
    if(f.zone && f.zone!=='tous' && !(p.zoneIds||[]).includes(f.zone)) return false;
    if(f.supplier && f.supplier!=='tous' && p.supplier!==f.supplier) return false;

  });
}
const PRODUCT_SORTERS = {
  'name-asc': (a,b) => (a.name||'').localeCompare(b.name||'', 'fr'),
  'name-desc': (a,b) => (b.name||'').localeCompare(a.name||'', 'fr'),
  'price-asc': (a,b) => (a.price||0) - (b.price||0),
  'price-desc': (a,b) => (b.price||0) - (a.price||0),
  'category-asc': (a,b) => (a.cat||'').localeCompare(b.cat||'', 'fr') || (a.name||'').localeCompare(b.name||'', 'fr'),

function sortProductsList(products, sortKey){

  return products.slice().sort(sorter);

function groupProductsByCategory(products){

// INVENTAIRE — relevé simple de stock, sans réconciliation théorique. Le dernier relevé de
// chaque produit se déduit simplement du STOCK_COUNTS le plus récent le concernant (les
// entrées arrivent déjà triées du plus récent au plus ancien depuis le serveur).
// ============================================================
function lastStockCountForProduct(productId){
  return STOCK_COUNTS.find(c=>c.productId===productId) || null;
}
// L'unité d'un produit est un champ libre (pas une liste fermée) — on ne peut donc pas se fier
// à une liste figée pour savoir si une fraction a du sens. Seules les unités de poids/volume
// sont "continues" (2,5 Kg a un sens) ; tout le reste — Pièce, Carton, Caisse, Bouteille, ou
// n'importe quelle unité personnalisée tapée par le restaurateur — est traité comme "discret"
// (un nombre entier, jamais de virgule), ce qui reste le choix le plus sûr par défaut.
const INVENTORY_CONTINUOUS_UNITS = ['kg','g','litre','l','ml','cl'];
function isDiscreteInventoryUnit(unit){
  return !INVENTORY_CONTINUOUS_UNITS.includes((unit||'').trim().toLowerCase());
}
// Un seul format pour tout le module (affichage du dernier relevé, PDF) — jamais les 3 à 4
// décimales brutes renvoyées par le serveur (NUMERIC(10,3) en base), toujours une virgule
// française, et le bon nombre de décimales selon que l'unité se compte ou se pèse/mesure.
function formatInventoryQty(quantity, unit){
  const n = Number(quantity);
  if(Number.isNaN(n)) return '—';
  const discrete = isDiscreteInventoryUnit(unit);
  return n.toLocaleString('fr-FR', { minimumFractionDigits: discrete?0:1, maximumFractionDigits: discrete?0:1 });
}
// Repli/dépli d'une catégorie — volontairement PAS un render() complet, contrairement à la page
// Produits : ça effacerait les quantités déjà saisies dans les autres lignes encore visibles.
// L'état replié vit dans state (state.collapsedInventaireCategories), séparé de celui de la page
// Produits, pour ne jamais faire disparaître une catégorie ici parce qu'elle était repliée
// là-bas — chaque page garde sa propre mémoire.

// Filtre par simple affichage/masquage des lignes déjà présentes dans le DOM — surtout pas un
// re-rendu de la page à chaque frappe, qui effacerait les quantités déjà saisies par quelqu'un
// en train de parcourir sa réserve avec la recherche ouverte à côté. Combine recherche ET repli
// de catégorie en une seule passe : une ligne n'est visible que si elle correspond à la
// recherche ET que sa catégorie n'est pas repliée. Un groupe reste visible dès qu'il contient au

function filterInventaireRows(){

  const categoriesWithMatch = new Set();
  document.querySelectorAll('#inv-table .inv-row').forEach(row=>{
    const cat = row.dataset.category;
    const matchesSearch = row.dataset.search.includes(q);
    if(matchesSearch) categoriesWithMatch.add(cat);
    row.style.display = (matchesSearch && !collapsedCats[cat]) ? '' : 'none';
  });
  document.querySelectorAll('#inv-table .group-row').forEach(header=>{
    header.style.display = categoriesWithMatch.has(header.dataset.categoryGroup) ? '' : 'none';
  });
  const noMatchEl = document.getElementById('inv-no-match');
  if(noMatchEl) noMatchEl.style.display = categoriesWithMatch.size ? 'none' : '';
}

                // la mention explicite évitent toute confusion avec un relevé fait à la main, sans
                // recourir à une couleur étrangère à la palette noir/blanc/gris du reste du site.
                lastText = `<span title="Estimation : dernier comptage connu + quantité reçue depuis, pas un vrai comptage"><span style="font-weight:600;font-style:italic;">≈ ${formatInventoryQty(last.quantity, last.unit||p.unit)} ${escapeHtml(last.unit||p.unit||'')}</span> <span class="small muted">— estimation, via commande le ${fmtDateShort(last.createdAt)}</span></span>`;
              } else {
                // Même logique de couleur pour un vrai comptage manuel — la valeur elle-même se
                // distingue visuellement du reste de la ligne, pas seulement l'attribution.
                lastText = `<span style="font-weight:600;">${formatInventoryQty(last.quantity, last.unit||p.unit)} ${escapeHtml(last.unit||p.unit||'')}</span> <span class="small muted">— ${escapeHtml(last.countedByName||'')}, ${fmtDateShort(last.createdAt)}</span>`;
              }
              const discreteUnit = isDiscreteInventoryUnit(p.unit);
              return `<tr class="tr-hover inv-row" data-category="${escapeHtml(g.category)}" data-search="${escapeHtml((p.name+' '+(p.cat||'')+' '+(p.packaging||'')).toLowerCase())}">
                <td data-label="Produit" style="font-weight:600;">${escapeHtml(p.name)}${p.packaging?`<div class="small muted" style="font-weight:400;">${escapeHtml(p.packaging)}</div>`:''}</td>
                <td data-label="Dernier relevé">${lastText}</td>
                <td data-label="Nouveau relevé"><input type="number" min="0" step="${discreteUnit?'1':'0.1'}" placeholder="Ex : ${discreteUnit?'10':'2.5'}" data-inv-product-id="${p.id}" data-inv-discrete="${discreteUnit?'1':'0'}" class="inv-count-input" oninput="updateInventoryPendingLabel()"> <span class="small muted">${escapeHtml(p.unit||'')}</span></td>
              </tr>`;
            }).join('');
            return groupHeader + itemRows;
          }).join('')}
        </table>
        <div id="inv-no-match" class="small muted" style="display:none;padding:14px 4px 4px 4px;">Aucun produit ne correspond à cette recherche.</div>
      </div>
      <!-- Barre d'enregistrement flottante : avec un catalogue de 100 produits, un bouton placé
           tout en bas du tableau obligeait à refaire défiler toute la page après chaque saisie.
           Ici elle reste visible en permanence, et indique combien de quantités sont en attente
           d'enregistrement — un rappel utile avant de quitter la page. -->
      <div id="inv-save-bar">
        <span class="small muted" id="inv-pending-label">Aucune quantité saisie pour l'instant</span>
        <button class="btn btn-primary" onclick="saveInventoryCounts()">Enregistrer tout l'inventaire</button>
      </div>
      <div class="inventaire-bottom-space" aria-hidden="true"></div>
    ` : emptyState("Aucun produit au catalogue pour l'instant — ajoutez vos produits avant de pouvoir faire un inventaire.")}
  `;
}
async function saveInventoryCounts(category){
  // category (optionnel) : n'enregistre que les produits de cette catégorie. Sans argument,
  // enregistre tout ce qui a été rempli sur la page.
  const all = Array.from(document.querySelectorAll('.inv-count-input'));
  const scoped = category
    ? all.filter(el => el.closest('tr') && el.closest('tr').dataset.category === category)
    : all;
  const inputs = scoped.filter(el=>el.value !== '');
  if(!inputs.length){
    toast(category ? `Renseignez au moins une quantité dans « ${category} » avant d'enregistrer` : "Renseignez au moins une quantité avant d'enregistrer", 'alert');
    return;
  }
  // L'attribut HTML min="0" sur le champ n'empêche pas vraiment de saisir un nombre négatif
  // (contournable) — la vraie vérification doit se faire ici, avec un message clair plutôt
  // qu'un rejet silencieux côté serveur.
  const negative = inputs.filter(el=>parseFloat(el.value) < 0);
  if(negative.length){ toast('Une quantité ne peut pas être négative', 'alert'); return; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  const countedByName = currentPersonDisplayName();
  const counts = inputs.map(el=>{
    const p = PRODUCTS.find(x=>x.id===el.dataset.invProductId);
    const raw = parseFloat(el.value);
    // Arrondie ici selon le type d'unité, pour que ce qui est enregistré corresponde toujours
    // à ce qui sera ensuite affiché (voir formatInventoryQty) — jamais une valeur à 3 décimales
    // conservée en base pour un produit qui se compte à la pièce.
    const quantity = el.dataset.invDiscrete==='1' ? Math.round(raw) : Math.round(raw*10)/10;
    return { productId: p?p.remoteId:null, localId: el.dataset.invProductId, quantity, unit: p?p.unit:'' };
  }).filter(c=>c.productId!=null && !isNaN(c.quantity));
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/stock-counts/bulk`, {
      method:'POST', body:{ counts: counts.map(c=>({productId:c.productId, quantity:c.quantity})), countedByName },
    });
    // On reconstruit localement plutôt que de resynchroniser entièrement — plus rapide, et le
    // serveur a de toute façon renvoyé exactement ce qu'il a enregistré.
    const newEntries = data.stockCounts.map(c=>{
      const localProduct = PRODUCTS.find(p=>p.remoteId===c.product_id);
      return {
        id:'sc'+c.id, remoteId:c.id, productId: localProduct?localProduct.id:null,
        productNameSnapshot: c.product_name_snapshot, quantity: parseFloat(c.quantity), unit: c.unit,
        countedByName: c.counted_by_name, createdAt: new Date(c.created_at),
        source: c.source || 'manuel', orderId: c.order_id || null,
      };
    });
    STOCK_COUNTS = [...newEntries, ...STOCK_COUNTS];
    ensureRestoData(state.resto).stockCounts = STOCK_COUNTS;
    toast(`${newEntries.length} relevé${newEntries.length>1?'s':''} enregistré${newEntries.length>1?'s':''}`);
    // Mise à jour ciblée du DOM plutôt qu'un render() complet : un rendu entier effacerait les
    // quantités déjà tapées dans les AUTRES catégories, que la personne n'a pas encore
    // enregistrées — exactement le problème qu'on cherche à éviter en scindant par catégorie.
    updateInventoryRowsAfterSave(inputs, newEntries);
  } catch(err){
    toast(err.message, 'alert');
  }
}
// Met à jour uniquement les lignes qui viennent d'être enregistrées : vide leur champ de
// saisie et rafraîchit leur colonne "Dernier relevé" avec la nouvelle valeur. Les autres
// lignes, y compris celles où une quantité est déjà tapée mais pas encore enregistrée, ne sont
// pas touchées — c'est tout l'intérêt de pouvoir enregistrer catégorie par catégorie.
function updateInventoryRowsAfterSave(inputs, newEntries){
  inputs.forEach(el => {
    const productId = el.dataset.invProductId;
    const entry = newEntries.find(e => e.productId === productId);
    const row = el.closest('tr');
    el.value = '';
    if(entry && row){
      const cell = row.querySelector('[data-label="Dernier relevé"]');
      if(cell){
        const p = PRODUCTS.find(x=>x.id===productId) || {};
        cell.innerHTML = `<span style="font-weight:600;">${formatInventoryQty(entry.quantity, entry.unit||p.unit)} ${escapeHtml(entry.unit||p.unit||'')}</span> <span class="small muted">— ${escapeHtml(entry.countedByName||'')}, ${fmtDateShort(entry.createdAt)}</span>`;
      }
    }
  });
  updateInventoryPendingLabel();
}

function updateInventoryPendingLabel(){
  const label = document.getElementById('inv-pending-label');
  if(!label) return;
  const n = Array.from(document.querySelectorAll('.inv-count-input')).filter(el=>el.value.trim() !== '').length;
  label.textContent = n === 0
    ? "Aucune quantité saisie pour l'instant"
    : `${n} quantité${n>1?'s':''} saisie${n>1?'s':''}, pas encore enregistrée${n>1?'s':''}`;
  label.style.color = n > 0 ? 'var(--text)' : '';
  label.style.fontWeight = n > 0 ? '600' : '';
}

// FICHES TECHNIQUES — une carte par plat, dépliable pour voir le détail des ingrédients. Le
// food cost (coût matière / prix de vente) est un repère indicatif courant en restauration,
// jamais présenté comme une vérité comptable stricte — voir recipeMargin() pour le détail du
// calcul et de ce qu'il compare exactement (coût HT contre prix de vente TTC).

function foodCostTag(pct){
  if(pct==null) return '';
  const cls = pct<=30 ? 'tag-subtle' : pct<=38 ? 'tag-neutral' : 'tag-red';
  // Virgule décimale française, comme partout ailleurs sur le site (fmtEUR, quantités…) — un
  // "30.7%" au format anglo-saxon détonnait au milieu de montants affichés "7,36 €".
  return `<span class="tag ${cls}">${pct.toLocaleString('fr-FR', {maximumFractionDigits:1})}&nbsp;% food cost</span>`;
}

async function saveNewRecipe(){
  const name = document.getElementById('rc-name').value.trim();
  if(!name){ toast('Le nom du plat est requis', 'alert'); return; }
  const priceEl = document.getElementById('rc-price');
  const sellingPriceTtc = priceEl.value !== '' ? parseFloat(priceEl.value) : null;
  const category = document.getElementById('rc-category').value.trim();
  const yieldQtyEl = document.getElementById('rc-yield-qty');
  const yieldUnitEl = document.getElementById('rc-yield-unit');
  const yieldQty = yieldQtyEl && yieldQtyEl.value !== '' ? parseFloat(yieldQtyEl.value) : null;
  const yieldUnit = yieldUnitEl && yieldUnitEl.value !== '' ? yieldUnitEl.value : null;
  // Un rendement négatif ou nul n'a aucun sens (on ne peut pas diviser un coût par une quantité
  // négative ou par zéro) — sans cette vérification, ça produirait un coût par gramme négatif
  // ou infini partout où cette fiche est utilisée comme sous-recette.
  if(yieldQty!=null && yieldQty<=0){ toast('Le rendement doit être supérieur à zéro', 'alert'); return; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/recipes`, {
      method:'POST', body:{ name, sellingPriceTtc, category, yieldQty, yieldUnit },
    });
    const newRecipe = { id:'rc'+data.recipe.id, remoteId:data.recipe.id, name:data.recipe.name, sellingPriceTtc:data.recipe.selling_price_ttc!=null?parseFloat(data.recipe.selling_price_ttc):null, category:data.recipe.category, yieldQty, yieldUnit };
    RECIPES.push(newRecipe);
    closeModal();
    toast('Fiche créée — ajoutez ses ingrédients');
    state.expandedRecipeId = newRecipe.id;
    render();
  } catch(err){ toast(err.message, 'alert'); }
}

async function confirmDeleteRecipe(id){
  const r = RECIPES.find(x=>x.id===id); if(!r) return;
  const resto = RESTOS.find(rr=>rr.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/recipes/${r.remoteId}`, { method:'DELETE' });
    RECIPES = RECIPES.filter(x=>x.id!==id);
    RECIPE_INGREDIENTS = RECIPE_INGREDIENTS.filter(x=>x.recipeId!==id);
    // Si d'autres fiches utilisaient celle-ci comme sous-recette, leur référence doit refléter
    // sa disparition — exactement ce que fait déjà le serveur (ON DELETE SET NULL), reproduit
    // ici pour ne pas attendre une resynchronisation avant que ça s'affiche correctement.
    RECIPE_INGREDIENTS.forEach(ing => { if(ing.subRecipeId===id) ing.subRecipeId = null; });
    ensureRestoData(state.resto).recipes = RECIPES;
    ensureRestoData(state.resto).recipeIngredients = RECIPE_INGREDIENTS;
    closeModal();
    toast('Fiche supprimée');
    render();
  } catch(err){ toast(err.message, 'alert'); }
}
// Construit le sélecteur produit/sous-recette, partagé entre "ajouter" et "modifier" — un
// préfixe distinct pour chaque contexte (identifiants HTML différents, pour ne jamais mélanger
// les deux si un jour ils devaient coexister), et une présélection optionnelle pour l'édition

function renderIngredientPickerHtml(recipeId, prefix, preselectedName, preselectedType){
  const list = PRODUCTS.slice().sort((a,b)=>a.name.localeCompare(b.name));
  // Une fiche technique n'est utilisable comme sous-recette QUE si son rendement est renseigné
  // (sinon impossible de calculer un coût par gramme) — et jamais elle-même, pour empêcher une
  // auto-référence directe dès la sélection (la protection contre les boucles plus indirectes
  // reste de toute façon assurée par le calcul lui-même, voir recipeCostBreakdown).
  const subRecipeOptions = RECIPES.filter(r=>r.id!==recipeId && r.yieldQty && r.yieldUnit).sort((a,b)=>a.name.localeCompare(b.name));
  const isSelected = (name, type) => preselectedName===name && preselectedType===type;
  return `

function selectIngredientProduct(el, prefix){
  prefix = prefix || 'ing';
  selectProductPickerRow(el, prefix+'-product-id', prefix+'-picker');
  const type = el.dataset.type;
  document.getElementById(prefix+'-source-type').value = type;
  // Une sous-recette n'a pas d'"unité d'achat" à proprement parler, mais son rendement (ex.
  // "500g") joue exactement le même rôle pour le calcul — on le fait donc passer par la même
  // fonction de conversion, en le présentant comme si c'était l'unité d'un produit.
  const source = type==='recipe' ? RECIPES.find(r=>r.name===el.dataset.name) : PRODUCTS.find(p=>p.name===el.dataset.name);
  const compatible = source ? recipeCompatibleUnits(type==='recipe' ? { unit: source.yieldUnit } : source) : [];
  const select = document.getElementById(prefix+'-unit');
  const previousUnit = select.value;
  select.innerHTML = compatible.map(u=>`<option value="${escapeHtml(u)}" ${u===previousUnit?'selected':''}>${escapeHtml(u)}</option>`).join('');
  updateIngredientUnitHint(prefix);
}
// Quand la seule unité proposée est celle de l'achat lui-même (ex. "Caisse"), c'est presque
// toujours parce qu'aucun contenu net n'a été renseigné sur le produit — plutôt que de laisser
// deviner pourquoi, on l'explique directement ici, avec le geste exact pour le corriger. Ne
// s'applique qu'aux produits : une sous-recette propose toujours g/Kg ou mL/cl/Litre dès lors
// qu'elle apparaît dans la liste (son rendement est alors forcément déjà renseigné).
function updateIngredientUnitHint(prefix){
  prefix = prefix || 'ing';
  const type = document.getElementById(prefix+'-source-type').value;
  const hint = document.getElementById(prefix+'-unit-hint');
  if(!hint) return;
  if(type==='recipe'){ hint.innerHTML = ''; return; }
  const productName = document.getElementById(prefix+'-product-id').value;
  const product = PRODUCTS.find(p=>p.name===productName);
  if(!product){ hint.innerHTML = ''; return; }
  const compatible = recipeCompatibleUnits(product);
  const onlyPurchaseUnit = compatible.length===1 && compatible[0]===(product.unit||'unité') && !recipeUnitGroup(product.unit);
  hint.innerHTML = onlyPurchaseUnit
    ? `Seule l'unité d'achat (${escapeHtml(product.unit||'unité')}) est disponible pour ce produit. Pour pouvoir utiliser des grammes ou des cl dans une recette, renseignez son contenu net dans <a href="#" onclick="closeModal();editProduct('${product.id}');return false;">sa fiche produit</a> — ex. « cette Caisse contient 10 Kg ».`
    : '';
}
async function saveNewIngredient(recipeId){
  const r = RECIPES.find(x=>x.id===recipeId); if(!r) return;
  const sourceType = document.getElementById('ing-source-type').value;
  const sourceName = document.getElementById('ing-product-id').value;
  if(!sourceName){ toast('Merci de sélectionner un produit ou une fiche technique', 'alert'); return; }
  const quantity = parseFloat(document.getElementById('ing-quantity').value);
  if(!quantity || quantity<=0){ toast('Merci de saisir une quantité valide', 'alert'); return; }
  const unit = document.getElementById('ing-unit').value;
  const resto = RESTOS.find(rr=>rr.id===state.resto);
  try{
    if(sourceType==='recipe'){
      const subRecipe = RECIPES.find(x=>x.name===sourceName);
      if(!subRecipe){ toast('Fiche technique introuvable', 'alert'); return; }
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/recipes/${r.remoteId}/ingredients`, {
        method:'POST', body:{ subRecipeId: subRecipe.remoteId, productName: subRecipe.name, quantity, unit },
      });
      RECIPE_INGREDIENTS.push({
        id:'ri'+data.ingredient.id, remoteId:data.ingredient.id, recipeId,
        subRecipeId: subRecipe.id, productId: null, productNameSnapshot: subRecipe.name, quantity, unit,
      });
    } else {
      const product = PRODUCTS.find(p=>p.name===sourceName);
      if(!product){ toast('Merci de sélectionner un produit', 'alert'); return; }
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/recipes/${r.remoteId}/ingredients`, {
        method:'POST', body:{ productId: product.remoteId, productName: product.name, quantity, unit },
      });
      RECIPE_INGREDIENTS.push({
        id:'ri'+data.ingredient.id, remoteId:data.ingredient.id, recipeId,
        productId: product.id, subRecipeId: null, productNameSnapshot: product.name, quantity, unit,
        currentProductPrice: product.price, currentProductUnit: product.unit, currentProductTvaRate: product.tvaRate,
        currentProductNetContentQty: product.netContentQty, currentProductNetContentUnit: product.netContentUnit,
      });
    }
    closeModal();
    toast('Ingrédient ajouté');
    render();
  } catch(err){ toast(err.message, 'alert'); }
}

function orderInPeriod(o, period){
  if(period==='tous') return true;
  const d = o.createdAt ? new Date(o.createdAt) : null;
  if(!d) return true;
  const now = new Date();
  if(period==='mois') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if(period==='trimestre'){ const diffMonths = (now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth()); return diffMonths>=0 && diffMonths<3; }
  if(period==='annee') return d.getFullYear()===now.getFullYear();
  return true;
}
