              ${item.img && AIDE_REFERENCE_IMAGES[item.img] ? `<img src="${AIDE_REFERENCE_IMAGES[item.img].data}" alt="${escapeHtml(AIDE_REFERENCE_IMAGES[item.img].desc)}" class="faq-image">` : ''}

}
function filterAideFaq(value){
  state.aideSearch = value;
  render();
  const input = document.querySelector('#app .field input[type="text"]');
  if(input){ input.focus(); const v = input.value; input.value=''; input.value=v; }
}
function toggleAideItem(key){
  state.aideOpenItem = (state.aideOpenItem === key) ? null : key;
  render();
}
function escapeHtml(str){
  // Échappe aussi les guillemets (en plus de < > &), pour être sûr même quand le texte est
  // inséré dans un attribut HTML (ex : value="...") et pas seulement dans du contenu visible —
  // sinon un texte contenant un guillemet pourrait sortir de l'attribut et injecter du code.
  if(str==null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function saveNotifSettings(role){
  const cfg = NOTIF_STATE[role];
  const email = document.getElementById('notif-email').value.trim();
  if(!email || !email.includes('@')){ toast('Adresse email invalide','alert'); return; }
  cfg.email = email;
  cfg.enabled = document.getElementById('notif-enabled').checked;
  notifEventsForRole(role).forEach(ev=>{
    cfg.events[ev.key] = document.getElementById('notif-ev-'+ev.key).checked;
  });
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/notification-settings`, {
      method:'PATCH', body:{ role, settings: cfg },
    });
    toast('Préférences enregistrées');
    if(cfg.enabled) notifyByEmail(role, "confirmation : vos notifications arriveront ici désormais.");
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

async function validateOrder(id){
  if(!requirePerm(['patron'], 'Seul le patron peut valider une commande')) return;
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}`, { method:'PATCH', body:{ status:'validee' } });
    o.status = 'validee';
    toast('Commande '+id+' validée');
    notifyByEmail('manager', `commande ${id} validée par le patron — prête à réceptionner.`, 'commandes');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function refuseOrder(id){
  if(!requirePerm(['patron'], 'Seul le patron peut refuser une commande')) return;
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}`, { method:'PATCH', body:{ status:'refusee' } });
    o.status = 'refusee';
    toast('Commande '+id+' refusée', 'alert');
    notifyByEmail('manager', `commande ${id} refusée par le patron.`, 'commandes');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function updateReceiveSummary(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  let receivedTotal = 0;
  let hasDiscrepancy = false;
  (o.lineItems||[]).forEach((li,idx)=>{
    const qtyInput = document.getElementById('rcv-qty-'+idx);
    const priceInput = document.getElementById('rcv-price-'+idx);
    const qty = qtyInput ? parseFloat(qtyInput.value)||0 : li.qty;
    const price = priceInput ? parseFloat(priceInput.value)||0 : li.price;
    receivedTotal += qty*price;
    if(qty !== Number(li.qty) || price !== Number(li.price)) hasDiscrepancy = true;
  });
  const expectedTotal = (o.lineItems||[]).reduce((sum,li)=>sum+(Number(li.qty)||0)*(Number(li.price)||0),0);
  const totalEl = document.getElementById('rcv-total-received');
  if(totalEl) totalEl.textContent = receivedTotal.toFixed(2)+' €';
  const diffRow = document.getElementById('rcv-diff-row');
  if(diffRow){
    const diff = receivedTotal - expectedTotal;
    diffRow.innerHTML = hasDiscrepancy
      ? `<span class="small" style="color:var(--urgent);font-weight:700;">⚠ Écart détecté</span><span class="mono" style="color:var(--urgent);font-weight:700;">${diff>=0?'+':''}${diff.toFixed(2)} €</span>`
      : `<span class="small muted">Aucun écart pour l'instant</span><span class="mono muted">0.00 €</span>`;
  }
}
function openReceiveOrderModal(id){
  if(!['manager','cuisine','patron'].includes(state.role)){ toast('Seuls le patron, le manager et la cuisine peuvent confirmer une réception','alert'); return; }
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  if(o.status!=='validee'){ toast("Cette commande doit d'abord être validée", 'alert'); return; }
  const hideFin = financialsHidden();
  const lines = (o.lineItems||[]).map((li,idx)=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const name = p ? p.name : (li.name || 'Article');
    const unit = p ? p.unit : '';
    return `
      <div class="receive-line" data-idx="${idx}" style="padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">${name}</div>
        <div class="field-row">
          <div class="field"><label>Quantité commandée</label><input value="${li.qty}" disabled style="opacity:0.6;"></div>
          <div class="field"><label>Quantité reçue</label><input type="number" step="0.01" id="rcv-qty-${idx}" value="${li.qty}" oninput="updateReceiveSummary('${id}')"></div>
        </div>
        ${hideFin ? '' : `
        <div class="field-row">
          <div class="field"><label>Prix attendu (€)</label><input value="${li.price!=null?Number(li.price).toFixed(2):'—'}" disabled style="opacity:0.6;"></div>
          <div class="field"><label>Prix facturé (€)</label><input type="number" step="0.01" id="rcv-price-${idx}" value="${li.price!=null?Number(li.price):0}" oninput="updateReceiveSummary('${id}')"></div>
        </div>`}
      </div>
    `;
  }).join('');
  const expectedTotal = (o.lineItems||[]).reduce((sum,li)=>sum+(Number(li.qty)||0)*(Number(li.price)||0),0);
  openModal(`
    <button class="modal-close" onclick="closeModal()">${iconSm(I.x)}</button>
    <h3>Réceptionner la commande ${o.id}</h3>
    <div class="modal-sub">Vérifiez ce qui a vraiment été livré${hideFin?'':' et facturé'} — les écarts éventuels seront signalés automatiquement.</div>
    <div style="max-height:320px;overflow-y:auto;">${lines || emptyState('Aucun article détaillé sur cette commande')}</div>
    ${hideFin ? '' : `

async function confirmReceiveOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const receivedLineItems = (o.lineItems||[]).map((li,idx)=>{
    const qtyInput = document.getElementById('rcv-qty-'+idx);
    const priceInput = document.getElementById('rcv-price-'+idx);
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    return {
      productId: p ? p.remoteId : null, name: p ? p.name : li.name,
      qtyOrdered: li.qty, qtyReceived: qtyInput ? parseFloat(qtyInput.value)||0 : li.qty,
      priceOrdered: li.price, priceReceived: priceInput ? parseFloat(priceInput.value)||0 : li.price,
    };
  });
  const updateCatalogEl = document.getElementById('rcv-update-catalog');
  const updateCatalogPrices = updateCatalogEl ? updateCatalogEl.checked : false;
  const photoPreview = document.getElementById('rcv-photo-preview');
  const deliveryNotePhotoUrl = (photoPreview && photoPreview.dataset.value) || null;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}/receive`, {
      method:'PATCH', body:{ receivedLineItems, updateCatalogPrices, deliveryNotePhotoUrl },
    });
    o.status = 'livree';
    o.hasDiscrepancy = data.order.has_discrepancy;
    o.lineItems = (data.order.line_items||[]).map(li=>{
      const localProduct = li.productId ? PRODUCTS.find(p=>p.remoteId===li.productId) : null;
      return { ...li, productId: localProduct ? localProduct.id : null };
    });
    o.amount = parseFloat(data.order.amount);
    if(updateCatalogPrices){
      receivedLineItems.forEach(li=>{
        if(!li.productId) return;
        const localProduct = PRODUCTS.find(p=>p.remoteId===li.productId);
        if(localProduct && li.priceReceived != null) localProduct.price = li.priceReceived;
      });
    }
    closeModal();
    toast(data.order.has_discrepancy ? 'Réception confirmée — écart détecté par rapport à la commande' : 'Livraison réceptionnée — tout correspond à la commande');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function recomputeOrderTotals(o){
  let amount = 0;
  const parts = [];
  (o.lineItems||[]).forEach(li=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const price = p ? p.price : (li.price||0);
    const name = p ? p.name : (li.name||'Article');
    const unit = p ? p.unit : '';
    amount += li.qty*price;
    parts.push(unit ? `${name} × ${li.qty} ${unit}` : `${name} × ${li.qty}`);
  });
  o.amount = Math.round(amount*100)/100;
  o.items = parts.join(', ');
}

function addLineToOrder(orderId){
  const o = ORDERS.find(x=>x.id===orderId); if(!o) return;

  const o = ORDERS.find(x=>x.id===orderId); if(!o) return;

   d'approuver la demande.
============================================================ */
async function submitSignal(from, urgent){
  const item = document.getElementById('sig-item').value;
  const note = document.getElementById('sig-note').value;
  if(!item){ toast('Merci de sélectionner un produit','alert'); return; }
  const prod = PRODUCTS.find(p=>p.name===item);
  const author = currentPersonDisplayName();
  const now = new Date();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const byName = author + ' ('+(from==='Cuisine'?'cuisine':'salle')+')';
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/requests`, {
      method:'POST',
      body:{ fromDept: from, itemName: item, unit: prod?prod.unit:'unité', urgent, note, byName },
    });
    REQUESTS.unshift({
      id:'D-'+nextId(), remoteId: data.request.id, from, by: byName,
      item, unit: prod?prod.unit:'unité', urgent, note, status:'attente', time: fmtTime(now), createdAt: now,
      createdByMemberId: data.request.created_by_member_id,
    });
    closeModal();
    const recipient = from==='Cuisine' ? 'patron' : 'manager';
    toast(urgent ? `Commande urgente signalée au ${recipient}` : `Demande envoyée au ${recipient}`);
    if(urgent){
      if(from==='Salle') notifyByEmail('manager', `commande urgente signalée : ${item} (par ${author}).`, 'demandes');
      notifyByEmail('patron', `commande urgente signalée : ${item} (par ${author}).`, 'urgent');
    }
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function compressImageFile(file, maxDim, quality, callback){
  if(!file.type.startsWith('image/')){ toast('Merci de choisir un fichier image','alert'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Redimensionne et compresse avant de stocker, pour qu'une photo prise avec un
      // téléphone (souvent plusieurs Mo) reste toujours légère et rapide à charger.
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleProductPhotoUpload(input, prefix){
  const file = input.files && input.files[0];
  if(!file) return;
  compressImageFile(file, 1200, 0.75, (compressed) => {

    if(preview){
      preview.innerHTML = `<img src="${compressed}" alt="Photo" style="width:64px;height:64px;border-radius:8px;object-fit:cover;margin-bottom:8px;">`;
      preview.dataset.value = compressed;
    }
  });
}

async function createCategoryIfNeeded(selectEl){

async function createOrder(){
  const supplierId = document.getElementById('ord-supplier').value;
  const rows = document.querySelectorAll('.ord-row');
  let addedCount = 0;
  for(const row of rows){
    const pid = row.dataset.pid;
    const chk = document.getElementById('ord-chk-'+pid);
    const qtyInput = document.getElementById('ord-qty-'+pid);
    if(chk && chk.checked){
      const qty = Math.round(parseFloat(qtyInput.value)) || 0;
      if(qty>0){
        await addToBasket(supplierId, pid, qty);
        addedCount++;
      }
    }
  }
  if(addedCount===0){ toast('Sélectionnez au moins un produit avec une quantité','alert'); return; }
  closeModal();
  toast('Ajouté au panier ' + supplierName(supplierId));
  setView('commandes');
}

function orderStatusLabel(s){
  if(s==='en_attente_validation') return 'En attente de validation';
  if(s==='validee') return 'Validée — en attente de réception';
  if(s==='livree') return 'Livrée';
  if(s==='refusee') return 'Refusée';
  return s;
}
function orderDocLines(o){
  if(o.lineItems && o.lineItems.length){
    return o.lineItems.map(li=>{
      if(!li.productId){
        // ligne d'achat personnalisé (hors catalogue) : nom/prix saisis directement
        const price = li.price || 0;
        return {name: li.name || o.items, qty: li.qty, unit:'', price, total: Math.round(li.qty*price*100)/100};
      }
      const p = PRODUCTS.find(x=>x.id===li.productId);
      const name = p ? p.name : o.items;
      const unit = p ? p.unit : '';
      const price = p ? p.price : (li.qty ? o.amount/li.qty : o.amount);
      return {name, qty:li.qty, unit, price, total:Math.round(li.qty*price*100)/100};
    });
  }
  return [{name:o.items||'Article', qty:1, unit:'', price:o.amount, total:o.amount}];
}

function downloadHtmlFile(filename, innerHtml){
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${filename}</title><style>${INVOICE_STANDALONE_CSS}</style></head><body>${innerHtml}</body></html>`;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Document téléchargé');
}

    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}

/* ============================================================
   BON DE COMMANDE — génération PDF (jsPDF) et envoi par email au fournisseur
============================================================ */
function buildOrderPdf(o){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
  const marginX = 15;
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text(resto ? resto.name : 'Restaurant', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  y += 7;
  if(resto && resto.address){ doc.text(resto.address, marginX, y); y += 5; }
  if(resto && (resto.postalCode || resto.city)){ doc.text(`${escapeHtml(resto.postalCode||'')} ${escapeHtml(resto.city||'')}`.trim(), marginX, y); y += 5; }

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('BON DE COMMANDE', 195, 20, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Référence : ${o.id}`, 195, 27, { align:'right' });
  doc.text(`Date : ${o.date || fmtDateShort(o.createdAt||new Date())}`, 195, 32, { align:'right' });

  y += 10;
  doc.setDrawColor(220,220,215); doc.line(marginX, y, 195, y);
  y += 8;
  doc.setFont('helvetica','bold'); doc.text('Fournisseur', marginX, y);
  doc.setFont('helvetica','normal'); y += 6;
  doc.text(supplier ? supplier.name : 'Fournisseur', marginX, y); y += 5;
  if(supplier && supplier.address){ doc.text(supplier.address, marginX, y); y += 5; }
  if(supplier && supplier.email){ doc.text(supplier.email, marginX, y); y += 5; }

  y += 8;
  const hideFin = financialsHidden();
  const rows = (o.lineItems||[]).map(li=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const name = p ? p.name : (li.name || 'Article');
    const unit = p ? p.unit : '';
    const price = li.priceReceived != null ? li.priceReceived : (li.price != null ? li.price : (p?p.price:0));
    const qty = li.qtyReceived != null ? li.qtyReceived : li.qty;
    return hideFin
      ? [name, `${qty} ${unit}`.trim()]
      : [name, `${qty} ${unit}`.trim(), `${Number(price).toFixed(2)} €`, `${(Number(qty)*Number(price)).toFixed(2)} €`];
  });
  doc.autoTable ? doc.autoTable({
    startY: y, margin:{left:marginX,right:15},
    head: hideFin ? [['Article','Quantité']] : [['Article','Quantité','Prix unitaire','Total']],
    body: rows,
    styles:{ font:'helvetica', fontSize:10, textColor:[30,30,30] },
    headStyles:{ fillColor:[20,20,20], textColor:255 },
    theme:'grid',
  }) : null;
  if(!hideFin){
    const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : y + 10 + rows.length*8;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`Total : ${fmtEUR(o.amount)}`, 195, finalY, { align:'right' });
  }

  return doc;
}
function openOrderPdfOptions(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
  openModal(`
    <button class="modal-close" onclick="closeModal()">${iconSm(I.x)}</button>
    <h3>Bon de commande ${o.id}</h3>
    <div class="modal-sub">${escapeHtml(supplier?supplier.name:'')}</div>
    <button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="downloadOrderPdf('${id}')">${iconSm(I.doc)} Télécharger le PDF</button>
    ${supplier && supplier.email
      ? `<button class="btn btn-ghost btn-block" onclick="emailOrderPdf('${id}')">${iconSm(I.mail)} Envoyer par email à ${escapeHtml(supplier.email)}</button>`
      : `<div class="small muted">Ajoutez un email à ce fournisseur pour pouvoir le lui envoyer directement.</div>`}
  `);
}
function downloadOrderPdf(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const doc = buildOrderPdf(o);
  doc.save(`bon-de-commande-${o.id}.pdf`);
  closeModal();
}
async function emailOrderPdf(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
  if(!supplier || !supplier.email){ toast("Ce fournisseur n'a pas d'adresse email enregistrée",'alert'); return; }
  const doc = buildOrderPdf(o);
  const base64 = doc.output('datauristring').split(',')[1];
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}/send-pdf`, {
      method:'POST',
      body:{ to: supplier.email, filename:`bon-de-commande-${o.id}.pdf`, pdfBase64: base64 },
    });
    toast('Bon de commande envoyé à '+supplier.email);
    closeModal();
  } catch(err){
    toast(err.message, 'alert');
  }
}

        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},

async function completeSetupRestaurant(){
  const fieldIds = ['setup-name','setup-address','setup-postal','setup-city','setup-currency'];
  clearFormErrors('setup-error-slot', fieldIds);
  const name = ((document.getElementById('setup-name')||{}).value || '').trim();
  if(!name){ showFormError('setup-error-slot', "Le nom de l'établissement est requis.", ['setup-name']); return; }
  const address = ((document.getElementById('setup-address')||{}).value || '').trim();
  const postalCode = ((document.getElementById('setup-postal')||{}).value || '').trim();
  const city = ((document.getElementById('setup-city')||{}).value || '').trim() || '—';
  const currency = (document.getElementById('setup-currency')||{}).value || 'EUR';

  try{
    const data = await apiRequest('/api/restaurants', { method:'POST', body:{ name, address, postalCode, city, currency } });

    // Le catalogue, l'équipe, les commandes... continuent de fonctionner en mémoire pour
    // l'instant (seule la couche compte/établissement est déjà connectée au vrai serveur) —
    // on garde donc aussi une copie locale, reliée à l'établissement réel par remoteId.
    const newId = 'r'+nextId();
    RESTOS.push({id:newId, name, address, postalCode, city, currency, remoteId: data.restaurant.id});
    ensureRestoData(newId);
    state.resto = newId;
    loadRestoData(newId);

    if(ACCOUNT && !CREDENTIALS.patron.username){
      const derived = ACCOUNT.email.split('@')[0].toLowerCase().replace(/[^a-z0-9.]/g,'') || 'patron';
      const generatedPassword = generateDefaultPassword(derived);
      CREDENTIALS.patron.username = derived;
      CREDENTIALS.patron.password = generatedPassword;
      if(!NOTIF_STATE.patron.email) NOTIF_STATE.patron.email = ACCOUNT.email;
      toast('Établissement créé — identifiant équipe : ' + escapeHtml(CREDENTIALS.patron.username));
      try{
        await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username: derived, newPassword: generatedPassword } });
      } catch(e){ /* pas bloquant : les identifiants restent au moins utilisables pour cette session */ }
    } else {
      toast('Établissement créé — bienvenue !');
    }
    goToSite('team-login');
  } catch(err){
    showFormError('setup-error-slot', err.message, fieldIds);
  }
}

    <div class="field"><label>Confirmer le mot de passe</label>${passwordFieldWithToggle('recover-pass2')}</div>
    <div class="small muted" style="margin-bottom:14px;">Laissez les mots de passe vides pour ne changer que le nom d'utilisateur.</div>
    <button class="btn btn-primary btn-block" onclick="confirmRecoverPatronCredentials()">Enregistrer</button>
  `);
}
async function confirmRecoverPatronCredentials(){
  const username = document.getElementById('recover-username').value.trim();
  if(!username){ toast("Le nom d'utilisateur est requis",'alert'); return; }
  const p1 = document.getElementById('recover-pass1').value;
  const p2 = document.getElementById('recover-pass2').value;
  if(p1 || p2){
    if(p1.length<4){ toast('4 caractères minimum','alert'); return; }
    if(p1!==p2){ toast('Les mots de passe ne correspondent pas','alert'); return; }
  }
  try{
    await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username, ...(p1?{newPassword:p1}:{}) } });
    CREDENTIALS.patron.username = username;
    if(p1) CREDENTIALS.patron.password = p1;
    closeModal();
    toast('Identifiants mis à jour — vous pouvez vous reconnecter');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function renderBanner(){
  if(state.identity==='patron' && state.role!==state.identity){
    const smallWarnIcon = I.warn.replace('width="24"','width="10"').replace('height="24"','height="10"');
    return `<div class="demo-banner">${smallWarnIcon} <span><b>Aperçu de l'interface ${ROLE_META[state.role].label}</b> — les actions sont limitées aux permissions de ce rôle. <a href="#" onclick="backToOwnSpace();return false;" style="color:#fff;text-decoration:underline;">Revenir à mon espace Patron</a></span></div>`;
  }
  return '';
}

/* ============================================================
   RENDER PRINCIPAL
============================================================ */
const COOKIE_CONSENT_KEY = 'mise_et_sure_cookie_consent';
function renderCookieBanner(){
  const zone = document.getElementById('cookie-banner-zone');
  if(!zone) return;
  if(localStorage.getItem(COOKIE_CONSENT_KEY)){ zone.innerHTML = ''; return; }
  zone.innerHTML = `
    <div class="cookie-banner">
      <div class="cookie-banner-text">
        Ce site utilise uniquement des cookies strictement nécessaires à son fonctionnement (garder votre connexion active). Aucun cookie publicitaire ou de suivi. <a onclick="goToSite('confidentialite')">En savoir plus</a>.
      </div>
      <button class="btn btn-primary btn-sm" onclick="dismissCookieBanner()">J'ai compris</button>
    </div>
  `;
}
function dismissCookieBanner(){
  localStorage.setItem(COOKIE_CONSENT_KEY, '1');
  const zone = document.getElementById('cookie-banner-zone');
  if(zone) zone.innerHTML = '';
}
function render(){
  renderCookieBanner();
  document.documentElement.classList.toggle('theme-dark', state.theme==='dark');
  if(state.site==='marketing'){
    document.title = 'Mise & Sûre — la gestion de restaurant, sans friction';
    document.getElementById('app').innerHTML = renderMarketingPage();
    return;
  }
  if(state.site==='pricing'){
    document.title = 'Tarifs — Mise & Sûre';
    document.getElementById('app').innerHTML = renderPricingPage();
    return;
  }
  if(state.site==='mentions-legales'){
    document.title = 'Mentions légales — Mise & Sûre';
    document.getElementById('app').innerHTML = renderLegalPage('mentions-legales');
    return;
  }
  if(state.site==='confidentialite'){
    document.title = 'Politique de confidentialité — Mise & Sûre';
    document.getElementById('app').innerHTML = renderLegalPage('confidentialite');
    return;
  }
  if(state.site==='cgu'){
    document.title = 'Conditions générales — Mise & Sûre';
    document.getElementById('app').innerHTML = renderLegalPage('cgu');
    return;
  }
  if(state.site==='account-auth'){
    document.title = 'Connexion — Mise & Sûre';
    document.getElementById('app').innerHTML = renderAccountAuthPage();
    return;
  }
  if(state.site==='admin'){
    document.title = 'Administration — Mise & Sûre';
    document.getElementById('app').innerHTML = renderAdminPage();
    return;
  }
  if(state.site==='verify-email'){
    document.title = 'Vérification — Mise & Sûre';
    document.getElementById('app').innerHTML = renderVerifyEmailPage();
    return;
  }
  if(state.site==='reset-password'){
    document.title = 'Réinitialisation — Mise & Sûre';
    document.getElementById('app').innerHTML = renderResetPasswordPage();
    return;
  }
  if(state.site==='setup-restaurant'){
    document.title = 'Créer votre établissement — Mise & Sûre';
    document.getElementById('app').innerHTML = renderSetupRestaurantPage();
    return;
  }
  if(!state.loggedIn){
    document.title = 'Mise & Sûre — plateforme de gestion pour restaurants';
    document.getElementById('app').innerHTML = renderLoginScreen();
    return;
  }
  destroyCharts();
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(resto) document.title = resto.name + ' — Mise & Sûre';
  const {sidebarHtml, topbarHtml} = renderShell();
  document.getElementById('app').innerHTML = `
    ${sidebarHtml}
    <div class="main">
      ${topbarHtml}
      ${renderBanner()}
      <div class="content">${renderContent()}</div>
    </div>
  `;
  requestAnimationFrame(drawCharts);
  requestAnimationFrame(initSupplierMap);
}

async function loadTeamInvite(token){
  try{
    const data = await apiRequest(`/api/restaurants/public/invite/${token}`);
    const localId = 'r'+nextId();
    RESTOS.push({
      id: localId, name: data.restaurant.name, address:'', postalCode:'',
      city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
    });
    const d = ensureRestoData(localId);
    d.team = data.team.map(m => ({
      id: 't'+m.id, remoteId: m.id, name: m.name, role: m.role,
      shift:'', status:'actif', username:null, photoDataUrl: m.photo_url,
    }));
    state.resto = localId;
    loadRestoData(localId);
    state.site = 'team-login';
    window.history.replaceState({ site: 'team-login' }, '', window.location.pathname);
    render();
  } catch(err){
    toast(err.message, 'alert');
    goToSite('marketing');
  }
}
async function checkExistingSession(){
  // Fixe tout de suite (avant toute action async) l'état associé à cette toute première page de
  // l'historique — sinon, si la personne navigue (ex : clique sur "Tarifs") avant la fin de cette
  // fonction, cette première entrée resterait sans état défini, et le bouton "précédent" du
  // navigateur ne saurait pas y revenir correctement (il atterrirait sur l'accueil par défaut).
  window.history.replaceState({ site: state.site }, '', window.location.pathname);
  // Si on revient d'une connexion Google/Apple (ou d'un paiement Stripe), les indications
  // arrivent dans l'URL — on les récupère et on nettoie l'adresse tout de suite après.
  const urlParams = new URLSearchParams(window.location.search);
  const tokenFromUrl = urlParams.get('token');
  const oauthError = urlParams.get('oauth') === 'error';
  const checkoutCancelled = urlParams.get('checkout') === 'cancelled';
  const checkoutSuccess = urlParams.get('checkout') === 'success';
  const equipeToken = urlParams.get('equipe');
  if(equipeToken){
    // Lien personnel d'un membre de l'équipe : ce chemin est totalement indépendant du compte
    // du patron (aucun email, aucun abonnement) — on saute directement à l'écran de connexion
    // de son établissement précis.
    window.history.replaceState({}, document.title, window.location.pathname);
    await loadTeamInvite(equipeToken);
    return;
  }
  if(tokenFromUrl){
    AUTH_TOKEN = tokenFromUrl;
    localStorage.setItem(AUTH_TOKEN_KEY, tokenFromUrl);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(oauthError){
    toast("La connexion via Google/Apple a échoué. Merci de réessayer.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutCancelled){
    toast("Paiement annulé — vous pouvez réessayer à tout moment.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutSuccess){
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  try{
    const meData = await apiRequest('/api/auth/me');
    ACCOUNT = meData.user;
    if(ACCOUNT.team_username) CREDENTIALS.patron.username = ACCOUNT.team_username;
    try{
      // C'est CETTE étape qui vérifie réellement l'abonnement, quelle que soit la façon dont
      // la personne s'est connectée (email, Google ou Apple) — le serveur bloque avec le code
      // SUBSCRIPTION_REQUIRED si le paiement n'est pas actif.
      //
      // Juste après un paiement Stripe réussi, le navigateur peut revenir sur le site un peu
      // AVANT que Stripe n'ait fini de prévenir notre serveur (le "webhook") que le paiement est
      // passé — sans ça, on risquerait de croire à tort que la personne n'a toujours pas payé.
      // On retente donc plusieurs fois, avec une petite pause, uniquement dans ce cas précis.
      let restosData;
      const maxAttempts = checkoutSuccess ? 6 : 1;
      for(let attempt=1; attempt<=maxAttempts; attempt++){
        try{
          restosData = await apiRequest('/api/restaurants');
          break;
        } catch(e){
          const isLastAttempt = attempt===maxAttempts;
          if(e.code!=='SUBSCRIPTION_REQUIRED' || isLastAttempt) throw e;
          await new Promise(r=>setTimeout(r, 1200));
        }
      }
      state.site = (restosData.restaurants && restosData.restaurants.length) ? 'team-login' : 'setup-restaurant';
      if(restosData.restaurants && restosData.restaurants.length){
        // Le compte a déjà un ou plusieurs établissements réels côté serveur (créés avant ce
        // rechargement de page — après un paiement, par exemple) : on les recharge vraiment
        // dans l'application, plutôt que de repartir d'une liste vide comme si tout avait
        // disparu. Le catalogue/équipe/commandes restent pour l'instant en mémoire locale (voir
        // note plus haut), reliés à l'établissement réel par remoteId.
        RESTOS = restosData.restaurants.map(r => ({
          id: 'r'+nextId(),
          name: r.name,
          address: r.address,
          postalCode: r.postal_code,
          city: r.city,
          currency: r.currency,
          remoteId: r.id,
        }));
        RESTOS.forEach(r => ensureRestoData(r.id));
        state.resto = RESTOS[0].id;
        loadRestoData(RESTOS[0].id);
        syncRestoOperationalData(RESTOS[0].id);
      }
    } catch(restoErr){
      if(restoErr.code === 'SUBSCRIPTION_REQUIRED'){
        // Compte connecté mais pas encore payé : on le laisse sur la page d'accueil, il ira
        // sur "Tarifs" et choisira de payer quand il le souhaite — jamais de redirection forcée.
        state.site = 'marketing';
        window.history.replaceState({ site: state.site }, '', window.location.pathname);
        render();
        return;
      }
      throw restoErr;
    }
  } catch(err){
    // Pas de session de compte (patron) active : si un employé était connecté avant ce
    // rechargement de page, on tente de retrouver SA session grâce au jeton conservé — sans
    // ça, tout rechargement de page renverrait systématiquement à l'écran de connexion, même
    // en pleine utilisation de l'application.
    if(TEAM_TOKEN){
      try{
        const data = await apiRequest('/api/restaurants/team-me');
        const localId = 'r'+nextId();
        RESTOS.push({
          id: localId, name: data.restaurant.name, address:'', postalCode:'',
          city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
        });
        const d = ensureRestoData(localId);
        const localEmployeeId = 't'+data.member.id;
        d.team = [{
          id: localEmployeeId, remoteId: data.member.id, name: data.member.name,
          role: data.member.role, photoDataUrl: data.member.photo_url,
        }];
        state.resto = localId;
        loadRestoData(localId);
        state.site = 'team-login';
        login(identityForTeamRole(data.member.role), localEmployeeId);
        const lastView = localStorage.getItem('mise_et_sure_last_view');
        if(lastView) state.view = lastView;
        await syncRestoOperationalData(localId);
      } catch(teamErr){
        // Jeton expiré ou invalide : reste sur 'marketing', la personne devra rouvrir son lien.
        TEAM_TOKEN = null;
        localStorage.removeItem(TEAM_TOKEN_KEY);
      }
    }
  }
  window.history.replaceState({ site: state.site }, '', window.location.pathname);
  render();
}
checkExistingSession();
</script>
