// Le début de la période en cours pour une fréquence donnée — sert à savoir si une tâche a
// déjà été faite "aujourd'hui" (quotidien), "cette semaine" (hebdomadaire) ou "ce mois-ci"
// (mensuel), plutôt que de simplement réafficher le bouton sans jamais tenir compte de ce qui
// a déjà été fait.
function haccpPeriodStart(frequency){
  const now = new Date();
  if(frequency==='hebdomadaire'){
    const day = now.getDay(); // 0 = dimanche
    const diffToMonday = (day===0 ? 6 : day-1);
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday);
  }
  if(frequency==='mensuel') return new Date(now.getFullYear(), now.getMonth(), 1);
  return new Date(now.getFullYear(), now.getMonth(), now.getDate()); // quotidien, par défaut
}
function haccpTaskDoneInCurrentPeriod(task){
  const periodStart = haccpPeriodStart(task.frequency);
  return HACCP_CLEANING_LOGS.filter(l=>l.taskId===task.id && l.createdAt>=periodStart).sort((a,b)=>b.createdAt-a.createdAt)[0] || null;
}
// ============================================================
// STATUT DU JOUR — pour le rappel sur les tableaux de bord. Ne dit jamais "vous avez raté vos
// relevés", seulement "il en reste X à faire aujourd'hui" — un rappel utile, pas un reproche.
// Voir la discussion : jamais de donnée inventée pour combler un trou, seulement des rappels
// pour aider à ne pas en avoir besoin.
// ============================================================
function haccpTodayStatus(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || !resto.haccpEnabled) return null;
  const missingEquipment = HACCP_EQUIPMENT.filter(e=>haccpTempLogsToday(e.id).length===0);
  const dueTasks = HACCP_CLEANING_TASKS.filter(t=>t.frequency==='quotidien' && !haccpTaskDoneInCurrentPeriod(t));
  const totalMissing = missingEquipment.length + dueTasks.length;
  if(totalMissing===0) return null; // rien à rappeler : soit tout est fait, soit rien n'est configuré
  return { missingEquipment, dueTasks, totalMissing };
}
function haccpDashboardReminderHTML(){
  const status = haccpTodayStatus();
  if(!status) return '';
  const parts = [];
  if(status.missingEquipment.length) parts.push(`${status.missingEquipment.length} température${status.missingEquipment.length>1?'s':''} à relever`);
  if(status.dueTasks.length) parts.push(`${status.dueTasks.length} nettoyage${status.dueTasks.length>1?'s':''} du jour`);
  return `
    <div class="card" style="margin-bottom:18px;border:1.5px solid var(--border);background:var(--paper);">
      <div class="flex center gap8" style="margin-bottom:4px;">
        ${iconSm(I.thermometer)}
        <div class="card-title" style="margin-bottom:0;">Suivi HACCP du jour</div>
      </div>
      <div class="small muted" style="margin-bottom:12px;">Encore ${parts.join(' et ')} — deux minutes, quand vous avez un instant.</div>
      <button class="btn btn-primary btn-sm" onclick="setView('haccp')">${iconXs(I.check)} Faire les relevés</button>
    </div>
  `;
}
// Taux de complétion honnête sur les 30 derniers jours, plutôt qu'un historique qui pourrait
// sembler flatteur ou trafiqué s'il n'a jamais un seul trou — voir la discussion à ce sujet.
function haccpCompletionRate(logs, dateField){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-29);
  const relevantLogs = logs.filter(l=>l[dateField]>=start);
  const daysWithLog = new Set(relevantLogs.map(l=>{ const d=new Date(l[dateField]); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }));
  return { days: 30, daysCovered: daysWithLog.size, pct: Math.round((daysWithLog.size/30)*100) };
}
function haccpMomentLabel(moment){
  if(moment==='avant_service') return 'Avant service';
  if(moment==='apres_service') return 'Après service';
  return null; // "journée" — pas de précision nécessaire, cas le plus courant
}

async function saveHaccpEquipment(){
  const name = document.getElementById('heq-name').value.trim();
  const minTemp = parseFloat(document.getElementById('heq-min').value);
  const maxTemp = parseFloat(document.getElementById('heq-max').value);
  if(!name){ toast('Le nom est requis', 'alert'); return; }
  if(Number.isNaN(minTemp) || Number.isNaN(maxTemp) || minTemp > maxTemp){ toast('Merci de renseigner des seuils min/max valides', 'alert'); return; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/haccp/equipment`, { method:'POST', body:{ name, minTemp, maxTemp } });
    HACCP_EQUIPMENT.push({ id:'eq'+data.equipment.id, remoteId:data.equipment.id, name:data.equipment.name, minTemp:parseFloat(data.equipment.min_temp), maxTemp:parseFloat(data.equipment.max_temp) });
    closeModal();
    toast('Équipement ajouté');
    render();
  } catch(err){ toast(err.message, 'alert'); }
}
async function deleteHaccpEquipment(id){
  const eq = HACCP_EQUIPMENT.find(e=>e.id===id); if(!eq) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/haccp/equipment/${eq.remoteId}`, { method:'DELETE' });
    HACCP_EQUIPMENT = HACCP_EQUIPMENT.filter(e=>e.id!==id);
    ensureRestoData(state.resto).haccpEquipment = HACCP_EQUIPMENT;
    toast('Équipement supprimé');
    render();
  } catch(err){ toast(err.message, 'alert'); }
}

  const note = document.getElementById('haccp-temp-note').value.trim();
  if(Number.isNaN(temperature)){ toast('Merci de renseigner la température relevée', 'alert'); return; }
  const eq = HACCP_EQUIPMENT.find(e=>e.id===equipmentId); if(!eq) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/haccp/temperature-logs`, {
      method:'POST', body:{ equipmentId: eq.remoteId, temperature, note, loggedByName: currentActorName() },
    });
    HACCP_TEMP_LOGS.push({
      id:'tl'+data.temperatureLog.id, remoteId:data.temperatureLog.id, equipmentId:eq.id, equipmentName:eq.name,
      minTemp:eq.minTemp, maxTemp:eq.maxTemp, temperature:parseFloat(data.temperatureLog.temperature),
      inRange:data.temperatureLog.in_range, note:data.temperatureLog.note, loggedByName:data.temperatureLog.logged_by_name,

    closeModal();
    render();
  } catch(err){ toast(err.message, 'alert'); }
}

            <td><button class="btn btn-ghost btn-sm" onclick="removeBasketLine('${supplierId}','${li.productId}')" title="Retirer" aria-label="Retirer">${iconXs(I.x)}</button></td>
          </tr>`;
        }).join('')}
      </table>
      <div class="flex between center" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${financialsHidden() ? '<div></div>' : `<div class="mono" style="font-weight:700;font-size:15px;">${fmtEUR(total)}</div>`}
        <div class="flex gap8 center">
          <button class="btn btn-ghost btn-sm" onclick="openNewOrderModal('${supplierId}')">Ajouter</button>
          ${canSend
            ? `<button class="btn btn-primary btn-sm" onclick="sendBasket('${supplierId}')">Envoyer la commande</button>`
            : `<span class="tag tag-neutral" title="Seul le patron peut envoyer la commande">En attente d'envoi par le patron</span>`}
        </div>
      </div>
    </div>
  `;
}
function orderRowActions(o, role){
  const canDuplicate = role==='patron' && !o.custom && (o.lineItems||[]).some(li=>li.productId);
  const dupBtn = canDuplicate ? `<button class="btn btn-ghost btn-sm" onclick="duplicateOrder('${o.id}')" title="Réutiliser cette commande">${iconXs(I.copy)} Dupliquer</button>` : '';
  const pdfBtn = (o.supplier && ['patron','manager'].includes(role) && !soloModeEnabled()) ? `<button class="btn btn-ghost btn-sm" onclick="openOrderPdfOptions('${o.id}')" title="Bon de commande PDF">${iconXs(I.doc)} PDF</button>` : '';
  if(role==='patron' && o.status==='en_attente_validation') return `<div class="flex gap8">${dupBtn}${pdfBtn}<button class="btn btn-ghost btn-sm" onclick="openEditOrderModal('${o.id}')">Modifier</button><button class="btn btn-primary btn-sm" onclick="validateOrder('${o.id}')">Valider</button><button class="btn btn-danger btn-sm" onclick="refuseOrder('${o.id}')">Refuser</button></div>`;
  if((role==='manager' || role==='cuisine' || role==='patron') && (o.status==='validee' || o.status==='partiellement_recue')) return `<div class="flex gap8">${dupBtn}${pdfBtn}<button class="btn btn-ghost btn-sm" onclick="openReceiveOrderModal('${o.id}')">${o.status==='partiellement_recue'?'Compléter la réception':'Marquer reçue'}</button></div>`;
  return `<div class="flex gap8">${pdfBtn}${dupBtn}</div>`;
}
async function duplicateOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  if(!o.supplier){ toast("Cette commande n'a pas de fournisseur identifié",'alert'); return; }
  let addedCount = 0;
  for(const li of (o.lineItems||[])){
    if(!li.productId) continue;
    const stillExists = PRODUCTS.find(p=>p.id===li.productId);
    if(!stillExists) continue; // le produit a peut-être été supprimé du catalogue depuis
    await addToBasket(o.supplier, li.productId, li.qty);
    addedCount++;
  }
  if(addedCount===0){ toast("Aucun produit de cette commande n'existe plus dans le catalogue",'alert'); return; }
  toast('Commande dupliquée dans le panier '+supplierName(o.supplier)+' — modifiez-la si besoin avant de l\u2019envoyer');
  setView('commandes');
}
function orderStatusTag(o){
  const s = o.status;
  let tag;
  if(s==='en_attente_validation') tag = `<span class="tag tag-neutral">En attente</span>`;
  else if(s==='validee') tag = `<span class="tag tag-neutral">Validée</span>`;
  else if(s==='partiellement_recue') tag = `<span class="tag tag-warn">Partiellement reçue</span>`;
  else if(s==='livree') tag = `<span class="tag tag-strong">Livrée</span>`;
  else if(s==='refusee') tag = `<span class="tag tag-red">Refusée</span>`;
  else tag = `<span class="tag tag-subtle">${s}</span>`;
  return o.hasDiscrepancy ? `${tag} <span class="tag tag-red" title="La quantité ou le prix reçu diffère de la commande">⚠ Écart</span>` : tag;
}

function orderDepartments(o){
  const depts = new Set();
  (o.lineItems||[]).forEach(li=>{
    if(!li.productId) return;
    const p = PRODUCTS.find(x=>x.id===li.productId);
    if(!p) return;
    if(p.department==='both'){ depts.add('cuisine'); depts.add('salle'); }
    else depts.add(p.department);
  });
  return depts;
}
function availableOrderYears(){
  const years = new Set([new Date().getFullYear()]);
  ORDERS.forEach(o=>{ if(o.createdAt) years.add(new Date(o.createdAt).getFullYear()); });
  return Array.from(years).sort((a,b)=>b-a);
}
function setOrderFilter(key, value){
  state.orderFilter[key] = value;
  render();
}
function resetOrderFilters(){
  state.orderFilter = {dept:'tous', supplier:'tous', month:'tous', year:'tous'};
  render();
}
function filteredOrders(){
  const f = state.orderFilter;
  return ORDERS.filter(o=>{
    if(f.dept!=='tous' && !orderDepartments(o).has(f.dept)) return false;
    if(f.supplier!=='tous' && o.supplier!==f.supplier) return false;
    if(f.month!=='tous' || f.year!=='tous'){
      if(!o.createdAt) return false;
      const d = new Date(o.createdAt);
      if(f.month!=='tous' && d.getMonth()!==parseInt(f.month,10)) return false;
      if(f.year!=='tous' && d.getFullYear()!==parseInt(f.year,10)) return false;
    }
    return true;
  });
}

/* ============================================================
   CARTE DES FOURNISSEURS — géolocalisation gratuite via OpenStreetMap.
   Affiche l'établissement, les fournisseurs déjà ajoutés (mis en avant), et des fournisseurs
   potentiels détectés autour (issus des données ouvertes OpenStreetMap — pas exhaustif).
============================================================ */
let NEARBY_SUPPLIERS = [];
let NEARBY_SUPPLIERS_LOADING = false;
let NEARBY_SUPPLIERS_ERROR = null;
let NEARBY_SUPPLIERS_LOADED_FOR = null;
let NEARBY_SUPPLIERS_LOADED_RADIUS = null;
// Vue consolidée multi-établissements (forfait Pro) — mêmes principes de chargement paresseux
// que pour les fournisseurs à proximité ci-dessus : chargée une fois, réutilisée ensuite, et
// invalidée (remise à null) quand un établissement est ajouté ou supprimé.
let CONSOLIDATED_STATS = null;
let CONSOLIDATED_STATS_LOADING = false;
let CONSOLIDATED_STATS_ERROR = null;
async function loadConsolidatedStats(){
  if(CONSOLIDATED_STATS_LOADING) return;
  CONSOLIDATED_STATS_LOADING = true;
  CONSOLIDATED_STATS_ERROR = null;
  try{
    CONSOLIDATED_STATS = await apiRequest('/api/restaurants/consolidated-stats');
  } catch(err){
    CONSOLIDATED_STATS_ERROR = err.message || "Impossible de charger la vue consolidée pour le moment.";
  } finally {
    CONSOLIDATED_STATS_LOADING = false;
    render();
  }
}
let SUPPLIER_MAP_INSTANCE = null;
let SUPPLIER_MAP_VIEW = null; // {center:[lat,lng], zoom} — retenu pour ne pas perdre la position lors d'un nouveau rendu
let SUPPLIER_MAP_LAST_SEARCH = null; // [lat,lng] du dernier endroit réellement recherché
let SUPPLIER_MAP_SEARCHING_AREA = false;

function viewSupplierMap(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  const hasLocation = resto && resto.latitude != null && resto.longitude != null;
  if(state.resto !== NEARBY_SUPPLIERS_LOADED_FOR && !NEARBY_SUPPLIERS_LOADING && hasLocation){
    loadNearbySuppliers();
  }
  const knownWithCoords = SUPPLIERS.filter(s=>s.latitude!=null && s.longitude!=null);
  const knownApproxCount = knownWithCoords.filter(s=>s.isApproximate).length;
  const suppliersMissingCoords = SUPPLIERS.filter(s=>s.address && s.address.trim() && s.latitude==null);
  return `
    <div class="section-head" style="margin-top:0;">
      <div><h2>Carte des fournisseurs</h2><div class="sub">Votre établissement, vos fournisseurs déjà ajoutés, et d'autres fournisseurs potentiels autour de vous — avec les petits producteurs locaux (fermes, vignerons, brasseurs, apiculteurs...) mis en valeur séparément des fournisseurs professionnels classiques (source : OpenStreetMap, données ouvertes — pas un annuaire exhaustif).</div></div>
    </div>
    ${!hasLocation ? `
      ${emptyState("Impossible de localiser votre établissement pour le moment.")}
      <div class="small muted" style="text-align:center;margin-top:-14px;margin-bottom:16px;">Si son adresse est bien complète dans Paramètres, il est possible qu'il n'ait simplement jamais été localisé (établissement créé avant cette fonctionnalité).</div>
      <div style="text-align:center;">
        <button class="btn btn-primary" onclick="geocodeRestaurantNow()" ${state.geocodingResto?'disabled':''}>${state.geocodingResto?'Localisation en cours…':'Localiser mon établissement maintenant'}</button>
      </div>
    ` : `
      <div class="flex gap8" style="align-items:center;flex-wrap:wrap;margin-bottom:10px;">
        <input type="text" id="map-search-input" placeholder="🔎 Rechercher un fournisseur par nom…" value="${escapeHtml(state.mapSearchQuery)}" oninput="updateMapSearch(this.value)" style="flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);">
        <select onchange="state.mapCategoryFilter=this.value;render();" style="padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);">
          <option value="">Toutes les catégories</option>
          ${mapAvailableCategories().map(c=>`<option value="${escapeHtml(c)}" ${state.mapCategoryFilter===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
      <div class="flex gap8" style="align-items:center;flex-wrap:wrap;margin-bottom:14px;">
        <label class="small muted" style="display:flex;align-items:center;gap:8px;">Rechercher dans un rayon de
          <select onchange="changeMapRadius(this.value)" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);">
            <option value="10" ${state.mapRadiusKm===10?'selected':''}>10 km</option>
            <option value="20" ${state.mapRadiusKm===20?'selected':''}>20 km</option>
            <option value="35" ${state.mapRadiusKm===35?'selected':''}>35 km</option>
            <option value="50" ${state.mapRadiusKm===50?'selected':''}>50 km (recommandé pour les fermes)</option>
          </select>
        </label>
        <label class="small" style="display:flex;align-items:center;gap:7px;cursor:pointer;margin-left:auto;">
          <input type="checkbox" ${state.mapProducersOnly?'checked':''} onchange="toggleProducersOnly()"> N'afficher que les petits producteurs
        </label>
      </div>
      <div class="map-legend">
        <span><span class="map-dot map-dot-resto"></span> Votre établissement</span>
        ${!state.mapProducersOnly ? `<span><span class="map-dot map-dot-known"></span> Fournisseurs déjà ajoutés (${knownWithCoords.length}${knownApproxCount>0?`, dont ${knownApproxCount} en position approximative`:''})</span>` : ''}
        <span><span class="map-dot map-dot-producer"></span> Petits producteurs détectés (${NEARBY_SUPPLIERS.filter(s=>s.isProducer).length})</span>
        ${!state.mapProducersOnly ? `<span><span class="map-dot map-dot-new"></span> Grossistes détectés (${NEARBY_SUPPLIERS.filter(s=>!s.isProducer).length})</span>` : ''}
      </div>
      <div class="card" style="padding:0;overflow:hidden;position:relative;">
        <div id="supplier-map" style="height:520px;width:100%;"></div>
        ${state.mapShowSearchHere ? `
          <button class="btn btn-primary map-search-here-btn" onclick="searchThisArea()" ${SUPPLIER_MAP_SEARCHING_AREA?'disabled':''}>
            ${SUPPLIER_MAP_SEARCHING_AREA ? 'Recherche en cours…' : iconSm(I.mapPin) + ' Rechercher dans cette zone'}
          </button>
        ` : ''}
      </div>
      ${NEARBY_SUPPLIERS_LOADING ? `<div class="small muted" style="margin-top:10px;">Recherche des fournisseurs à proximité (rayon ${state.mapRadiusKm} km)…</div>` : ''}
      ${NEARBY_SUPPLIERS_ERROR ? `<div class="small" style="margin-top:10px;color:var(--urgent);">${escapeHtml(NEARBY_SUPPLIERS_ERROR)}</div>` : ''}
      ${suppliersMissingCoords.length > 0 ? `
        <div class="small muted" style="margin-top:14px;">${suppliersMissingCoords.length} fournisseur(s) avec une adresse mais pas encore localisé(s) sur la carte (probablement ajoutés avant cette fonctionnalité).
        <button class="btn btn-ghost btn-sm" style="margin-left:8px;" onclick="geocodeSuppliersNow()" ${state.geocodingSuppliers?'disabled':''}>${state.geocodingSuppliers?'Localisation en cours…':'Les localiser maintenant'}</button></div>
      ` : ''}
    `}
  `;
}

async function loadNearbySuppliers(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || !resto.remoteId) return;
  NEARBY_SUPPLIERS_LOADING = true;
  NEARBY_SUPPLIERS_ERROR = null;
  render();
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/nearby-suppliers?radiusKm=${state.mapRadiusKm}`);
    NEARBY_SUPPLIERS = data.nearby || [];
    NEARBY_SUPPLIERS_LOADED_FOR = state.resto;
    NEARBY_SUPPLIERS_LOADED_RADIUS = state.mapRadiusKm;
    SUPPLIER_MAP_LAST_SEARCH = [resto.latitude, resto.longitude];
    if(data.reason) NEARBY_SUPPLIERS_ERROR = data.reason;
  } catch(err){
    NEARBY_SUPPLIERS_ERROR = "Impossible de charger les fournisseurs à proximité pour le moment.";
  } finally {
    NEARBY_SUPPLIERS_LOADING = false;
    render();
  }
}
function changeMapRadius(value){
  state.mapRadiusKm = parseInt(value, 10);
  if(SUPPLIER_MAP_VIEW){
    // On était déjà en train d'explorer un endroit précis — on relance la recherche ici, avec
    // le nouveau rayon, plutôt que de recentrer sur l'établissement sans prévenir.
    SUPPLIER_MAP_LAST_SEARCH = SUPPLIER_MAP_VIEW.center;
    state.mapShowSearchHere = false;
    searchSuppliersAtMapCenter(SUPPLIER_MAP_VIEW.center[0], SUPPLIER_MAP_VIEW.center[1]);
  } else {
    NEARBY_SUPPLIERS_LOADED_FOR = null; // force une nouvelle recherche initiale, autour de l'établissement
    render();
  }
}
let MAP_SEARCH_DEBOUNCE = null;
function updateMapSearch(value){
  state.mapSearchQuery = value;
  // Un petit délai avant de vraiment filtrer la carte — évite de recréer toute la carte à
  // chaque lettre tapée, ce qui la rendrait saccadée le temps d'écrire un nom complet.
  if(MAP_SEARCH_DEBOUNCE) clearTimeout(MAP_SEARCH_DEBOUNCE);
  MAP_SEARCH_DEBOUNCE = setTimeout(() => {
    render();
    // Remet le focus dans le champ de recherche après le nouveau rendu, pour continuer à taper
    // sans interruption (le rendu complet recrée sinon le champ et lui fait perdre le focus).
    const input = document.getElementById('map-search-input');
    if(input){ input.focus(); const v = input.value; input.value=''; input.value=v; }
  }, 250);
}
function mapAvailableCategories(){
  const cats = new Set();
  SUPPLIERS.forEach(s=>{ if(s.cat) cats.add(s.cat); });
  NEARBY_SUPPLIERS.forEach(s=>{ if(s.category) cats.add(s.category); });
  return [...cats].sort((a,b)=>a.localeCompare(b, 'fr'));
}
function toggleProducersOnly(){
  state.mapProducersOnly = !state.mapProducersOnly;
  render();
}

// Génère un marqueur en forme de pin professionnel (comme Google Maps), avec un point blanc au
// centre — beaucoup plus lisible et soigné qu'un simple rond de couleur.
function createMapPin(color, size){
  size = size || 30;
  const height = Math.round(size * 1.3);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${height}" viewBox="0 0 32 42">
    <path d="M16 0C7.2 0 0 7.2 0 16c0 11 16 26 16 26s16-15 16-26C32 7.2 24.8 0 16 0z" fill="${color}"/>
    <circle cx="16" cy="16" r="6.5" fill="#fff"/>
  </svg>`;
  return L.icon({
    iconUrl: 'data:image/svg+xml;base64,' + btoa(svg),
    iconSize: [size, height],
    iconAnchor: [size/2, height],
    popupAnchor: [0, -height + 6],
  });
}
function initSupplierMap(){
  const container = document.getElementById('supplier-map');
  if(!container) return; // pas sur la page carte pour l'instant — inutile de charger Leaflet
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || resto.latitude == null || resto.longitude == null) return;
  ensureLeaflet(() => initSupplierMapNow());
}
function initSupplierMapNow(){
  const container = document.getElementById('supplier-map');
  // Revérifié : le temps que Leaflet charge, la personne a pu changer de page.
  if(!container) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || resto.latitude == null || resto.longitude == null) return;

  // Un conteneur réutilisé par Leaflet sans nettoyage préalable lève une erreur — on détruit
  // toujours l'instance précédente avant d'en recréer une, plutôt que de la mettre à jour.
  if(SUPPLIER_MAP_INSTANCE){ SUPPLIER_MAP_INSTANCE.remove(); SUPPLIER_MAP_INSTANCE = null; }

  // On repart de la dernière position connue (si la carte a déjà été déplacée) plutôt que de
  // toujours recentrer sur l'établissement — sinon, chaque nouveau rendu (recherche, filtre...)
  // ferait perdre l'endroit que la personne est en train d'explorer.
  const initialCenter = SUPPLIER_MAP_VIEW ? SUPPLIER_MAP_VIEW.center : [resto.latitude, resto.longitude];
  const initialZoom = SUPPLIER_MAP_VIEW ? SUPPLIER_MAP_VIEW.zoom : (state.mapRadiusKm >= 50 ? 9 : state.mapRadiusKm >= 35 ? 10 : 12);

  const map = L.map('supplier-map', { zoomControl:false }).setView(initialCenter, initialZoom);
  L.control.zoom({ position:'bottomright' }).addTo(map);

  const planLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  });
  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 19,
  });
  (state.mapLayerType === 'satellite' ? satelliteLayer : planLayer).addTo(map);
  L.control.layers({ 'Plan': planLayer, 'Satellite': satelliteLayer }, null, { position:'topright' }).addTo(map);
  map.on('baselayerchange', (e) => { state.mapLayerType = e.name === 'Satellite' ? 'satellite' : 'plan'; });

  L.marker([resto.latitude, resto.longitude], {icon: createMapPin('#141414', 34), zIndexOffset:1000}).addTo(map).bindPopup(`<b>${escapeHtml(resto.name)}</b><br>Votre établissement`);

  // Les fournisseurs sont regroupés en grappes (nombre affiché) tant qu'on n'a pas assez zoomé
  // pour les distinguer un par un — la carte reste fluide même avec beaucoup de résultats, au
  // lieu d'afficher des dizaines de marqueurs superposés d'un coup.
  const supplierCluster = L.markerClusterGroup ? L.markerClusterGroup({ maxClusterRadius: 50, spiderfyOnMaxZoom: true }) : map;

  const q = (state.mapSearchQuery||'').toLowerCase().trim();
  const catFilter = state.mapCategoryFilter||'';
  const matchesFilters = (name, category) => {
    if(q && !name.toLowerCase().includes(q)) return false;
    if(catFilter && category !== catFilter) return false;
    return true;
  };

  if(!state.mapProducersOnly){
    SUPPLIERS.filter(s=>s.latitude!=null && s.longitude!=null && matchesFilters(s.name, s.cat)).forEach(s=>{
      const approxNote = s.isApproximate ? '<br><span class="small muted">Position approximative (adresse pas assez précise)</span>' : '';
      const icon = createMapPin('#2563EB', s.isApproximate ? 24 : 28);
      const contactLines = [];
      if(s.address) contactLines.push(`📍 ${escapeHtml(s.address)}`);
      if(s.email) contactLines.push(`✉️ <a href="mailto:${escapeHtml(s.email)}">${escapeHtml(s.email)}</a>`);
      if(s.contactFirstName || s.contactLastName){
        const contactName = [s.contactFirstName, s.contactLastName].filter(Boolean).join(' ');
        contactLines.push(`👤 ${escapeHtml(contactName)}${s.contactPhone ? ' · <a href="tel:'+escapeHtml(s.contactPhone)+'">'+escapeHtml(s.contactPhone)+'</a>' : ''}`);
        if(s.contactEmail) contactLines.push(`✉️ <a href="mailto:${escapeHtml(s.contactEmail)}">${escapeHtml(s.contactEmail)}</a> (commercial)`);
      }
      const googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent([s.name, s.address].filter(Boolean).join(' '));
      L.marker([s.latitude, s.longitude], {icon, opacity: s.isApproximate ? 0.7 : 1}).addTo(supplierCluster).bindPopup(
        `<b>${escapeHtml(s.name)}</b><br><span class="small muted">Déjà dans vos fournisseurs</span>${approxNote}`
        + (contactLines.length ? `<div class="small" style="margin-top:6px;line-height:1.6;">${contactLines.join('<br>')}</div>` : '')
        + `<br><a href="${escapeHtml(googleUrl)}" target="_blank" rel="noopener noreferrer" class="small">🔎 Chercher sur Internet</a>`
      );
    });
  }

  NEARBY_SUPPLIERS.filter(s=>matchesFilters(s.name, s.category)).forEach(s=>{
    if(state.mapProducersOnly && !s.isProducer) return; // filtre "producteurs uniquement" actif
    const alreadyKnown = SUPPLIERS.some(k=>(k.name||'').toLowerCase().trim() === (s.name||'').toLowerCase().trim());
    if(alreadyKnown) return; // évite un doublon visuel si détecté par les deux sources
    const badge = s.isProducer ? '<span style="background:#2F9E44;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;">Petit producteur</span><br>' : '';
    const icon = createMapPin(s.isProducer ? '#2F9E44' : '#E08A2E', s.isProducer ? 26 : 22);
    const contactLines = [];
    if(s.address) contactLines.push(`📍 ${escapeHtml(s.address)}`);
    if(s.phone) contactLines.push(`📞 <a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a>`);
    const linkLine = s.link ? `<a href="${escapeHtml(s.link)}" target="_blank" rel="noopener noreferrer" class="small">${s.linkIsWebsite?'🔗 Voir le site':'🔎 Chercher sur Internet'}</a>` : '';
    L.marker([s.latitude, s.longitude], {icon}).addTo(supplierCluster)
      .bindPopup(
        `${badge}<b>${escapeHtml(s.name)}</b><br><span class="small muted">${escapeHtml(s.category)}</span>`
        + (contactLines.length ? `<div class="small" style="margin-top:6px;line-height:1.6;">${contactLines.join('<br>')}</div>` : '')
        + (linkLine ? `<div style="margin-top:4px;">${linkLine}</div>` : '')
        + `<button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="prefillSupplierFromMap('${escapeHtml(s.name).replace(/'/g,"\\'")}','${escapeHtml(s.address||'').replace(/'/g,"\\'")}')">+ Ajouter à mes fournisseurs</button>`
      );
  });

  if(supplierCluster !== map) supplierCluster.addTo(map);


  // On retient juste la position pour ne pas la perdre au prochain rendu — mais on NE relance
  // PLUS de recherche automatiquement en déplaçant la carte : la personne garde le contrôle et
  // déclenche elle-même la recherche via le bouton "Rechercher dans cette zone" une fois arrivée
  // où elle veut regarder.
  map.on('moveend', () => {
    const center = map.getCenter();
    SUPPLIER_MAP_VIEW = { center: [center.lat, center.lng], zoom: map.getZoom() };
    const movedFar = !SUPPLIER_MAP_LAST_SEARCH || map.distance(center, L.latLng(SUPPLIER_MAP_LAST_SEARCH[0], SUPPLIER_MAP_LAST_SEARCH[1])) > 300;
    if(movedFar !== state.mapShowSearchHere){ state.mapShowSearchHere = movedFar; render(); }
  });

  SUPPLIER_MAP_INSTANCE = map;
}
function searchThisArea(){
  if(!SUPPLIER_MAP_VIEW) return;
  SUPPLIER_MAP_LAST_SEARCH = SUPPLIER_MAP_VIEW.center;
  state.mapShowSearchHere = false;
  searchSuppliersAtMapCenter(SUPPLIER_MAP_VIEW.center[0], SUPPLIER_MAP_VIEW.center[1]);
}
async function searchSuppliersAtMapCenter(lat, lng){
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto || !resto.remoteId) return;
  SUPPLIER_MAP_SEARCHING_AREA = true;
  render();
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/nearby-suppliers?radiusKm=${state.mapRadiusKm}&lat=${lat}&lng=${lng}`);
    NEARBY_SUPPLIERS = data.nearby || [];
  } catch(err){
    // Silencieux : une recherche liée à un déplacement de carte ne doit pas interrompre
    // l'exploration avec un message d'erreur intrusif — les résultats précédents restent affichés.
  } finally {
    SUPPLIER_MAP_SEARCHING_AREA = false;
    render();
  }
}

async function syncRestoOperationalData(localId){
  // Les fournisseurs et les lieux/zones doivent être rechargés AVANT les produits, puisque
  // chaque produit s'y relie. Idem pour les commandes et les paniers, qui se relient eux aussi
  // à un fournisseur et des produits déjà chargés.
  // Chaque étape est isolée : si l'une d'elles échoue (réseau, ou un imprévu à l'affichage), les
  // suivantes s'exécutent quand même, plutôt que de laisser le reste des données périmées.
  const steps = [
    syncRestaurantInfoFromServer, syncHaccpFromServer, syncNotificationSettingsFromServer, syncCategoriesFromServer,
    syncZonesFromServer, syncSuppliersFromServer, syncProductsFromServer, syncRecipesFromServer, syncStockCountsFromServer, syncOrdersFromServer,
    syncBasketsFromServer, syncRequestsFromServer, syncCustomRequestsFromServer, syncTeamFromServer,
  ];
  for(const step of steps){
    try{ await step(localId); } catch(err){ console.error('Erreur de synchronisation (une étape ignorée, les autres continuent) :', err); }
  }
  // Un SEUL rendu ici, une fois toutes les étapes terminées — plutôt qu'un rendu après chacune
  // des 11 étapes. Chaque rendu recrée entièrement la carte des fournisseurs et les graphiques
  // (ils vivent dans un conteneur recréé à chaque rendu, donc impossibles à simplement "mettre
  // à jour" sans les reconstruire) : les appeler 11 fois de suite toutes les 30 secondes faisait
  // clignoter/disparaître brièvement les marqueurs pendant que la personne regardait la carte,
  // pour un gain nul puisque les données de ces 11 étapes arrivent de toute façon quasi en même
  // temps. Un seul rendu final donne le même résultat visuel, sans le clignotement.
  // Ne jamais redessiner par-dessus un inventaire en cours de saisie : le rafraîchissement
  // automatique (toutes les 30 secondes) reconstruisait tout le tableau, effaçant sans
  // prévenir les quantités déjà tapées par quelqu'un en train de compter sa réserve. Les
  // données fraîches sont quand même chargées en mémoire — elles s'afficheront au prochain
  // rendu naturel, une fois la saisie terminée et enregistrée.
  if(hasPendingInventoryInput()) return;
  render();
}

async function confirmDeleteResto(id){
  const idx = RESTOS.findIndex(r=>r.id===id);
  if(idx===-1) return;
  const r = RESTOS[idx];
  try{
    // Supprimé réellement côté serveur — l'ancienne version ne retirait l'établissement que de
    // ce navigateur, il réapparaissait donc après un rechargement ou sur un autre appareil.
    if(r.remoteId) await apiRequest(`/api/restaurants/${r.remoteId}`, { method:'DELETE' });

    RESTOS.splice(idx,1);
    delete RESTO_DATA[id];

      loadRestoData(state.resto);

    closeModal();
    toast('Établissement supprimé');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}


// ============================================================
// SIRET — formatage automatique (espaces tous les 3 chiffres) et validation par clé de
// contrôle (algorithme de Luhn, la même méthode utilisée officiellement pour vérifier un
// SIREN/SIRET). Un SIRET mal recopié à la main est une erreur fréquente et difficile à
// repérer à l'œil nu ; autant le signaler tout de suite plutôt qu'une fois le document envoyé
// à un tiers.
// ============================================================
function formatSiretInput(el){
  const digits = el.value.replace(/\D/g,'').slice(0,14);
  const groups = [digits.slice(0,3), digits.slice(3,6), digits.slice(6,9), digits.slice(9,14)].filter(Boolean);
  el.value = groups.join(' ');
  const hint = document.getElementById('siret-hint');
  if(hint){ hint.textContent = siretHintText(el.value); hint.style.color = siretHintColor(el.value); }
}
function isValidSiretChecksum(digits){
  if(digits.length !== 14) return false;
  // Exception connue et sans danger : les établissements de La Poste (SIREN 356000000) ne
  // suivent pas cette règle pour des raisons historiques — on ne les pénalise pas pour ça.
  if(digits.startsWith('356000000')) return true;
  let sum = 0;
  for(let i=0;i<14;i++){
    let d = parseInt(digits[digits.length-1-i], 10);
    if(i % 2 === 1){ d *= 2; if(d > 9) d -= 9; }
    sum += d;
  }
  return sum % 10 === 0;
}
function siretHintText(rawValue){
  const digits = (rawValue||'').replace(/\D/g,'');
  if(!digits) return "Affiché sur vos bons de commande téléchargeables, pour identifier l'acheteur. 14 chiffres — les espaces s'ajoutent automatiquement.";
  if(digits.length < 14) return `${digits.length}/14 chiffres`;
  return isValidSiretChecksum(digits) ? '✓ Numéro valide' : "⚠️ Ce numéro ne semble pas correct — vérifiez qu'il n'y a pas d'erreur de saisie.";
}
function siretHintColor(rawValue){
  const digits = (rawValue||'').replace(/\D/g,'');
  if(!digits || digits.length < 14) return 'var(--muted)';
  return isValidSiretChecksum(digits) ? 'var(--good)' : 'var(--urgent)';
}

// SUPPRESSION DE COMPTE — délai de grâce de 30 jours plutôt qu'une suppression immédiate (voir
// la discussion sur ce sujet). Le mot de passe est redemandé explicitement ici, même si la
// personne est déjà connectée : une action aussi définitive mérite une friction volontaire,
// pas juste un clic sur un bouton qu'on pourrait presser par erreur en faisant autre chose.
// ============================================================
function openDeleteAccountModal(){
  openModal(`
    <button class="modal-close" onclick="closeModal()" aria-label="Fermer" title="Fermer">${iconSm(I.x)}</button>
    <h3 style="color:var(--urgent);">Supprimer votre compte ?</h3>
    <p class="small muted" style="margin-bottom:16px;">
      Cette action supprime votre compte et <b>tous</b> les établissements qui lui sont rattachés — produits, fournisseurs, commandes, équipe, tout l'historique. Un délai de grâce de 30 jours s'applique : rien n'est perdu tant que vous n'aurez pas laissé ce délai s'écouler sans annuler.
    </p>
    <div class="field"><label>Confirmez avec votre mot de passe</label><input id="delete-account-password" type="password" placeholder="Votre mot de passe" autofocus></div>
    <button class="btn btn-block" style="background:var(--urgent);color:#fff;" onclick="confirmDeleteAccount()">Je confirme, supprimer mon compte</button>
  `);
}
async function confirmDeleteAccount(){
  const password = document.getElementById('delete-account-password').value;
  if(!password){ toast('Merci de saisir votre mot de passe', 'alert'); return; }
  try{
    const data = await apiRequest('/api/account/request-deletion', { method:'POST', body:{ password } });
    ACCOUNT.pending_deletion_at = data.pendingDeletionAt;
    closeModal();
    toast('Suppression programmée — vous pouvez encore l\u2019annuler pendant 30 jours');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function cancelAccountDeletion(){
  try{
    await apiRequest('/api/account/cancel-deletion', { method:'POST' });
    ACCOUNT.pending_deletion_at = null;
    toast('Suppression annulée — votre compte reste actif');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function saveAccountInfo(){
  if(!ACCOUNT) return;
  const firstName = (document.getElementById('acct-firstname').value||'').trim();
  const lastName = (document.getElementById('acct-lastname').value||'').trim();
  const phone = (document.getElementById('acct-phone').value||'').trim();
  const email = (document.getElementById('acct-email').value||'').trim();
  if(!firstName || !lastName){ toast('Le prénom et le nom sont requis','alert'); return; }
  if(!email || !isValidEmail(email)){ toast('Adresse email invalide','alert'); return; }
  try{
    const data = await apiRequest('/api/account', { method:'PATCH', body:{ firstName, lastName, phone, email } });
    ACCOUNT = data.account;
    toast('Informations du compte mises à jour');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
// Choisir un thème complet impose sa propre couleur d'accent (voir applyAppearance) — mais
// seulement si aucune couleur personnalisée n'est déjà définie sur l'établissement. On efface
// donc explicitement accentColor ici, pour que le thème choisi s'applique vraiment plutôt que
// de rester silencieusement masqué par une ancienne couleur personnalisée.
function selectColorTheme(key){
  state.appearanceDraft.colorTheme = key;
  if(key !== 'custom') state.appearanceDraft.accentColor = null;
  render();
}
function updateDraftCustomAccent(value){
  state.appearanceDraft.accentColor = value;
  state.appearanceDraft.colorTheme = 'custom';
}
function selectFontStyle(key){
  state.appearanceDraft.fontStyle = key;
  render();
}
async function saveAppearance(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  const draft = state.appearanceDraft;
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}`, {
      method:'PATCH',
      body:{
        accentColor: draft.accentColor, colorTheme: draft.colorTheme, fontStyle: draft.fontStyle,
        tagline: (draft.tagline||'').trim(), defaultDarkMode: draft.defaultDarkMode,
        logoUrl: draft.logoDataUrl || '', coverPhotoDataUrl: draft.coverPhotoDataUrl || '',
      },
    });
    resto.accentColor = data.restaurant.accent_color;
    resto.colorTheme = data.restaurant.color_theme;
    resto.fontStyle = data.restaurant.font_style;
    resto.tagline = data.restaurant.tagline;
    resto.defaultDarkMode = data.restaurant.default_dark_mode;
    resto.logoDataUrl = data.restaurant.logo_url;
    resto.coverPhotoDataUrl = data.restaurant.cover_photo_data_url;
    state.appearanceDraft = null; // sera ré-initialisé depuis les nouvelles valeurs au prochain rendu
    applyAppearance(resto);
    toast('Apparence enregistrée pour ' + escapeHtml(resto.name));
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function handleLogoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  // Rien n'est envoyé au serveur ici — juste un aperçu local, en attendant que la personne
  // clique sur "Enregistrer l'apparence" pour que ça devienne vraiment le logo du restaurant.
  compressImageFile(file, 500, 0.8, (compressed) => {
    state.appearanceDraft.logoDataUrl = compressed;
    render();
  });
}
function removeLogo(){
  state.appearanceDraft.logoDataUrl = null;
  render();

function handleCoverPhotoUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  compressImageFile(file, 1200, 0.75, (compressed) => {
    state.appearanceDraft.coverPhotoDataUrl = compressed;
    render();
  });
}
function removeCoverPhoto(){
  state.appearanceDraft.coverPhotoDataUrl = null;
  render();
}
function openChangePasswordModal(employeeId){
  const member = employeeId ? TEAM.find(t=>t.id===employeeId) : null;
  const name = member ? member.name : patronDisplayName();
  const roleLabel = member ? member.role : 'Patron';
  const currentUsername = member ? member.username : CREDENTIALS.patron.username;
  openModal(`
    <button class="modal-close" onclick="closeModal()" aria-label="Fermer" title="Fermer">${iconSm(I.x)}</button>
    <h3>Identifiants — ${name}</h3>
    <div class="modal-sub">${roleLabel}</div>
    <div class="field"><label>Nom d'utilisateur</label><input id="np-username" value="${currentUsername}"></div>
    <div class="field"><label>Nouveau mot de passe</label>${passwordFieldWithToggle('np-pass1', '', '4 caractères minimum')}</div>
    <div class="field"><label>Confirmer le mot de passe</label>${passwordFieldWithToggle('np-pass2')}</div>
    <div class="small muted" style="margin-bottom:14px;">Laissez les mots de passe vides pour ne garder que le mot de passe actuel et changer uniquement le nom d'utilisateur.</div>
    <button class="btn btn-primary btn-block" onclick="saveNewPassword(${employeeId?`'${employeeId}'`:'null'})">Enregistrer</button>
  `);
}
async function saveNewPassword(employeeId){
  const username = document.getElementById('np-username').value.trim();
  if(!username){ toast("Le nom d'utilisateur est requis",'alert'); return; }
  const p1 = document.getElementById('np-pass1').value;
  const p2 = document.getElementById('np-pass2').value;
  if(p1 || p2){
    if(p1.length<4){ toast('4 caractères minimum recommandés','alert'); return; }
    if(p1!==p2){ toast('Les deux mots de passe ne correspondent pas','alert'); return; }
  }
  let name = patronDisplayName();
  try{
    if(employeeId){
      const m = TEAM.find(t=>t.id===employeeId);
      if(!m) return;
      const resto = RESTOS.find(r=>r.id===state.resto);
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/team/${m.remoteId}`, {
        method:'PATCH', body:{ username, ...(p1?{newPassword:p1}:{}) },
      });
      m.username = data.member.username;
      name = m.name;
    } else {
      await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username, ...(p1?{newPassword:p1}:{}) } });
      CREDENTIALS.patron.username = username;
      if(p1) CREDENTIALS.patron.password = p1;
    }
    closeModal();
    toast('Identifiants mis à jour pour ' + escapeHtml(name));
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function renameCategory(id){
  const c = CATEGORIES.find(x=>x.id===id); if(!c) return;
  const newName = prompt('Nouveau nom de la catégorie :', c.name);
  if(!newName || !newName.trim() || newName.trim()===c.name) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/categories/${c.remoteId}`, { method:'PATCH', body:{ name: newName.trim() } });
    const oldName = c.name;
    c.name = data.category.name;
    PRODUCTS.forEach(p=>{ if(p.cat===oldName) p.cat = c.name; });
    toast('Catégorie renommée');
    render();

// Rend vraie la promesse affichée sur la page tarifs ("vos données vous appartiennent,
// exportables à tout moment") — jusqu'ici, seul l'historique des commandes pouvait s'exporter
// (CSV, page Commandes), pas l'ensemble catalogue/fournisseurs/équipe. Tout est déjà chargé
// côté site pour l'établissement courant, donc aucun aller-retour serveur n'est nécessaire :
// on sérialise directement en JSON, lisible par n'importe qui (même hors tableur) et
// ré-important à la main si besoin un jour de changer d'outil.
function gatherAllRestaurantData(resto){
  return {
    exporte_le: new Date().toISOString(),
    etablissement: { nom: resto.name, adresse: resto.address||null, code_postal: resto.postalCode||null, ville: resto.city||null, siret: resto.siret||null, devise: resto.currency },
    produits: PRODUCTS.map(p => ({
      nom: p.name, categorie: p.cat||null, unite: p.unit, quantite_commande_habituelle: p.qtyCommande,
      prix_achat_ht: p.price, taux_tva: p.tvaRate??5.5, fournisseur: (SUPPLIERS.find(s=>s.id===p.supplier)||{}).name || null,
      departement: p.department||null, lieux: (p.zoneIds||[]).map(zid=>(ZONES.find(z=>z.id===zid)||{}).name).filter(Boolean),
      conditionnement: p.packaging||null, reference_fournisseur: p.supplierReference||null,
    })),
    fournisseurs: SUPPLIERS.map(s => ({
      nom: s.name, categorie: s.cat||null, delai_moyen: s.delay||null, email: s.email||null, adresse: s.address||null,
      contact_commercial: [s.contactFirstName, s.contactLastName].filter(Boolean).join(' ') || null,
      contact_email: s.contactEmail||null, contact_telephone: s.contactPhone||null,
    })),
    categories: CATEGORIES.map(c => c.name),
    lieux: ZONES.map(z => z.name),
    equipe: TEAM.map(t => ({
      nom: t.name, role: t.role, horaires: t.shift||null, statut: t.status,
      peut_commander_directement: !!t.canOrderDirectly, plafond_commande_avant_validation: t.orderSpendingLimit ?? null,
    })),
    historique_commandes: ORDERS.map(o => ({
      reference: o.id, fournisseur: (SUPPLIERS.find(s=>s.id===o.supplier)||{}).name || null,
      contenu: o.items, montant: o.amount, statut: o.status, date: o.date,
    })),
    // Le module HACCP est facultatif — on n'exporte ces sections que s'il est activé, pour ne
    // pas alourdir l'export de quelqu'un qui n'utilise pas cette fonctionnalité.
    ...(resto.haccpEnabled ? {
      haccp_equipements: HACCP_EQUIPMENT.map(e => ({ nom: e.name, seuil_min: e.minTemp, seuil_max: e.maxTemp })),
      haccp_releves_temperature: HACCP_TEMP_LOGS.map(l => ({
        equipement: l.equipmentName, temperature: l.temperature, conforme: l.inRange,
        note: l.note||null, releve_par: l.loggedByName||null, date: l.createdAt.toISOString(),
      })),
      haccp_taches_nettoyage: HACCP_CLEANING_TASKS.map(t => ({ nom: t.name, frequence: t.frequency, moment: t.moment||'journee' })),
      haccp_nettoyages_effectues: HACCP_CLEANING_LOGS.map(l => ({
        tache: l.taskName, fait_par: l.doneByName||null, date: l.createdAt.toISOString(),
      })),
    } : {}),
  };
}
function exportAllRestaurantData(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(!resto) return;
  const data = gatherAllRestaurantData(resto);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mise-et-sure-export-${(resto.name||'etablissement').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Export technique (JSON) téléchargé');
}

async function saveRestoInfo(){
  const resto = RESTOS.find(r=>r.id===state.resto);
  const name = document.getElementById('set-name').value.trim();
  const address = document.getElementById('set-address').value.trim();
  const postalCode = document.getElementById('set-postal').value.trim();
  const city = document.getElementById('set-city').value.trim();
  const currency = document.getElementById('set-currency').value;
  const siret = document.getElementById('set-siret').value.trim();
  const siretDigits = siret.replace(/\D/g,'');
  if(siret && siretDigits.length !== 14){
    toast('Le SIRET doit contenir 14 chiffres — complétez-le ou laissez le champ vide.', 'alert');
    return;
  }
  if(siret && !isValidSiretChecksum(siretDigits)){
    toast("Ce numéro SIRET ne semble pas correct — vérifiez la saisie avant d'enregistrer.", 'alert');
    return;
  }
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}`, {
      method:'PATCH', body:{ name: name||undefined, address, postalCode, city: city||undefined, currency, siret },
    });
    resto.name = data.restaurant.name;
    resto.address = data.restaurant.address;
    resto.postalCode = data.restaurant.postal_code;
    resto.city = data.restaurant.city;
    resto.currency = data.restaurant.currency;
    resto.latitude = data.restaurant.latitude;
    resto.longitude = data.restaurant.longitude;
    resto.siret = data.restaurant.siret;
    toast('Paramètres enregistrés');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function viewAide(){
  const q = (state.aideSearch || '').toLowerCase().trim();
  const categories = FAQ_CATEGORIES.map(cat => ({
    ...cat,
    items: cat.items.filter(item => !q || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q)),
  })).filter(cat => cat.items.length > 0);
  const totalResults = categories.reduce((sum, c) => sum + c.items.length, 0);
  return `
    <div class="section-head" style="margin-top:0;">
      <div><h2>Aide</h2><div class="sub">Toutes les réponses aux questions les plus fréquentes sur le site, organisées par thème.</div></div>
    </div>
    ${state.role==='patron' ? `
    <div class="card" style="margin-bottom:22px;">
      <div class="flex between center" style="flex-wrap:wrap;gap:12px;">
        <div>
          <div class="card-title" style="margin-bottom:2px;">Visite guidée de l'interface</div>
          <div class="small muted">Une info-bulle à la fois, sur les vrais menus — 30 secondes.</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="startGuidedTour()">${iconSm(I.spark)} Relancer la visite</button>
      </div>
    </div>` : ''}
    <div class="field" style="max-width:420px;margin-bottom:22px;">
      <input type="text" placeholder="🔎 Rechercher une question…" value="${escapeHtml(state.aideSearch||'')}" oninput="filterAideFaq(this.value)">
    </div>
    ${q && totalResults===0 ? emptyState('Aucune question ne correspond à votre recherche.') : ''}
    ${categories.map(cat => `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title" style="margin-bottom:10px;">${escapeHtml(cat.label)}</div>
        ${cat.items.map((item, idx) => {
          const itemKey = cat.id + '-' + idx;
          const isOpen = state.aideOpenItem === itemKey;
          return `
          <div class="faq-item">
            <button class="faq-question" onclick="toggleAideItem('${itemKey}')">
              <span>${escapeHtml(item.q)}</span>
              <span class="faq-chevron ${isOpen?'open':''}">${iconSm(I.chevronDown)}</span>
            </button>
            ${isOpen ? `<div class="faq-answer">
              <p>${escapeHtml(item.a)}</p>
              ${item.img && AIDE_REFERENCE_IMAGES[item.img] ? `<img src="${AIDE_REFERENCE_IMAGES[item.img].data}" alt="${escapeHtml(AIDE_REFERENCE_IMAGES[item.img].desc)}" class="faq-image">` : ''}
            </div>` : ''}
          </div>
        `;}).join('')}
      </div>
    `).join('')}

// Chargé une seule fois (pas à chaque rendu) — state.mySupportQuestions reste `undefined` tant
// que rien n'a jamais été demandé, `null` pendant le chargement, puis le tableau une fois prêt.
let mySupportQuestionsLoading = false;
async function ensureMySupportQuestionsLoaded(){
  if(state.mySupportQuestions !== undefined || mySupportQuestionsLoading) return;
  mySupportQuestionsLoading = true;
  state.mySupportQuestions = null;
  try{
    const data = await apiRequest('/api/account/support-questions');
    state.mySupportQuestions = data.questions;
  } catch(err){
    state.mySupportQuestions = [];
  }
  mySupportQuestionsLoading = false;
  render();
}
async function submitSupportQuestion(){
  const textarea = document.getElementById('support-question-text');
  const question = textarea ? textarea.value.trim() : '';
  if(!question){ toast('Merci de rédiger votre question', 'alert'); return; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest('/api/account/support-questions', {
      method:'POST', body:{ question, restaurantId: resto ? resto.remoteId : null },
    });
    toast('Question envoyée — vous recevrez une réponse par email');
    textarea.value = '';
    const data = await apiRequest('/api/account/support-questions');
    state.mySupportQuestions = data.questions;
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function escapeHtml(str){
  // Échappe aussi les guillemets (en plus de < > &), pour être sûr même quand le texte est
  // inséré dans un attribut HTML (ex : value="...") et pas seulement dans du contenu visible —
  // sinon un texte contenant un guillemet pourrait sortir de l'attribut et injecter du code.
  if(str==null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function validateOrder(id){
  if(!requirePerm(['patron'], 'Seul le patron peut valider une commande')) return;
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}`, { method:'PATCH', body:{ status:'validee' } });
    o.status = 'validee';
    toast('Commande '+id+' validée');
    notifyByEmail('manager', `commande ${id} validée par le patron — prête à réceptionner.`, 'commandes');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
async function refuseOrder(id){
  if(!requirePerm(['patron'], 'Seul le patron peut refuser une commande')) return;
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}`, { method:'PATCH', body:{ status:'refusee' } });
    o.status = 'refusee';
    toast('Commande '+id+' refusée', 'alert');
    notifyByEmail('manager', `commande ${id} refusée par le patron.`, 'commandes');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  let receivedTotal = 0;
  let hasDiscrepancy = false;
  let expectedTotal = 0;
  (o.lineItems||[]).forEach((li,idx)=>{
    // Une ligne déjà réceptionnée lors d'un passage précédent (réception partielle) n'est plus
    // éditable ici et ne rentre pas dans le total "en cours de confirmation" — elle a déjà été
    // comptabilisée à l'époque.
    if(o.status==='partiellement_recue' && li.received===true) return;
    expectedTotal += (Number(li.qty)||0)*(Number(li.price)||0);
    const checkbox = document.getElementById('rcv-received-'+idx);
    const isReceivedNow = checkbox ? checkbox.checked : true;
    if(!isReceivedNow) return;
    const qtyInput = document.getElementById('rcv-qty-'+idx);
    const priceInput = document.getElementById('rcv-price-'+idx);
    const qty = qtyInput ? parseFloat(qtyInput.value)||0 : li.qty;
    const price = priceInput ? parseFloat(priceInput.value)||0 : li.price;
    receivedTotal += qty*price;
    if(qty !== Number(li.qty) || price !== Number(li.price)) hasDiscrepancy = true;
  });
  const totalEl = document.getElementById('rcv-total-received');
  if(totalEl) totalEl.textContent = receivedTotal.toFixed(2)+' €';
  const expectedEl = document.getElementById('rcv-total-expected');
  if(expectedEl) expectedEl.textContent = expectedTotal.toFixed(2)+' €';
  const diffRow = document.getElementById('rcv-diff-row');
  if(diffRow){
    const diff = receivedTotal - expectedTotal;
    diffRow.innerHTML = hasDiscrepancy
      ? `<span class="small" style="color:var(--urgent);font-weight:700;">⚠ Écart détecté</span><span class="mono" style="color:var(--urgent);font-weight:700;">${diff>=0?'+':''}${diff.toFixed(2)} €</span>`
      : `<span class="small muted">Aucun écart pour l'instant</span><span class="mono muted">0.00 €</span>`;
  }
}

async function confirmReceiveOrder(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const isCompleting = o.status==='partiellement_recue';
  const receivedLineItems = (o.lineItems||[]).map((li,idx)=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    // Ligne déjà reçue lors d'un passage précédent : renvoyée telle quelle, inchangée — le
    // serveur en a besoin pour reconstituer l'état complet de la commande à chaque appel.
    if(isCompleting && li.received===true){
      return {
        productId: p ? p.remoteId : null, name: p ? p.name : li.name,
        qtyOrdered: li.qty, qtyReceived: li.qtyReceived,
        priceOrdered: li.price, priceReceived: li.priceReceived, received: true, tvaRate: li.tvaRate??5.5,
      };
    }
    const checkbox = document.getElementById('rcv-received-'+idx);
    const isReceivedNow = checkbox ? checkbox.checked : true;
    const qtyInput = document.getElementById('rcv-qty-'+idx);
    const priceInput = document.getElementById('rcv-price-'+idx);
    const lotInput = document.getElementById('rcv-lot-'+idx);
    return {
      productId: p ? p.remoteId : null, name: p ? p.name : li.name,
      qtyOrdered: li.qty, qtyReceived: isReceivedNow ? (qtyInput ? parseFloat(qtyInput.value)||0 : li.qty) : null,
      priceOrdered: li.price, priceReceived: isReceivedNow ? (priceInput ? parseFloat(priceInput.value)||0 : li.price) : null,
      received: isReceivedNow, lotNumber: lotInput ? lotInput.value.trim() : (li.lotNumber||''), tvaRate: li.tvaRate??5.5,
    };
  });
  const updateCatalogEl = document.getElementById('rcv-update-catalog');
  const updateCatalogPrices = updateCatalogEl ? updateCatalogEl.checked : false;
  const photoPreview = document.getElementById('rcv-photo-preview');
  const deliveryNotePhotoUrl = (photoPreview && photoPreview.dataset.value) || null;
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/orders/${o.remoteId}/receive`, {
      method:'PATCH', body:{ receivedLineItems, updateCatalogPrices, deliveryNotePhotoUrl },
    });
    o.status = data.order.status; // 'livree' ou 'partiellement_recue', selon ce qui a vraiment été reçu — jamais deviné côté navigateur
    o.hasDiscrepancy = data.order.has_discrepancy;
    o.lineItems = (data.order.line_items||[]).map(li=>{
      const localProduct = li.productId ? PRODUCTS.find(p=>p.remoteId===li.productId) : null;
      return { ...li, productId: localProduct ? localProduct.id : null };
    });
    o.amount = parseFloat(data.order.amount);
    if(data.order.has_discrepancy){
      notifyByEmail('patron', `écart détecté à la réception de la commande ${o.id}.`, 'ecart');
      notifyByEmail('manager', `écart détecté à la réception de la commande ${o.id}.`, 'ecart');
    }
    if(updateCatalogPrices){
      receivedLineItems.forEach(li=>{
        if(!li.productId || !li.received) return;
        const localProduct = PRODUCTS.find(p=>p.remoteId===li.productId);
        if(localProduct && li.priceReceived != null) localProduct.price = li.priceReceived;
      });
    }
    closeModal();
    if(o.status==='partiellement_recue'){
      toast('Réception partielle enregistrée — vous pourrez compléter le reste dès son arrivée.');
    } else {
      toast(data.order.has_discrepancy ? 'Réception confirmée — écart détecté par rapport à la commande' : 'Livraison réceptionnée — tout correspond à la commande');
    }
    // Le serveur vient peut-être d'ajouter une estimation de stock pour les produits reçus
    // (voir la route /receive) — on la récupère pour que l'onglet Inventaire soit à jour sans
    // attendre un rechargement complet de la page.
    if(resto.stockCountsEnabled) await syncStockCountsFromServer(state.resto);
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function recomputeOrderTotals(o){
  let amount = 0;
  const parts = [];
  (o.lineItems||[]).forEach(li=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const price = p ? p.price : (li.price||0);
    const name = p ? p.name : (li.name||'Article');
    const unit = p ? p.unit : '';
    amount += li.qty*price;
    parts.push(unit ? `${name} × ${li.qty} ${unit}` : `${name} × ${li.qty}`);
  });
  o.amount = Math.round(amount*100)/100;
  o.items = parts.join(', ');
}

/* ============================================================
   SIGNALEMENT (cuisine / salle) — un tap, aucune quantité à saisir :
   c'est le manager qui décide de la quantité à commander au moment
   d'approuver la demande.
============================================================ */
async function submitSignal(from, urgent){
  const item = document.getElementById('sig-item').value;
  const note = document.getElementById('sig-note').value;
  if(!item){ toast('Merci de sélectionner un produit','alert'); return; }
  const remainingInput = document.getElementById('sig-remaining');
  const remainingQty = remainingInput && remainingInput.value !== '' ? parseFloat(remainingInput.value) : null;
  const prod = PRODUCTS.find(p=>p.name===item);
  const author = currentPersonDisplayName();
  const now = new Date();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const byName = author + ' ('+(from==='Cuisine'?'cuisine':'salle')+')';
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/requests`, {
      method:'POST',
      body:{ fromDept: from, itemName: item, unit: prod?prod.unit:'unité', urgent, note, byName, remainingQty },
    });
    REQUESTS.unshift({
      id:'D-'+nextId(), remoteId: data.request.id, from, by: byName,
      item, unit: prod?prod.unit:'unité', urgent, note, remainingQty, status:'attente', time: fmtTime(now), createdAt: now,
      createdByMemberId: data.request.created_by_member_id,
    });
    closeModal();
    const recipient = from==='Cuisine' ? 'patron' : 'manager';
    toast(urgent ? `Commande urgente signalée au ${recipient}` : `Demande envoyée au ${recipient}`);
    if(urgent){
      if(from==='Salle') notifyByEmail('manager', `commande urgente signalée : ${item} (par ${author}).`, 'demandes');
      notifyByEmail('patron', `commande urgente signalée : ${item} (par ${author}).`, 'urgent');
    } else {
      notifyByEmail(recipient, `nouvelle demande : ${item} (par ${author}).`, 'demande_normale');
    }
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function openSignalModal(from, urgent){
  const dept = from==='Cuisine' ? 'cuisine' : 'salle';
  const list = PRODUCTS.filter(p=>p.department===dept || p.department==='both');

    <div class="modal-sub">${urgent?"Le manager et le patron sont notifiés à l'instant — aucune quantité à indiquer, la quantité standard du produit est utilisée.":'Votre demande sera envoyée au manager pour validation. Aucune quantité à indiquer.'}</div>

      <div class="flex center gap8"><input id="sig-remaining" type="number" min="0" step="0.1" placeholder="Ex : 2" style="max-width:140px;"><span class="small muted" id="sig-unit-label">— choisissez d'abord un produit</span></div>
    </div>

  `);
}
function filterProductPicker(pickerId){
  // L'identifiant du champ de recherche se déduit du PRÉFIXE commun (ex. "ing", "ing-edit",
  // "sig"), pas d'une simple concaténation sur pickerId — sinon "ing-picker" donnerait
  // "ing-picker-search" au lieu du vrai "ing-search", et la recherche resterait silencieusement
  // sans effet (elle ne trouve jamais le champ, donc ne filtre jamais rien).
  const prefix = pickerId.endsWith('-picker') ? pickerId.slice(0, -'-picker'.length) : pickerId;
  const input = document.getElementById(prefix+'-search');
  const q = (input ? input.value : '').toLowerCase();
  document.querySelectorAll('#'+pickerId+' .product-picker-row').forEach(row=>{
    row.style.display = row.dataset.search.includes(q) ? '' : 'none';
  });
}
function selectProductPickerRow(el, hiddenInputId, pickerId, unitLabelId){
  document.getElementById(hiddenInputId).value = el.dataset.name;
  document.querySelectorAll('#'+pickerId+' .product-picker-row').forEach(r=>r.classList.remove('selected'));
  el.classList.add('selected');
  if(unitLabelId){
    const label = document.getElementById(unitLabelId);
    if(label) label.textContent = 'en ' + (el.dataset.unit || 'unité');
  }
}

async function confirmApproveCustomRequest(id){

  const cr = CUSTOM_REQUESTS.find(x=>x.id===id); if(!cr) return;
  const supplierId = document.getElementById('cr-supplier').value || null;

// Contrairement à une simple photo, un "scan" doit rester lisible même pris à la va-vite, sur
// un ticket ou un bon de livraison souvent mal imprimé : on booste le contraste et on
// désature légèrement, pour se rapprocher du rendu d'une vraie appli de scan — sans dépendre
// d'une appli tierce que tout le monde ne sait pas forcément utiliser.
function scanDocumentFile(file, callback){
  if(!file.type.startsWith('image/')){ toast('Merci de choisir un fichier image','alert'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 1600; // plus grand qu'une photo classique : un document doit rester lisible en zoomant
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      if('filter' in ctx) ctx.filter = 'contrast(1.35) brightness(1.08) saturate(0.35)';
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleDocumentScan(input, prefix){
  const file = input.files && input.files[0];
  if(!file) return;
  const preview = document.getElementById(prefix+'-photo-preview');
  if(preview) preview.innerHTML = `<div class="small muted">Traitement du document…</div>`;
  scanDocumentFile(file, (scanned) => {
    if(preview){
      preview.innerHTML = `
        <div style="position:relative;display:inline-block;">
          <img src="${scanned}" alt="Document scanné" style="width:110px;height:110px;border-radius:8px;object-fit:cover;border:1px solid var(--border);">
          <button type="button" onclick="clearDocumentScan('${prefix}')" title="Retirer" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--black);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:1;">×</button>
        </div>
        <div class="small muted" style="margin-top:6px;">Document scanné — pas assez lisible ? Reprenez la photo ci-dessous.</div>
      `;
      preview.dataset.value = scanned;
    }
    input.value = ''; // permet de reprendre la même photo si besoin, le champ file ne "retient" pas la valeur
  });
}
function clearDocumentScan(prefix){
  const preview = document.getElementById(prefix+'-photo-preview');
  if(preview){ preview.innerHTML = ''; delete preview.dataset.value; }
}
function compressImageFile(file, maxDim, quality, callback){
  if(!file.type.startsWith('image/')){ toast('Merci de choisir un fichier image','alert'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Redimensionne et compresse avant de stocker, pour qu'une photo prise avec un
      // téléphone (souvent plusieurs Mo) reste toujours légère et rapide à charger.
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleProductPhotoUpload(input, prefix){
  const file = input.files && input.files[0];

}

// ============================================================
// IMPORT CSV DE PRODUITS — pour rentrer un catalogue existant (Excel/Google Sheets exporté en
// CSV) sans tout retaper produit par produit. Colonnes reconnues (accents et casse ignorés,
// ordre libre) : nom (obligatoire), categorie, unite, prix, quantite_commande, fournisseur
// (par nom, doit déjà exister), conditionnement, reference_fournisseur.
// ============================================================
const CSV_COLUMN_ALIASES = {
  name: ['nom','name','produit','article'],
  category: ['categorie','category'],
  unit: ['unite','unit','uniteDeCommande'.toLowerCase()],
  price: ['prix','price','prixachat','prixdachat'],
  tva: ['tva','tauxtva','tvarate'],
  qty: ['quantitecommande','qtecommande','quantite','qty','qtycommande'],
  supplier: ['fournisseur','supplier'],
  packaging: ['conditionnement','packaging'],
  reference: ['referencefournisseur','reference','ref'],
};
function normalizeCSVHeader(h){
  return (h||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
// Analyseur CSV volontairement simple mais robuste aux cas réels : détecte automatiquement le
// séparateur (virgule ou point-virgule — Excel en France exporte souvent avec ;), gère les
// champs entre guillemets contenant des virgules, des retours à la ligne ou des guillemets
// échappés ("").
function parseCSVText(text){
  const firstLine = (text.split(/\r?\n/)[0] || '');
  const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===delimiter){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* ignoré, le \n qui suit termine déjà la ligne */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f=>(f||'').trim()!==''));
}
// Transforme les lignes CSV brutes en objets produits exploitables, en retenant au passage les
// lignes invalides (sans nom) pour les signaler clairement plutôt que de les créer à moitié.
function mapCSVRowsToProducts(rows){
  if(!rows.length) return { items: [], skipped: 0 };
  const header = rows[0].map(normalizeCSVHeader);
  const colIndex = {};
  Object.keys(CSV_COLUMN_ALIASES).forEach(field=>{
    const idx = header.findIndex(h => CSV_COLUMN_ALIASES[field].includes(h));
    if(idx !== -1) colIndex[field] = idx;
  });
  let skipped = 0;
  const items = [];
  for(const r of rows.slice(1)){
    const name = (colIndex.name!=null ? r[colIndex.name] : '')?.trim();
    if(!name){ skipped++; continue; }
    items.push({
      name,
      category: colIndex.category!=null ? (r[colIndex.category]||'').trim() : '',
      unit: colIndex.unit!=null ? (r[colIndex.unit]||'').trim() : 'unité',
      price: colIndex.price!=null ? (parseNum(r[colIndex.price])||0) : 0,
      tvaRate: (() => {
        if(colIndex.tva==null) return 5.5;
        const parsed = parseNum(r[colIndex.tva]);
        // On accepte la valeur si elle correspond (à peu près) à l'un des 4 taux français
        // standards — sinon repli sur 5,5 % plutôt que de bloquer tout l'import pour une
        // cellule mal saisie.
        const match = TVA_RATES.find(t=>Number.isFinite(parsed) && Math.abs(t.value-parsed)<0.3);
        return match ? match.value : 5.5;
      })(),
      qtyCommande: colIndex.qty!=null ? (parseNum(r[colIndex.qty])||1) : 1,
      supplierName: colIndex.supplier!=null ? (r[colIndex.supplier]||'').trim() : '',
      packaging: colIndex.packaging!=null ? (r[colIndex.packaging]||'').trim() : '',
      supplierReference: colIndex.reference!=null ? (r[colIndex.reference]||'').trim() : '',
    });
  }
  return { items, skipped, hasNameColumn: colIndex.name!=null };
}

function handleProductsCSVFileSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSVText(String(reader.result));
    const { items, skipped, hasNameColumn } = mapCSVRowsToProducts(rows);
    state.pendingCSVImport = { items };
    const preview = document.getElementById('csv-import-preview');
    const confirmBtn = document.getElementById('csv-import-confirm-btn');
    if(!hasNameColumn){
      if(preview) preview.innerHTML = `<div class="small" style="color:var(--urgent);margin-bottom:10px;">Aucune colonne "nom" reconnue dans ce fichier — vérifiez l'en-tête de la première ligne.</div>`;
      if(confirmBtn) confirmBtn.disabled = true;
      return;
    }
    if(preview){
      preview.innerHTML = `<div class="small muted" style="margin-bottom:10px;">
        <b>${items.length}</b> produit${items.length>1?'s':''} prêt${items.length>1?'s':''} à importer${skipped?` · ${skipped} ligne${skipped>1?'s':''} ignorée${skipped>1?'s':''} (sans nom)`:''}.
      </div>`;
    }
    if(confirmBtn) confirmBtn.disabled = items.length===0;
  };
  reader.readAsText(file, 'UTF-8');
}
async function confirmImportProductsCSV(){
  const pending = state.pendingCSVImport;
  if(!pending || !pending.items.length) return;
  const confirmBtn = document.getElementById('csv-import-confirm-btn');
  if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…'; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  let created = 0, failed = 0;
  // Un appel par produit, l'un après l'autre : plus lent qu'un import groupé côté serveur, mais
  // réutilise telle quelle la validation déjà en place pour la création d'un produit, sans
  // avoir à dupliquer cette logique dans une route dédiée pour ce cas d'usage plus rare.
  for(const item of pending.items){
    try{
      const supplierObj = item.supplierName ? SUPPLIERS.find(s=>s.name.toLowerCase().trim()===item.supplierName.toLowerCase()) : null;
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/products`, {
        method:'POST',
        body:{
          name:item.name, category:item.category, unit:item.unit||'unité', price:item.price,
          qtyCommande:item.qtyCommande||1, department:'both', tvaRate:item.tvaRate??5.5,
          supplierId: supplierObj?supplierObj.remoteId:null, packaging:item.packaging, supplierReference:item.supplierReference,
        },
      });
      PRODUCTS.push({
        id:'p'+data.product.id, remoteId:data.product.id, name:data.product.name, unit:data.product.unit,
        qtyCommande:parseFloat(data.product.qty_commande), supplier: supplierObj?supplierObj.id:null,
        cat:data.product.category, price:parseFloat(data.product.price), department:data.product.department,
        packaging:item.packaging, supplierReference:item.supplierReference, zoneIds:[], tvaRate:parseFloat(data.product.tva_rate),
      });
      created++;
    } catch(err){
      failed++;
    }
  }
  state.pendingCSVImport = null;
  closeModal();
  toast(failed>0 ? `${created} produit${created>1?'s':''} importé${created>1?'s':''}, ${failed} échec${failed>1?'s':''}` : `${created} produit${created>1?'s':''} importé${created>1?'s':''}`);
  render();
}
