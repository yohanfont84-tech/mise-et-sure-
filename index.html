// Contrairement à une simple photo, un "scan" doit rester lisible même pris à la va-vite, sur
// un ticket ou un bon de livraison souvent mal imprimé : on booste le contraste et on
// désature légèrement, pour se rapprocher du rendu d'une vraie appli de scan — sans dépendre
// d'une appli tierce que tout le monde ne sait pas forcément utiliser.
function scanDocumentFile(file, callback){
  if(!file.type.startsWith('image/')){ toast('Merci de choisir un fichier image','alert'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 1600; // plus grand qu'une photo classique : un document doit rester lisible en zoomant
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      if('filter' in ctx) ctx.filter = 'contrast(1.35) brightness(1.08) saturate(0.35)';
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleDocumentScan(input, prefix){
  const file = input.files && input.files[0];
  if(!file) return;
  const preview = document.getElementById(prefix+'-photo-preview');
  if(preview) preview.innerHTML = `<div class="small muted">Traitement du document…</div>`;
  scanDocumentFile(file, (scanned) => {
    if(preview){
      preview.innerHTML = `
        <div style="position:relative;display:inline-block;">
          <img src="${scanned}" alt="Document scanné" style="width:110px;height:110px;border-radius:8px;object-fit:cover;border:1px solid var(--border);">
          <button type="button" onclick="clearDocumentScan('${prefix}')" title="Retirer" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--black);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:1;">×</button>
        </div>
        <div class="small muted" style="margin-top:6px;">Document scanné — pas assez lisible ? Reprenez la photo ci-dessous.</div>
      `;
      preview.dataset.value = scanned;
    }
    input.value = ''; // permet de reprendre la même photo si besoin, le champ file ne "retient" pas la valeur
  });
}
function clearDocumentScan(prefix){
  const preview = document.getElementById(prefix+'-photo-preview');
  if(preview){ preview.innerHTML = ''; delete preview.dataset.value; }
}
function compressImageFile(file, maxDim, quality, callback){
  if(!file.type.startsWith('image/')){ toast('Merci de choisir un fichier image','alert'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Redimensionne et compresse avant de stocker, pour qu'une photo prise avec un
      // téléphone (souvent plusieurs Mo) reste toujours légère et rapide à charger.
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleProductPhotoUpload(input, prefix){
  const file = input.files && input.files[0];

// ============================================================
// IMPORT CSV DE PRODUITS — pour rentrer un catalogue existant (Excel/Google Sheets exporté en
// CSV) sans tout retaper produit par produit. Colonnes reconnues (accents et casse ignorés,
// ordre libre) : nom (obligatoire), categorie, unite, prix, quantite_commande, fournisseur
// (par nom, doit déjà exister), conditionnement, reference_fournisseur.
// ============================================================
const CSV_COLUMN_ALIASES = {
  name: ['nom','name','produit','article'],
  category: ['categorie','category'],
  unit: ['unite','unit','uniteDeCommande'.toLowerCase()],
  price: ['prix','price','prixachat','prixdachat'],
  tva: ['tva','tauxtva','tvarate'],
  qty: ['quantitecommande','qtecommande','quantite','qty','qtycommande'],
  supplier: ['fournisseur','supplier'],
  packaging: ['conditionnement','packaging'],
  reference: ['referencefournisseur','reference','ref'],
};
function normalizeCSVHeader(h){
  return (h||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}
// Analyseur CSV volontairement simple mais robuste aux cas réels : détecte automatiquement le
// séparateur (virgule ou point-virgule — Excel en France exporte souvent avec ;), gère les
// champs entre guillemets contenant des virgules, des retours à la ligne ou des guillemets
// échappés ("").
function parseCSVText(text){
  const firstLine = (text.split(/\r?\n/)[0] || '');
  const delimiter = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===delimiter){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* ignoré, le \n qui suit termine déjà la ligne */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f=>(f||'').trim()!==''));
}
// Transforme les lignes CSV brutes en objets produits exploitables, en retenant au passage les
// lignes invalides (sans nom) pour les signaler clairement plutôt que de les créer à moitié.
function mapCSVRowsToProducts(rows){
  if(!rows.length) return { items: [], skipped: 0 };
  const header = rows[0].map(normalizeCSVHeader);
  const colIndex = {};
  Object.keys(CSV_COLUMN_ALIASES).forEach(field=>{
    const idx = header.findIndex(h => CSV_COLUMN_ALIASES[field].includes(h));
    if(idx !== -1) colIndex[field] = idx;
  });
  let skipped = 0;
  const items = [];
  for(const r of rows.slice(1)){
    const name = (colIndex.name!=null ? r[colIndex.name] : '')?.trim();
    if(!name){ skipped++; continue; }
    items.push({
      name,
      category: colIndex.category!=null ? (r[colIndex.category]||'').trim() : '',
      unit: colIndex.unit!=null ? (r[colIndex.unit]||'').trim() : 'unité',
      price: colIndex.price!=null ? (parseNum(r[colIndex.price])||0) : 0,
      tvaRate: (() => {
        if(colIndex.tva==null) return 5.5;
        const parsed = parseNum(r[colIndex.tva]);
        // On accepte la valeur si elle correspond (à peu près) à l'un des 4 taux français
        // standards — sinon repli sur 5,5 % plutôt que de bloquer tout l'import pour une
        // cellule mal saisie.
        const match = TVA_RATES.find(t=>Number.isFinite(parsed) && Math.abs(t.value-parsed)<0.3);
        return match ? match.value : 5.5;
      })(),
      qtyCommande: colIndex.qty!=null ? (parseNum(r[colIndex.qty])||1) : 1,
      supplierName: colIndex.supplier!=null ? (r[colIndex.supplier]||'').trim() : '',
      packaging: colIndex.packaging!=null ? (r[colIndex.packaging]||'').trim() : '',
      supplierReference: colIndex.reference!=null ? (r[colIndex.reference]||'').trim() : '',
    });
  }
  return { items, skipped, hasNameColumn: colIndex.name!=null };
}

function handleProductsCSVFileSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSVText(String(reader.result));
    const { items, skipped, hasNameColumn } = mapCSVRowsToProducts(rows);
    state.pendingCSVImport = { items };
    const preview = document.getElementById('csv-import-preview');
    const confirmBtn = document.getElementById('csv-import-confirm-btn');
    if(!hasNameColumn){
      if(preview) preview.innerHTML = `<div class="small" style="color:var(--urgent);margin-bottom:10px;">Aucune colonne "nom" reconnue dans ce fichier — vérifiez l'en-tête de la première ligne.</div>`;
      if(confirmBtn) confirmBtn.disabled = true;
      return;
    }
    if(preview){
      preview.innerHTML = `<div class="small muted" style="margin-bottom:10px;">
        <b>${items.length}</b> produit${items.length>1?'s':''} prêt${items.length>1?'s':''} à importer${skipped?` · ${skipped} ligne${skipped>1?'s':''} ignorée${skipped>1?'s':''} (sans nom)`:''}.
      </div>`;
    }
    if(confirmBtn) confirmBtn.disabled = items.length===0;
  };
  reader.readAsText(file, 'UTF-8');
}
async function confirmImportProductsCSV(){
  const pending = state.pendingCSVImport;
  if(!pending || !pending.items.length) return;
  const confirmBtn = document.getElementById('csv-import-confirm-btn');
  if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…'; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  let created = 0, failed = 0;
  // Un appel par produit, l'un après l'autre : plus lent qu'un import groupé côté serveur, mais
  // réutilise telle quelle la validation déjà en place pour la création d'un produit, sans
  // avoir à dupliquer cette logique dans une route dédiée pour ce cas d'usage plus rare.
  for(const item of pending.items){
    try{
      const supplierObj = item.supplierName ? SUPPLIERS.find(s=>s.name.toLowerCase().trim()===item.supplierName.toLowerCase()) : null;
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/products`, {
        method:'POST',
        body:{
          name:item.name, category:item.category, unit:item.unit||'unité', price:item.price,
          qtyCommande:item.qtyCommande||1, department:'both', tvaRate:item.tvaRate??5.5,
          supplierId: supplierObj?supplierObj.remoteId:null, packaging:item.packaging, supplierReference:item.supplierReference,
        },
      });
      PRODUCTS.push({
        id:'p'+data.product.id, remoteId:data.product.id, name:data.product.name, unit:data.product.unit,
        qtyCommande:parseFloat(data.product.qty_commande), supplier: supplierObj?supplierObj.id:null,
        cat:data.product.category, price:parseFloat(data.product.price), department:data.product.department,
        packaging:item.packaging, supplierReference:item.supplierReference, zoneIds:[], tvaRate:parseFloat(data.product.tva_rate),
      });
      created++;
    } catch(err){
      failed++;
    }
  }
  state.pendingCSVImport = null;
  closeModal();
  toast(failed>0 ? `${created} produit${created>1?'s':''} importé${created>1?'s':''}, ${failed} échec${failed>1?'s':''}` : `${created} produit${created>1?'s':''} importé${created>1?'s':''}`);
  render();
}

async function loadPriceHistoryForProduct(id){
  const p = PRODUCTS.find(x=>x.id===id);
  const resto = RESTOS.find(r=>r.id===state.resto);
  const container = document.getElementById('ep-price-history');
  if(!p || !resto || !p.remoteId || !container) return;
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/products/${p.remoteId}/price-history`);
    const history = data.priceHistory || [];
    if(!container) return; // la fenêtre a pu être refermée entre-temps
    if(history.length === 0){
      container.innerHTML = `<div class="small muted">Aucun historique pour l'instant — il se remplit à chaque réception de commande.</div>`;
      return;
    }
    container.innerHTML = `
      <div class="price-history-list">
        ${history.map((h, idx) => {
          const price = parseFloat(h.price) || 0;
          const prevRaw = history[idx+1] ? parseFloat(history[idx+1].price) : null;
          const prev = (prevRaw !== null && !isNaN(prevRaw)) ? prevRaw : null;
          let trend = '';
          if(prev !== null){
            if(price > prev) trend = `<span style="color:var(--urgent);font-weight:600;">▲ +${(price-prev).toFixed(2)}€</span>`;
            else if(price < prev) trend = `<span style="color:#2F9E44;font-weight:600;">▼ ${(price-prev).toFixed(2)}€</span>`;
            else trend = `<span class="small muted">stable</span>`;
          }
          const date = new Date(h.recorded_at).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
          return `<div class="price-history-row"><span class="small muted">${date}</span><span class="mono">${price.toFixed(2)} €</span>${trend}</div>`;
        }).join('')}
      </div>
    `;
  } catch(err){
    if(container) container.innerHTML = `<div class="small muted">Historique indisponible pour le moment.</div>`;
  }
}
async function saveProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const name = document.getElementById('ep-name').value.trim() || p.name;
  const catSelect = document.getElementById('ep-cat');
  const cat = await createCategoryIfNeeded(catSelect);
  if(cat===null) return;
  const unit = document.getElementById('ep-unit').value.trim() || p.unit;
  const packaging = document.getElementById('ep-packaging').value.trim();
  const supplierReference = document.getElementById('ep-reference').value.trim();
  const priceEl = document.getElementById('ep-price');
  // Avant : `parseNum(...) || p.price` — un piège classique de JavaScript, où 0 est
  // "faux" au même titre qu'une valeur vide : impossible de remettre un produit à 0,00 €,
  // le prix précédent revenait silencieusement à la place. On teste maintenant explicitement
  // si le nombre est valide, plutôt que de se fier à sa "vérité" au sens JS. On refuse aussi
  // un prix négatif (aucun sens pour un prix d'achat), en gardant l'ancien prix dans ce cas.
  const priceParsed = priceEl ? parseNum(priceEl.value) : NaN;
  const price = (Number.isFinite(priceParsed) && priceParsed >= 0) ? priceParsed : p.price;
  const tvaEl = document.getElementById('ep-tva');
  const tvaRate = tvaEl ? parseFloat(tvaEl.value) : p.tvaRate;
  const supplier = document.getElementById('ep-supplier').value;
  const department = document.getElementById('ep-department').value;
  const zoneIds = Array.from(document.querySelectorAll('.ep-zone-chk:checked')).map(el=>el.value);
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplierObj = SUPPLIERS.find(s=>s.id===supplier);
  const zoneRemoteIds = zoneIds.map(zid=>{ const z = ZONES.find(zz=>zz.id===zid); return z?z.remoteId:null; }).filter(Boolean);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/products/${p.remoteId}`, {
      method:'PATCH',
      body:{ name, category:cat, unit, price, department, supplierId: supplierObj?supplierObj.remoteId:null, packaging, supplierReference, zoneIds: zoneRemoteIds, tvaRate },
    });
    p.name = data.product.name; p.cat = data.product.category; p.unit = data.product.unit;
    p.price = parseFloat(data.product.price); p.qtyCommande = parseFloat(data.product.qty_commande);
    p.supplier = supplier; p.department = data.product.department;
    p.packaging = packaging; p.supplierReference = supplierReference; p.zoneIds = zoneIds;
    p.tvaRate = parseFloat(data.product.tva_rate);
    closeModal();
    toast('Produit mis à jour');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

function orderStatusLabel(s){
  if(s==='en_attente_validation') return 'En attente de validation';
  if(s==='validee') return 'Validée — en attente de réception';
  if(s==='partiellement_recue') return 'Partiellement reçue — reste en attente';
  if(s==='livree') return 'Livrée';
  if(s==='refusee') return 'Refusée';
  return s;
}
function orderDocLines(o){
  if(o.lineItems && o.lineItems.length){
    return o.lineItems.map(li=>{
      if(!li.productId){
        // ligne d'achat personnalisé (hors catalogue) : nom/prix saisis directement
        const price = li.price || 0;
        return {name: li.name || o.items, qty: li.qty, unit:'', price, total: Math.round(li.qty*price*100)/100, tvaRate: li.tvaRate??5.5};
      }
      const p = PRODUCTS.find(x=>x.id===li.productId);
      const name = p ? p.name : o.items;
      const unit = p ? p.unit : '';
      const price = p ? p.price : (li.qty ? o.amount/li.qty : o.amount);
      // li.tvaRate existe sur toute commande créée depuis l'ajout du suivi TVA ; pour une
      // commande plus ancienne, on retombe sur le taux actuel du produit, et à défaut 5,5 %
      // (le taux le plus courant pour des matières premières alimentaires).
      const tvaRate = li.tvaRate != null ? li.tvaRate : (p ? (p.tvaRate??5.5) : 5.5);
      return {name, qty:li.qty, unit, price, total:Math.round(li.qty*price*100)/100, tvaRate};
    });
  }
  return [{name:o.items||'Article', qty:1, unit:'', price:o.amount, total:o.amount, tvaRate:5.5}];
}
function buildOrderDocumentHTML(o){
  const resto = RESTOS.find(r=>r.id===state.resto) || {name:'—', city:''};
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier) || {name:'—', cat:''};
  const isDelivered = o.status==='livree' || o.status==='partiellement_recue';
  // Important : ce document est émis par le RESTAURANT (l'acheteur), pas par le fournisseur —
  // seul le fournisseur (le vendeur) a le droit d'émettre une véritable "facture" au sens
  // légal du terme. On l'appelle donc toujours "Bon de commande", y compris une fois la
  // marchandise reçue, avec un avertissement explicite en bas de page.
  const docType = isDelivered ? 'Bon de commande — réceptionné' : 'Bon de commande';
  const lines = orderDocLines(o);
  const totalHT = lines.reduce((a,l)=>a+l.total,0);
  const breakdown = tvaBreakdown(lines.map(l=>({totalHT:l.total, tvaRate:l.tvaRate})));
  const totalTVA = breakdown.reduce((a,b)=>a+b.tvaAmount,0);
  const totalTTC = totalHT + totalTVA;
  const when = o.createdAt ? fmtDateLong(new Date(o.createdAt)) + ' à ' + fmtTime(new Date(o.createdAt)) : o.date;
  return `
    <div class="invoice-doc">
      <div class="invoice-head">
        <div>
          <div class="invoice-resto-name">${escapeHtml(resto.name)}</div>
          <div class="invoice-resto-meta">${fullAddress(resto) || resto.city}</div>
          ${resto.siret ? `<div class="invoice-resto-meta">SIRET : ${escapeHtml(resto.siret)}</div>` : ''}
        </div>

function ordersForPeriod(period){
  const now = new Date();
  return ORDERS.filter(o=>{
    if(!o.createdAt) return true;
    const d = new Date(o.createdAt);
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}

function csvEscape(value){
  const str = String(value==null ? '' : value);
  // Un champ contenant une virgule, un guillemet ou un retour à la ligne doit être entouré de
  // guillemets, et les guillemets internes doublés — sinon le fichier s'ouvre mal dans Excel.
  if(/[",\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}
// ============================================================

// preuve à présenter en cas de contrôle sanitaire : tous les relevés de température et tout le
// nettoyage enregistré sur la période, avec les non-conformités mises en évidence plutôt que
// noyées dans la liste — c'est précisément ce qu'un contrôleur cherche en premier.
// ============================================================
function haccpLogsForPeriod(period, logs){
  const now = new Date();
  return logs.filter(l=>{
    if(!l.createdAt) return false;
    const d = new Date(l.createdAt);
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}

      </div>

      ${anomalies.length ? `
      <div class="invoice-legal-note" style="background:#F3E2DE;border-color:#e0b8ae;color:#7a2e24;">
        <strong>${anomalies.length} relevé${anomalies.length>1?'s':''} hors seuils sur la période</strong> — voir le détail ci-dessous, lignes signalées.

      <h3 style="font-family:var(--heading-font);font-size:15px;margin:18px 0 8px 0;">Relevés de température</h3>
      ${tempLogs.length ? `<table class="invoice-table history">
        <thead><tr><th>Date</th><th>Équipement</th><th>Relevé</th><th>Seuils</th><th>Statut</th><th>Par</th></tr></thead>
        <tbody>
          ${tempLogs.map(l=>`<tr style="${!l.inRange?'background:#F3E2DE;':''}">
            <td>${fmtDateLong(l.createdAt)} ${fmtTime(l.createdAt)}</td>

function downloadOrdersCSV(period){
  const orders = ordersForPeriod(period).filter(o=>o.status!=='refusee');
  const rows = [
    ['Référence','Fournisseur','Date','Statut','Écart détecté','Montant HT (€)','TVA (€)','Montant TTC (€)','Produits commandés'],
    ...orders.map(o=>{
      const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
      const products = (o.lineItems||[]).map(li=>`${li.name} x${li.qty}`).join('; ') || o.items || '';
      const lines = orderDocLines(o);
      const totalHT = lines.reduce((a,l)=>a+l.total,0);
      const totalTVA = tvaBreakdown(lines.map(l=>({totalHT:l.total, tvaRate:l.tvaRate}))).reduce((a,b)=>a+b.tvaAmount,0);
      return [
        o.id,
        supplier ? supplier.name : '—',
        o.createdAt ? new Date(o.createdAt).toLocaleDateString('fr-FR') : '',
        orderStatusLabel(o.status),
        o.hasDiscrepancy ? 'Oui' : 'Non',
        totalHT.toFixed(2),
        totalTVA.toFixed(2),
        (totalHT+totalTVA).toFixed(2),
        products,
      ];
    }),
  ];
  // Le point-virgule est utilisé comme séparateur : c'est ce qu'Excel en français attend par
  // défaut pour ouvrir correctement les colonnes sans manipulation supplémentaire.
  const csvContent = rows.map(row => row.map(csvEscape).join(';')).join('\r\n');
  const bom = '\uFEFF'; // pour que les accents s'affichent bien dans Excel
  const blob = new Blob([bom + csvContent], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'commandes-'+period+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Export CSV téléchargé');
}

/* ============================================================

============================================================ */
function renderContent(){
  const {role, view} = state;
  if(view==='notifications') return viewNotifications(role);
  if(view==='aide') return viewAide();
  if(view==='carte-fournisseurs') return soloModeEnabled() ? viewPatronDashboard() : viewSupplierMap();
  if(view==='haccp'){
    const restoForHaccp = RESTOS.find(r=>r.id===state.resto);
    if(!restoForHaccp || !restoForHaccp.haccpEnabled){
      if(role==='manager') return viewManagerDashboard();
      if(role==='cuisine') return viewCuisineAccueil();
      return viewPatronDashboard();
    }
    return viewHaccp(role);
  }
  if(role==='patron'){
    if(view==='dashboard') return viewPatronDashboard();
    if(view==='demandes') return soloModeEnabled() ? viewPatronDashboard() : viewPatronDemandes();
    if(view==='stocks') return viewStocks();
    if(view==='commandes') return viewCommandes('patron');
    if(view==='ecarts') return viewEcarts();
    if(view==='stats') return financialsHidden() ? viewPatronDashboard() : viewStats();
    if(view==='fournisseurs') return viewFournisseurs();
    if(view==='equipe') return soloModeEnabled() ? viewPatronDashboard() : viewEquipe();
    if(view==='multi') return soloModeEnabled() ? viewPatronDashboard() : viewMulti();
    if(view==='parametres') return viewParametres();
  }
  if(role==='manager'){
    if(view==='dashboard') return viewManagerDashboard();
    if(view==='demandes') return viewManagerDemandes();
    if(view==='commandes') return viewCommandes('manager');
    if(view==='stocks') return viewStocks();
    if(view==='livraisons') return viewLivraisons();
  }
  if(role==='cuisine'){
    if(view==='accueil') return viewCuisineAccueil();
    if(view==='signaler'){ openSignalModal('Cuisine', false); return viewCuisineAccueil(); }
    if(view==='stocks') return viewCuisineStocks();
    if(view==='livraisons') return viewLivraisons();
    if(view==='demandes') return viewDemandesList('cuisine');
  }
  if(role==='salle'){
    if(view==='accueil') return viewSalleAccueil();
    if(view==='signaler'){ openSignalModal('Salle', false); return viewSalleAccueil(); }
    if(view==='stocks') return viewSalleStocks();
    if(view==='demandes') return viewDemandesList('salle');
  }
  return '';
}

/* ============================================================
   BON DE COMMANDE — génération PDF (jsPDF) et envoi par email au fournisseur
============================================================ */
function buildOrderPdf(o){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
  const marginX = 15;
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text(resto ? resto.name : 'Restaurant', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  y += 7;
  if(resto && resto.address){ doc.text(resto.address, marginX, y); y += 5; }
  if(resto && (resto.postalCode || resto.city)){ doc.text(`${escapeHtml(resto.postalCode||'')} ${escapeHtml(resto.city||'')}`.trim(), marginX, y); y += 5; }
  if(resto && resto.siret){ doc.text(`SIRET : ${resto.siret}`, marginX, y); y += 5; }

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('BON DE COMMANDE', 195, 20, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Référence : ${o.id}`, 195, 27, { align:'right' });
  doc.text(`Date : ${o.date || fmtDateShort(o.createdAt||new Date())}`, 195, 32, { align:'right' });

  y += 10;
  doc.setDrawColor(220,220,215); doc.line(marginX, y, 195, y);
  y += 8;
  doc.setFont('helvetica','bold'); doc.text('Fournisseur', marginX, y);
  doc.setFont('helvetica','normal'); y += 6;
  doc.text(supplier ? supplier.name : 'Fournisseur', marginX, y); y += 5;
  if(supplier && supplier.address){ doc.text(supplier.address, marginX, y); y += 5; }
  if(supplier && supplier.email){ doc.text(supplier.email, marginX, y); y += 5; }

  y += 8;
  const hideFin = financialsHidden();
  const pdfLines = (o.lineItems||[]).map(li=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const name = p ? p.name : (li.name || 'Article');
    const unit = p ? p.unit : '';
    const price = li.priceReceived != null ? li.priceReceived : (li.price != null ? li.price : (p?p.price:0));
    const qty = li.qtyReceived != null ? li.qtyReceived : li.qty;
    const tvaRate = li.tvaRate != null ? li.tvaRate : (p ? (p.tvaRate??5.5) : 5.5);
    const totalHT = Math.round(Number(qty)*Number(price)*100)/100;
    return { name, unit, price:Number(price), qty:Number(qty), tvaRate, totalHT };
  });
  const rows = pdfLines.map(l => hideFin
    ? [l.name, `${l.qty} ${l.unit}`.trim()]
    : [l.name, `${l.qty} ${l.unit}`.trim(), `${l.price.toFixed(2)} €`, tvaRateLabel(l.tvaRate), `${l.totalHT.toFixed(2)} €`]
  );
  doc.autoTable ? doc.autoTable({
    startY: y, margin:{left:marginX,right:15},
    head: hideFin ? [['Article','Quantité']] : [['Article','Quantité','Prix unit. HT','TVA','Total HT']],
    body: rows,
    styles:{ font:'helvetica', fontSize:10, textColor:[30,30,30] },
    headStyles:{ fillColor:[20,20,20], textColor:255 },
    theme:'grid',
  }) : null;
  if(!hideFin){
    const totalHT = pdfLines.reduce((a,l)=>a+l.totalHT,0);
    const breakdown = tvaBreakdown(pdfLines.map(l=>({totalHT:l.totalHT, tvaRate:l.tvaRate})));
    const totalTVA = breakdown.reduce((a,b)=>a+b.tvaAmount,0);
    const totalTTC = totalHT + totalTVA;
    let finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 8 : y + 8 + rows.length*8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,30,30);
    doc.text(`Total HT : ${fmtEUR(totalHT)}`, 195, finalY, { align:'right' }); finalY += 6;
    breakdown.forEach(b=>{
      doc.setFontSize(9); doc.setTextColor(110,110,105);
      doc.text(`dont TVA à ${tvaRateLabel(b.rate)} sur ${fmtEUR(b.baseHT)} : ${fmtEUR(b.tvaAmount)}`, 195, finalY, { align:'right' });
      finalY += 5;
    });
    doc.setFontSize(10); doc.setTextColor(30,30,30);
    doc.text(`Total TVA : ${fmtEUR(totalTVA)}`, 195, finalY, { align:'right' }); finalY += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,20,20);
    doc.text(`Total TTC : ${fmtEUR(totalTTC)}`, 195, finalY, { align:'right' });
  }

  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,145);
  doc.text("Ce document est un bon de commande émis par l'acheteur — il ne constitue pas une facture et ne remplace pas celle émise par le fournisseur. Les montants de TVA sont calculés à partir des taux renseignés dans le catalogue, à titre indicatif.", marginX, pageHeight-14, { maxWidth:180 });

  return doc;
}

// Reconstruit en direct le lien de secours (un vrai <a href="mailto:...">, la façon la plus
// fiable de déclencher un client mail) à chaque modification d'un des champs — pour qu'il soit
// toujours prêt et à jour si le déclenchement automatique ne fonctionne pas sur cet appareil
// (aucune application mail définie par défaut, par exemple — un cas que le site ne peut pas
// détecter ni forcer, ça dépend entièrement des réglages de l'appareil de la personne).
function onPdfSendFieldsChange(id){
  const link = document.getElementById('pdf-send-fallback-link');
  if(!link) return;
  link.href = buildOrderMailtoUrl();
}
function buildOrderMailtoUrl(){
  const selectEl = document.getElementById('pdf-send-to');
  const customEl = document.getElementById('pdf-send-to-custom');
  const to = (selectEl.value === '__custom__' ? (customEl.value||'').trim() : selectEl.value);
  const subject = document.getElementById('pdf-send-subject').value.trim();
  const body = document.getElementById('pdf-send-body').value;
  return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function downloadOrderPdf(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const doc = buildOrderPdf(o);
  doc.save(`bon-de-commande-${o.id}.pdf`);
  closeModal();
}
function downloadAndComposeOrderEmail(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const selectEl = document.getElementById('pdf-send-to');
  const customEl = document.getElementById('pdf-send-to-custom');
  const to = (selectEl.value === '__custom__' ? customEl.value.trim() : selectEl.value);
  if(!to){ toast('Merci de renseigner une adresse email', 'alert'); return; }
  const mailtoUrl = buildOrderMailtoUrl();
  // Ordre important, trouvé après un premier essai qui ne s'ouvrait pas correctement : on
  // déclenche le mail EN PREMIER, via un clic simulé sur un vrai lien <a href="mailto:...">
  // (plus fiable qu'une simple redirection par script) — car une fois le téléchargement du PDF
  // lancé, certains navigateurs ne considèrent plus l'action suivante comme venant vraiment
  // d'un geste de la personne, et bloquent alors l'ouverture du mail.
  const tempLink = document.createElement('a');
  tempLink.href = mailtoUrl;
  tempLink.style.display = 'none';
  document.body.appendChild(tempLink);
  tempLink.click();
  document.body.removeChild(tempLink);
  // Le PDF se télécharge juste après — un lien mailto: ne peut techniquement joindre aucun
  // fichier (aucun navigateur ne le permet, c'est une limite de sécurité du web, pas de Mise &
  // Sûre), donc la personne doit le glisser elle-même dans l'email qui vient de s'ouvrir.
  const doc = buildOrderPdf(o);
  doc.save(`bon-de-commande-${o.id}.pdf`);
  toast('PDF téléchargé — joignez-le dans l\'email qui vient de s\'ouvrir avant d\'envoyer');
  closeModal();
}

  const steps = wrap.querySelectorAll('.journey-step');

function initProductCarousel(){
  const wrap = document.getElementById('product-carousel');
  if(!wrap || wrap.dataset.bound) return;
  wrap.dataset.bound = '1';
  const slides = wrap.querySelectorAll('.carousel-slide');
  const captions = wrap.querySelectorAll('.carousel-caption-item');
  const dots = wrap.querySelectorAll('.carousel-dot');
  let idx = 0, timer = null;

  function show(i){
    idx = (i + slides.length) % slides.length;
    slides.forEach((el,k)=>el.classList.toggle('active', k===idx));
    captions.forEach((el,k)=>el.classList.toggle('active', k===idx));
    dots.forEach((el,k)=>el.classList.toggle('active', k===idx));
  }
  function next(){ show(idx+1); }
  function startAutoplay(){
    if(timer) return;
    timer = setInterval(next, 4200);
  }
  function stopAutoplay(){ clearInterval(timer); timer = null; }

  dots.forEach(dot=>{
    dot.addEventListener('click', ()=>{ show(parseInt(dot.dataset.idx,10)); stopAutoplay(); startAutoplay(); });
  });

  // Ne se lance qu'une fois la section réellement visible à l'écran — pas la peine de faire
  // tourner un minuteur pour une section que personne n'a encore fait défiler jusqu'ici.
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ if(entry.isIntersecting) startAutoplay(); else stopAutoplay(); });
  }, { threshold:0.3 });
  observer.observe(wrap);
}

let THREE_JS_LOADING = false;
function loadThreeJS(callback){
  if(window.THREE){ callback(); return; }
  if(THREE_JS_LOADING){
    document.addEventListener('three-js-ready', callback, { once:true });
    return;
  }
  THREE_JS_LOADING = true;
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  script.onload = () => { THREE_JS_LOADING = false; document.dispatchEvent(new Event('three-js-ready')); callback(); };
  script.onerror = () => { THREE_JS_LOADING = false; console.error("Impossible de charger la bibliothèque 3D — le reste du site continue de fonctionner normalement."); };
  document.head.appendChild(script);
}

// --- Logo 3D : un médaillon (cylindre plat) texturé avec le logo sur ses deux faces, qui
// tourne doucement tout seul et qu'on peut aussi faire pivoter à la souris ou au doigt.
function initHeroLogo3D(canvas){
  const wrap = canvas.parentElement;
  const size = () => Math.min(wrap.clientWidth || 220, wrap.clientHeight || 220);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0, 6.2);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(size(), size());

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(2.5, 3, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.35);
  rim.position.set(-3, -1, -2);
  scene.add(rim);

  const texture = new THREE.TextureLoader().load('icon-512.png');
  texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;
  const faceMat = new THREE.MeshStandardMaterial({ map: texture, roughness:0.45, metalness:0.08 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness:0.55, metalness:0.15 });
  const geometry = new THREE.CylinderGeometry(1.55, 1.55, 0.22, 72);
  const coin = new THREE.Mesh(geometry, [edgeMat, faceMat, faceMat]);
  coin.rotation.x = Math.PI / 2; // les faces plates du cylindre pointent vers la caméra (Z), pas vers le haut (Y)
  scene.add(coin);

  let autoSpeed = 0.45; // radians/seconde, vitesse de rotation automatique au repos
  let velocity = autoSpeed;
  let dragging = false;
  let lastX = 0;
  let lastT = performance.now();

  function pointerDown(e){
    dragging = true;
    lastX = (e.touches ? e.touches[0].clientX : e.clientX);
  }
  function pointerMove(e){
    if(!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - lastX;
    lastX = x;
    coin.rotation.y += dx * 0.012;
    velocity = dx * 0.6; // l'élan de la dernière impulsion continue un peu après le relâchement
  }
  function pointerUp(){ dragging = false; }
  wrap.addEventListener('mousedown', pointerDown);
  wrap.addEventListener('touchstart', pointerDown, { passive:true });
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('touchmove', pointerMove, { passive:true });
  window.addEventListener('mouseup', pointerUp);
  window.addEventListener('touchend', pointerUp);

  function animate(){
    MARKETING_3D.logoRAF = requestAnimationFrame(animate);
    if(!document.body.contains(canvas)) return; // page quittée : on arrête proprement
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if(!dragging){
      // Ralentit progressivement vers la vitesse de croisière après une impulsion manuelle,
      // plutôt que de reprendre brutalement la rotation automatique.
      velocity += (autoSpeed - velocity) * Math.min(dt * 1.5, 1);
      coin.rotation.y += velocity * dt;
    }
    renderer.render(scene, camera);
  }
  animate();

  const onResize = () => { const s = size(); renderer.setSize(s, s); };
  window.addEventListener('resize', onResize);
}

async function completeSetupRestaurant(){
  const fieldIds = ['setup-name','setup-address','setup-postal','setup-city','setup-currency'];
  clearFormErrors('setup-error-slot', fieldIds);
  const name = ((document.getElementById('setup-name')||{}).value || '').trim();
  if(!name){ showFormError('setup-error-slot', "Le nom de l'établissement est requis.", ['setup-name']); return; }
  const address = ((document.getElementById('setup-address')||{}).value || '').trim();
  const postalCode = ((document.getElementById('setup-postal')||{}).value || '').trim();
  const city = ((document.getElementById('setup-city')||{}).value || '').trim() || '—';
  const currency = (document.getElementById('setup-currency')||{}).value || 'EUR';

  try{
    const data = await apiRequest('/api/restaurants', { method:'POST', body:{ name, address, postalCode, city, currency } });

    // Le catalogue, l'équipe, les commandes... continuent de fonctionner en mémoire pour
    // l'instant (seule la couche compte/établissement est déjà connectée au vrai serveur) —
    // on garde donc aussi une copie locale, reliée à l'établissement réel par remoteId.
    const newId = 'r'+nextId();
    RESTOS.push({id:newId, name, address, postalCode, city, currency, remoteId: data.restaurant.id});
    ensureRestoData(newId);
    state.resto = newId;
    loadRestoData(newId);

    if(ACCOUNT && !CREDENTIALS.patron.username){
      const derived = ACCOUNT.email.split('@')[0].toLowerCase().replace(/[^a-z0-9.]/g,'') || 'patron';
      const generatedPassword = generateDefaultPassword(derived);
      CREDENTIALS.patron.username = derived;
      CREDENTIALS.patron.password = generatedPassword;
      if(!NOTIF_STATE.patron.email) NOTIF_STATE.patron.email = ACCOUNT.email;
      toast('Établissement créé — identifiant équipe : ' + escapeHtml(CREDENTIALS.patron.username));
      try{
        await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username: derived, newPassword: generatedPassword } });
      } catch(e){ /* pas bloquant : les identifiants restent au moins utilisables pour cette session */ }
    } else {
      toast('Établissement créé — bienvenue !');
    }
    goToSite('team-login');
  } catch(err){
    showFormError('setup-error-slot', err.message, fieldIds);
  }
}

async function confirmRecoverPatronCredentials(){
  const username = document.getElementById('recover-username').value.trim();
  if(!username){ toast("Le nom d'utilisateur est requis",'alert'); return; }
  const p1 = document.getElementById('recover-pass1').value;
  const p2 = document.getElementById('recover-pass2').value;
  if(p1 || p2){
    if(p1.length<4){ toast('4 caractères minimum','alert'); return; }
    if(p1!==p2){ toast('Les mots de passe ne correspondent pas','alert'); return; }
  }
  try{
    await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username, ...(p1?{newPassword:p1}:{}) } });

    if(p1) CREDENTIALS.patron.password = p1;

    render();

const COOKIE_CONSENT_KEY = 'mise_et_sure_cookie_consent';
function renderCookieBanner(){
  const zone = document.getElementById('cookie-banner-zone');
  if(!zone) return;
  if(localStorage.getItem(COOKIE_CONSENT_KEY)){ zone.innerHTML = ''; return; }
  zone.innerHTML = `
    <div class="cookie-banner">
      <div class="cookie-banner-text">
        Ce site utilise uniquement des cookies strictement nécessaires à son fonctionnement (garder votre connexion active). Aucun cookie publicitaire ou de suivi. <a onclick="goToSite('confidentialite')">En savoir plus</a>.
      </div>
      <button class="btn btn-primary btn-sm" onclick="dismissCookieBanner()">J'ai compris</button>
    </div>
  `;
}
function dismissCookieBanner(){
  localStorage.setItem(COOKIE_CONSENT_KEY, '1');
  const zone = document.getElementById('cookie-banner-zone');
  if(zone) zone.innerHTML = '';
}
function render(){
  try{
    renderInner();
  } catch(err){
    // Filet de sécurité : si un affichage plante pour une raison imprévue, on montre un message
    // clair avec un bouton pour recharger, plutôt qu'une page blanche silencieuse qui donne
    // l'impression que le site est cassé ou figé sans aucune explication.
    console.error('Erreur d\'affichage :', err);
    const appEl = document.getElementById('app');
    if(appEl){
      appEl.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
          <div style="max-width:420px;text-align:center;">
            <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
            <h2 style="margin-bottom:10px;">Un problème d'affichage est survenu</h2>
            <p style="color:#8A8A84;margin-bottom:20px;">Vos données n'ont pas été perdues. Rechargez la page pour continuer.</p>
            <button onclick="window.location.reload()" style="background:#141414;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:600;cursor:pointer;">Recharger la page</button>
          </div>
        </div>
      `;
    }
  }
}
function renderInner(){
  renderCookieBanner();
  document.documentElement.classList.toggle('theme-dark', state.theme==='dark');
  if(state.site==='marketing'){
    document.title = 'Mise & Sûre — la gestion de restaurant, sans friction';

    requestAnimationFrame(initMarketing3D);

  }
  if(state.site==='cgu'){
    document.title = 'Conditions générales — Mise & Sûre';
    document.getElementById('app').innerHTML = renderLegalPage('cgu');
    return;
  }
  if(state.site==='account-auth'){
    document.title = 'Connexion — Mise & Sûre';
    document.getElementById('app').innerHTML = renderAccountAuthPage();
    return;
  }
  if(state.site==='admin'){
    document.title = 'Administration — Mise & Sûre';
    document.getElementById('app').innerHTML = renderAdminPage();
    return;
  }
  if(state.site==='verify-email'){
    document.title = 'Vérification — Mise & Sûre';
    document.getElementById('app').innerHTML = renderVerifyEmailPage();
    return;
  }
  if(state.site==='reset-password'){
    document.title = 'Réinitialisation — Mise & Sûre';
    document.getElementById('app').innerHTML = renderResetPasswordPage();
    return;
  }
  if(state.site==='setup-restaurant'){
    document.title = 'Créer votre établissement — Mise & Sûre';
    document.getElementById('app').innerHTML = renderSetupRestaurantPage();
    return;
  }
  if(!state.loggedIn){
    if(state.pendingPasswordChange){
      document.title = 'Nouveau mot de passe requis — Mise & Sûre';
      document.getElementById('app').innerHTML = renderForcedPasswordChangeScreen();
      return;
    }
    document.title = 'Mise & Sûre — plateforme de gestion pour restaurants';
    document.getElementById('app').innerHTML = renderLoginScreen();
    return;
  }
  destroyCharts();
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(resto) document.title = resto.name + ' — Mise & Sûre';
  const {sidebarHtml, topbarHtml} = renderShell();
  document.getElementById('app').innerHTML = `
    ${sidebarHtml}
    <div class="main">
      ${topbarHtml}
      ${renderBanner()}
      <div class="content">${renderContent()}</div>
    </div>
  `;
  requestAnimationFrame(drawCharts);
  requestAnimationFrame(initSupplierMap);
  if(TOUR_STATE.active) renderTourStep(); else maybeAutoStartTour();
}

      city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
      accentColor: data.restaurant.accent_color, logoDataUrl: data.restaurant.logo_url,
      tagline: data.restaurant.tagline, coverPhotoDataUrl: data.restaurant.cover_photo_data_url,
      fontStyle: data.restaurant.font_style, colorTheme: data.restaurant.color_theme,
      defaultDarkMode: data.restaurant.default_dark_mode,
    });
    const d = ensureRestoData(localId);
    d.team = data.team.map(m => ({
      id: 't'+m.id, remoteId: m.id, name: m.name, role: m.role,
      shift:'', status:'actif', username:null, photoDataUrl: m.photo_url,
    }));
    state.resto = localId;
    loadRestoData(localId);
    state.site = 'team-login';
    window.history.replaceState({ site: 'team-login' }, '', window.location.pathname);
    render();
  } catch(err){
    toast(err.message, 'alert');
    goToSite('marketing');
  }
}
async function checkExistingSession(){
  // Fixe tout de suite (avant toute action async) l'état associé à cette toute première page de
  // l'historique — sinon, si la personne navigue (ex : clique sur "Tarifs") avant la fin de cette
  // fonction, cette première entrée resterait sans état défini, et le bouton "précédent" du
  // navigateur ne saurait pas y revenir correctement (il atterrirait sur l'accueil par défaut).
  // IMPORTANT : on garde le "?..." de l'adresse tel quel ici (window.location.search) — sinon,
  // ça efface le jeton Google/Apple ou Stripe avant même que le code un peu plus bas ait eu la
  // chance de le lire, cassant complètement la connexion.
  window.history.replaceState({ site: state.site }, '', window.location.pathname + window.location.search);
  // Si on revient d'une connexion Google/Apple (ou d'un paiement Stripe), les indications
  // arrivent dans l'URL — on les récupère et on nettoie l'adresse tout de suite après.
  const urlParams = new URLSearchParams(window.location.search);
  const tokenFromUrl = urlParams.get('token');
  const oauthError = urlParams.get('oauth') === 'error';
  const checkoutCancelled = urlParams.get('checkout') === 'cancelled';
  const checkoutSuccess = urlParams.get('checkout') === 'success';
  const equipeToken = urlParams.get('equipe');
  if(equipeToken){
    // Lien personnel d'un membre de l'équipe : ce chemin est totalement indépendant du compte
    // du patron (aucun email, aucun abonnement) — on saute directement à l'écran de connexion
    // de son établissement précis.
    window.history.replaceState({}, document.title, window.location.pathname);
    await loadTeamInvite(equipeToken);
    return;
  }
  if(tokenFromUrl){
    AUTH_TOKEN = tokenFromUrl;
    localStorage.setItem(AUTH_TOKEN_KEY, tokenFromUrl);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(oauthError){
    toast("La connexion via Google/Apple a échoué. Merci de réessayer.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutCancelled){
    toast("Paiement annulé — vous pouvez réessayer à tout moment.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutSuccess){
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  try{
    const meData = await apiRequest('/api/auth/me');
    ACCOUNT = meData.user;
    if(ACCOUNT.team_username) CREDENTIALS.patron.username = ACCOUNT.team_username;
    try{
      // C'est CETTE étape qui vérifie réellement l'abonnement, quelle que soit la façon dont
      // la personne s'est connectée (email, Google ou Apple) — le serveur bloque avec le code
      // SUBSCRIPTION_REQUIRED si le paiement n'est pas actif.
      //
      // Juste après un paiement Stripe réussi, le navigateur peut revenir sur le site un peu
      // AVANT que Stripe n'ait fini de prévenir notre serveur (le "webhook") que le paiement est
      // passé — sans ça, on risquerait de croire à tort que la personne n'a toujours pas payé.
      // On retente donc plusieurs fois, avec une petite pause, uniquement dans ce cas précis.
      let restosData;
      const maxAttempts = checkoutSuccess ? 6 : 1;
      for(let attempt=1; attempt<=maxAttempts; attempt++){
        try{
          restosData = await apiRequest('/api/restaurants');
          break;
        } catch(e){
          const isLastAttempt = attempt===maxAttempts;
          if(e.code!=='SUBSCRIPTION_REQUIRED' || isLastAttempt) throw e;
          await new Promise(r=>setTimeout(r, 1200));
        }
      }
      state.site = (restosData.restaurants && restosData.restaurants.length) ? 'team-login' : 'setup-restaurant';
      if(restosData.restaurants && restosData.restaurants.length){
        // Le compte a déjà un ou plusieurs établissements réels côté serveur (créés avant ce
        // rechargement de page — après un paiement, par exemple) : on les recharge vraiment
        // dans l'application, plutôt que de repartir d'une liste vide comme si tout avait
        // disparu. Le catalogue/équipe/commandes restent pour l'instant en mémoire locale (voir
        // note plus haut), reliés à l'établissement réel par remoteId.
        RESTOS = restosData.restaurants.map(r => ({
          id: 'r'+nextId(),
          name: r.name,
          address: r.address,
          postalCode: r.postal_code,
          city: r.city,
          currency: r.currency,
          remoteId: r.id,
        }));
        RESTOS.forEach(r => ensureRestoData(r.id));
        state.resto = RESTOS[0].id;
        loadRestoData(RESTOS[0].id);
        syncRestoOperationalData(RESTOS[0].id);
      }
    } catch(restoErr){
      if(restoErr.code === 'SUBSCRIPTION_REQUIRED'){
        // Compte connecté mais pas encore payé : on le laisse sur la page d'accueil, il ira
        // sur "Tarifs" et choisira de payer quand il le souhaite — jamais de redirection forcée.
        state.site = 'marketing';
        window.history.replaceState({ site: state.site }, '', window.location.pathname);
        render();
        return;
      }
      throw restoErr;
    }
  } catch(err){
    // Pas de session de compte (patron) active : si un employé était connecté avant ce
    // rechargement de page, on tente de retrouver SA session grâce au jeton conservé — sans
    // ça, tout rechargement de page renverrait systématiquement à l'écran de connexion, même
    // en pleine utilisation de l'application.
    if(TEAM_TOKEN){
      try{
        const data = await apiRequest('/api/restaurants/team-me');
        const localId = 'r'+nextId();
        RESTOS.push({
          id: localId, name: data.restaurant.name, address:'', postalCode:'',
          city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
          accentColor: data.restaurant.accent_color, logoDataUrl: data.restaurant.logo_url,
          tagline: data.restaurant.tagline, coverPhotoDataUrl: data.restaurant.cover_photo_data_url,
          fontStyle: data.restaurant.font_style, colorTheme: data.restaurant.color_theme,
          defaultDarkMode: data.restaurant.default_dark_mode,
        });
        const d = ensureRestoData(localId);
        const localEmployeeId = 't'+data.member.id;
        d.team = [{
          id: localEmployeeId, remoteId: data.member.id, name: data.member.name,
          role: data.member.role, photoDataUrl: data.member.photo_url,
        }];
        state.resto = localId;
        loadRestoData(localId);
        state.site = 'team-login';
        login(identityForTeamRole(data.member.role), localEmployeeId);
        const lastView = localStorage.getItem('mise_et_sure_last_view');
        if(lastView) state.view = lastView;
        await syncRestoOperationalData(localId);
      } catch(teamErr){
        // Jeton expiré ou invalide : reste sur 'marketing', la personne devra rouvrir son lien.
        TEAM_TOKEN = null;
        localStorage.removeItem(TEAM_TOKEN_KEY);
      }
    }
  }
  window.history.replaceState({ site: state.site }, '', window.location.pathname);
  render();
}
checkExistingSession();

// ============================================================
// CONNEXION INTERNET — un bandeau discret dès que la connexion tombe, plutôt que de laisser
// la personne découvrir le problème seulement quand une action échoue avec un message
// technique. Redisparaît tout seul dès que la connexion revient.
// ============================================================
function renderOfflineBanner(){
  const zone = document.getElementById('offline-banner-zone');
  if(!zone) return;
  zone.innerHTML = navigator.onLine ? '' : `
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:300;background:#141414;color:#fff;padding:11px 16px;text-align:center;font-size:13px;font-weight:600;box-shadow:0 -4px 16px rgba(0,0,0,0.2);">
      📡 Pas de connexion internet — vos dernières actions n'ont peut-être pas été enregistrées. Reconnectez-vous pour continuer.
    </div>
  `;
}
window.addEventListener('online', renderOfflineBanner);
window.addEventListener('offline', renderOfflineBanner);
renderOfflineBanner();
showIOSInstallBanner();
if('serviceWorker' in navigator){
  // Nécessaire pour que le navigateur propose vraiment d'installer le site comme une
  // application (surtout sur Android/Chrome) — échoue silencieusement si le fichier n'est pas
  // encore présent à côté d'index.html, sans jamais bloquer le reste du site.
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
// Sur Android/Chrome (et navigateurs basés sur Chromium), le téléphone propose de déclencher
// l'installation directement par code — on capture cette occasion dès qu'elle se présente, pour
// pouvoir l'utiliser plus tard avec un simple bouton "Installer maintenant", sans passer par un
// menu. Sur iPhone/Safari, cet événement n'existe pas : ce n'est pas une erreur, juste une
// limite volontaire d'Apple — on affichera alors les instructions manuelles à la place.
let DEFERRED_INSTALL_PROMPT = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  showInstallBanner();
});
function showInstallBanner(){
  if(!DEFERRED_INSTALL_PROMPT || localStorage.getItem('mise_et_sure_install_banner_dismissed') || document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:200;background:#141414;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13.5px;';
  banner.innerHTML = `
    <span>📱 Installez cette application sur votre téléphone, en un tap</span>
    <button id="install-banner-confirm" style="background:#fff;color:#141414;border:none;padding:7px 16px;border-radius:6px;font-weight:600;cursor:pointer;">Installer</button>
    <button id="install-banner-dismiss" style="background:none;border:none;color:#B8B8B0;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('install-banner-confirm').onclick = async () => {
    if(!DEFERRED_INSTALL_PROMPT) return;
    DEFERRED_INSTALL_PROMPT.prompt();
    await DEFERRED_INSTALL_PROMPT.userChoice;
    DEFERRED_INSTALL_PROMPT = null;
    banner.remove();
  };
  document.getElementById('install-banner-dismiss').onclick = () => {
    localStorage.setItem('mise_et_sure_install_banner_dismissed', '1');
    banner.remove();
  };
}
// Sur iPhone/iPad, Safari ne propose JAMAIS rien automatiquement, quel que soit le site — la
// seule façon d'installer est manuelle (bouton Partager, puis "Sur l'écran d'accueil"). Comme
// rien ne se déclenche tout seul, on affiche nous-mêmes ces instructions bien en évidence dès
// l'ouverture de la page, plutôt que de les cacher dans les paramètres où seul le patron les
// verrait — sinon la personne qui reçoit le lien atterrit juste sur le site, sans aucune piste.
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function isRunningStandalone(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function showIOSInstallBanner(){
  if(!isIOSDevice() || isRunningStandalone()) return; // pas concerné, ou déjà installée
  if(localStorage.getItem('mise_et_sure_ios_banner_dismissed') || document.getElementById('ios-install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'ios-install-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:200;background:#141414;color:#fff;padding:14px 16px;font-size:13.5px;';
  banner.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:12px;max-width:520px;margin:0 auto;">
      <div style="flex:1;">Pour installer cette application : appuyez sur <strong>⎋</strong> (Partager) en bas de Safari, puis choisissez « Sur l'écran d'accueil »</div>
      <button id="ios-banner-dismiss" style="background:none;border:none;color:#B8B8B0;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;flex-shrink:0;">×</button>
    </div>
  `;
  document.body.appendChild(banner);
  document.getElementById('ios-banner-dismiss').onclick = () => {
    localStorage.setItem('mise_et_sure_ios_banner_dismissed', '1');
    banner.remove();
  };
}
</script>
