    if(!container) return; // la fenêtre a pu être refermée entre-temps
    if(history.length === 0){
      container.innerHTML = `<div class="small muted">Aucun historique pour l'instant — il se remplit à chaque réception de commande.</div>`;
      return;
    }
    container.innerHTML = `
      <div class="price-history-list">
        ${history.map((h, idx) => {
          const price = parseFloat(h.price) || 0;
          const prevRaw = history[idx+1] ? parseFloat(history[idx+1].price) : null;
          const prev = (prevRaw !== null && !isNaN(prevRaw)) ? prevRaw : null;
          let trend = '';
          if(prev !== null){
            if(price > prev) trend = `<span style="color:var(--urgent);font-weight:600;">▲ +${(price-prev).toFixed(2)}€</span>`;
            else if(price < prev) trend = `<span style="color:#2F9E44;font-weight:600;">▼ ${(price-prev).toFixed(2)}€</span>`;
            else trend = `<span class="small muted">stable</span>`;
          }
          const date = new Date(h.recorded_at).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
          return `<div class="price-history-row"><span class="small muted">${date}</span><span class="mono">${fmtEUR(price)}</span>${trend}</div>`;
        }).join('')}
      </div>
    `;
  } catch(err){
    if(container) container.innerHTML = `<div class="small muted">Historique indisponible pour le moment.</div>`;
  }
}
async function saveProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const name = document.getElementById('ep-name').value.trim() || p.name;
  const catSelect = document.getElementById('ep-cat');
  const cat = await createCategoryIfNeeded(catSelect);
  if(cat===null) return;
  const unit = document.getElementById('ep-unit').value.trim() || p.unit;
  const packaging = document.getElementById('ep-packaging').value.trim();
  const supplierReference = document.getElementById('ep-reference').value.trim();
  const netContentQtyEl = document.getElementById('ep-net-content-qty');
  const netContentUnitEl = document.getElementById('ep-net-content-unit');
  const netContentQty = netContentQtyEl && netContentQtyEl.value !== '' ? parseFloat(netContentQtyEl.value) : null;
  const netContentUnit = netContentUnitEl && netContentUnitEl.value !== '' ? netContentUnitEl.value : null;
  if(netContentQty!=null && netContentQty<=0){ toast('Le contenu net doit être supérieur à zéro', 'alert'); return; }
  const priceEl = document.getElementById('ep-price');
  // Avant : `parseNum(...) || p.price` — un piège classique de JavaScript, où 0 est
  // "faux" au même titre qu'une valeur vide : impossible de remettre un produit à 0,00 €,
  // le prix précédent revenait silencieusement à la place. On teste maintenant explicitement
  // si le nombre est valide, plutôt que de se fier à sa "vérité" au sens JS. On refuse aussi
  // un prix négatif (aucun sens pour un prix d'achat), en gardant l'ancien prix dans ce cas.
  const priceParsed = priceEl ? parseNum(priceEl.value) : NaN;
  const price = (Number.isFinite(priceParsed) && priceParsed >= 0) ? priceParsed : p.price;
  const tvaEl = document.getElementById('ep-tva');
  const tvaRate = tvaEl ? parseFloat(tvaEl.value) : p.tvaRate;
  const supplier = document.getElementById('ep-supplier').value;
  const department = document.getElementById('ep-department').value;
  const zoneIds = Array.from(document.querySelectorAll('.ep-zone-chk:checked')).map(el=>el.value);
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplierObj = SUPPLIERS.find(s=>s.id===supplier);
  const zoneRemoteIds = zoneIds.map(zid=>{ const z = ZONES.find(zz=>zz.id===zid); return z?z.remoteId:null; }).filter(Boolean);
  try{
    const data = await apiRequest(`/api/restaurants/${resto.remoteId}/products/${p.remoteId}`, {
      method:'PATCH',
      body:{ name, category:cat, unit, price, department, supplierId: supplierObj?supplierObj.remoteId:null, packaging, supplierReference, zoneIds: zoneRemoteIds, tvaRate, netContentQty, netContentUnit },
    });
    p.name = data.product.name; p.cat = data.product.category; p.unit = data.product.unit;
    p.price = parseFloat(data.product.price); p.qtyCommande = parseFloat(data.product.qty_commande);
    p.supplier = supplier; p.department = data.product.department;
    p.packaging = packaging; p.supplierReference = supplierReference; p.zoneIds = zoneIds;
    p.tvaRate = parseFloat(data.product.tva_rate);
    p.netContentQty = netContentQty; p.netContentUnit = netContentUnit;
    closeModal();
    toast('Produit mis à jour');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}
function deleteProduct(id){

async function confirmDeleteProduct(id){
  const idx = PRODUCTS.findIndex(p=>p.id===id);
  if(idx===-1) return;
  const p = PRODUCTS[idx];
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/products/${p.remoteId}`, { method:'DELETE' });
    PRODUCTS.splice(idx,1);
    Object.keys(BASKETS).forEach(sid=>{
      BASKETS[sid] = BASKETS[sid].filter(li=>li.productId!==id);
      if(BASKETS[sid].length===0) delete BASKETS[sid];
    });
    // Le serveur détache déjà proprement les ingrédients de recette qui pointaient vers ce
    // produit (ON DELETE SET NULL) — sans ce nettoyage local, le coût de la recette continuerait
    // d'afficher l'ancien prix jusqu'à la prochaine resynchronisation, comme si le produit
    // existait toujours. On reproduit le même détachement ici, tout de suite.
    RECIPE_INGREDIENTS.forEach(ing => { if(ing.productId===id) ing.productId = null; });
    closeModal();
    toast('Produit supprimé');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

// Retrouve le dernier achat réel d'un produit dans l'historique des commandes — sert à
// rappeler au moment de commander « la dernière fois, vous en aviez pris 10 Kg, il y a 6
// jours ». Un restaurateur commande souvent au jugé : ce simple repère évite de recommander
// trop tôt, ou de sous-commander un produit qui part plus vite que prévu. Les commandes
// refusées sont ignorées (elles n'ont jamais été livrées).
function lastPurchaseInfo(productId){
  const withProduct = ORDERS
    .filter(o => o.status !== 'refusee' && o.createdAt && Array.isArray(o.lineItems))
    .map(o => ({ order:o, line:o.lineItems.find(li => li.productId === productId) }))
    .filter(x => x.line)
    .sort((a,b) => new Date(b.order.createdAt) - new Date(a.order.createdAt));
  if(!withProduct.length) return null;
  const { order, line } = withProduct[0];
  const days = Math.floor((Date.now() - new Date(order.createdAt).getTime()) / 86400000);
  return {
    qty: line.qtyReceived != null ? line.qtyReceived : line.qty,
    date: new Date(order.createdAt),
    days,
    // Sur combien de commandes ce produit revient-il ? Utile pour distinguer un produit de
    // routine d'un achat exceptionnel.
    timesOrdered: withProduct.length,
  };
}
function lastPurchaseLabel(productId, unit){
  const info = lastPurchaseInfo(productId);
  if(!info) return '<span class="small muted">Jamais commandé</span>';
  const when = info.days === 0 ? "aujourd'hui"
    : info.days === 1 ? 'hier'
    : info.days < 30 ? `il y a ${info.days} jours`
    : `le ${fmtDateShort(info.date)}`;
  return `<span class="small muted">Dernière fois : <b style="color:var(--text);">${Number(info.qty).toLocaleString('fr-FR')} ${escapeHtml(unit||'')}</b> ${when}</span>`;
}

  return list.map(p=>`
    <div class="ord-row" data-pid="${p.id}" data-search="${escapeHtml((p.name+' '+(p.cat||'')+' '+(p.supplierReference||'')+' '+(p.zoneIds||[]).map(zid=>{const z=ZONES.find(zz=>zz.id===zid);return z?z.name:'';}).join(' ')).toLowerCase())}" style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);max-width:100%;">
      <input type="checkbox" id="ord-chk-${p.id}" style="flex-shrink:0;">

function orderStatusLabel(s){
  if(s==='en_attente_validation') return 'En attente de validation';
  if(s==='validee') return 'Validée — en attente de réception';
  if(s==='partiellement_recue') return 'Partiellement reçue — reste en attente';
  if(s==='livree') return 'Livrée';
  if(s==='refusee') return 'Refusée';
  return s;
}
function orderDocLines(o){
  if(o.lineItems && o.lineItems.length){
    return o.lineItems.map(li=>{
      if(!li.productId){
        // ligne d'achat personnalisé (hors catalogue) : nom/prix saisis directement
        const price = li.price || 0;
        return {name: li.name || o.items, qty: li.qty, unit:'', price, total: Math.round(li.qty*price*100)/100, tvaRate: li.tvaRate??5.5};
      }
      const p = PRODUCTS.find(x=>x.id===li.productId);
      const name = p ? p.name : o.items;
      const unit = p ? p.unit : '';
      const price = p ? p.price : (li.qty ? o.amount/li.qty : o.amount);
      // li.tvaRate existe sur toute commande créée depuis l'ajout du suivi TVA ; pour une
      // commande plus ancienne, on retombe sur le taux actuel du produit, et à défaut 5,5 %
      // (le taux le plus courant pour des matières premières alimentaires).
      const tvaRate = li.tvaRate != null ? li.tvaRate : (p ? (p.tvaRate??5.5) : 5.5);
      return {name, qty:li.qty, unit, price, total:Math.round(li.qty*price*100)/100, tvaRate};
    });
  }
  return [{name:o.items||'Article', qty:1, unit:'', price:o.amount, total:o.amount, tvaRate:5.5}];
}

        </div>

function downloadHtmlFile(filename, innerHtml){
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${filename}</title><style>${INVOICE_STANDALONE_CSS}</style></head><body>${innerHtml}</body></html>`;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Document téléchargé');
}

function ordersForPeriod(period){
  const now = new Date();
  return ORDERS.filter(o=>{
    if(!o.createdAt) return true;
    const d = new Date(o.createdAt);
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}

// ============================================================
// COMPTE-RENDU HACCP — un document téléchargeable (mois ou année en cours), pensé comme une
// preuve à présenter en cas de contrôle sanitaire : tous les relevés de température et tout le
// nettoyage enregistré sur la période, avec les non-conformités mises en évidence plutôt que
// noyées dans la liste — c'est précisément ce qu'un contrôleur cherche en premier.
// ============================================================
function haccpLogsForPeriod(period, logs){
  const now = new Date();
  return logs.filter(l=>{
    if(!l.createdAt) return false;
    const d = new Date(l.createdAt);
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
}
function buildHaccpReportHTML(period){
  const resto = RESTOS.find(r=>r.id===state.resto) || {name:'—', city:''};
  const now = new Date();
  const periodLabel = period==='year' ? 'Année '+now.getFullYear() : fmtMonthYear(now);
  const tempLogs = [...haccpLogsForPeriod(period, HACCP_TEMP_LOGS)].sort((a,b)=>a.createdAt-b.createdAt);
  const cleaningLogs = [...haccpLogsForPeriod(period, HACCP_CLEANING_LOGS)].sort((a,b)=>a.createdAt-b.createdAt);
  const anomalies = tempLogs.filter(l=>!l.inRange);
  // Jours avec au moins un relevé de température, sur les jours écoulés de la période — un
  // indicateur honnête plutôt qu'un simple total de relevés (qui ne dit rien de la régularité).
  const periodStart = period==='year' ? new Date(now.getFullYear(),0,1) : new Date(now.getFullYear(),now.getMonth(),1);
  const daysElapsed = Math.floor((now - periodStart)/(1000*60*60*24)) + 1;
  const daysWithTempLog = new Set(tempLogs.map(l=>{ const d=new Date(l.createdAt); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; })).size;
  const coveragePct = daysElapsed>0 ? Math.round((daysWithTempLog/daysElapsed)*100) : 0;
  return `
    <div class="invoice-doc">
      <div class="invoice-head">
        <div>
          <div class="invoice-resto-name">${escapeHtml(resto.name)}</div>
          <div class="invoice-resto-meta">${fullAddress(resto) || resto.city}</div>
          ${resto.siret ? `<div class="invoice-resto-meta">SIRET : ${escapeHtml(resto.siret)}</div>` : ''}
        </div>
        <div class="invoice-doctype">
          <div class="invoice-doctype-label">Compte-rendu HACCP</div>
          <div class="invoice-ref">${periodLabel}</div>
        </div>
      </div>

      <div class="invoice-meta-row">
        <div><div class="invoice-meta-label">Relevés de température</div><div class="invoice-meta-value">${tempLogs.length}</div></div>
        <div><div class="invoice-meta-label">Non conformes</div><div class="invoice-meta-value" style="${anomalies.length?'color:var(--urgent);':''}">${anomalies.length}</div></div>
        <div><div class="invoice-meta-label">Jours couverts</div><div class="invoice-meta-value">${daysWithTempLog}/${daysElapsed} (${coveragePct} %)</div></div>
        <div><div class="invoice-meta-label">Nettoyages enregistrés</div><div class="invoice-meta-value">${cleaningLogs.length}</div></div>
      </div>

      ${anomalies.length ? `
      <div class="invoice-legal-note" style="background:#F3E2DE;border-color:#e0b8ae;color:#7a2e24;">
        <strong>${anomalies.length} relevé${anomalies.length>1?'s':''} hors seuils sur la période</strong> — voir le détail ci-dessous, lignes signalées.
      </div>` : ''}

      <h3 style="font-family:var(--heading-font);font-size:15px;margin:18px 0 8px 0;">Relevés de température</h3>
      ${tempLogs.length ? `<table class="invoice-table history">
        <thead><tr><th>Date</th><th>Équipement</th><th>Relevé</th><th>Seuils</th><th>Statut</th><th>Par</th></tr></thead>
        <tbody>
          ${tempLogs.map(l=>`<tr style="${!l.inRange?'background:#F3E2DE;':''}">
            <td>${fmtDateLong(l.createdAt)} ${fmtTime(l.createdAt)}</td>
            <td>${escapeHtml(l.equipmentName)}</td>
            <td>${l.temperature}°C</td>
            <td>${l.minTemp}° à ${l.maxTemp}°</td>
            <td>${l.inRange ? 'Conforme' : 'Hors seuils'}</td>
            <td>${escapeHtml(l.loggedByName||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="small muted" style="margin-bottom:16px;">Aucun relevé sur cette période.</div>`}

      <h3 style="font-family:var(--heading-font);font-size:15px;margin:18px 0 8px 0;">Nettoyage</h3>
      ${cleaningLogs.length ? `<table class="invoice-table history">
        <thead><tr><th>Date</th><th>Tâche</th><th>Fréquence</th><th>Fait par</th></tr></thead>
        <tbody>
          ${cleaningLogs.map(l=>`<tr>
            <td>${fmtDateLong(l.createdAt)} ${fmtTime(l.createdAt)}</td>
            <td>${escapeHtml(l.taskName)}</td>
            <td>${l.frequency==='quotidien'?'Quotidien':l.frequency==='hebdomadaire'?'Hebdomadaire':'Mensuel'}</td>
            <td>${escapeHtml(l.doneByName||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="small muted" style="margin-bottom:16px;">Aucun nettoyage enregistré sur cette période.</div>`}

      <div class="invoice-legal-note">
        Document généré automatiquement à partir des relevés saisis dans Mise &amp; Sûre par
        ${escapeHtml(resto.name)} — à conserver comme preuve de suivi dans le cadre de votre
        Plan de Maîtrise Sanitaire (PMS).
      </div>
      <div class="invoice-foot">
        <div>${escapeHtml(resto.name)} — ${escapeHtml(resto.city)}</div>
        <div>Document généré automatiquement par Mise &amp; Sûre</div>
      </div>
    </div>
  `;
}

// ============================================================
// EXPORT COMPTABLE — 3 feuilles pensées pour un comptable, pas pour l'utilisateur du site :
//   1. Récapitulatif TVA — la première chose qu'un comptable cherche, pour la déclaration
//      périodique. Ventilé par taux, jamais un seul total global qui ne dit rien de la
//      répartition.
//   2. Détail des achats — une ligne par article (pas par commande), parce qu'une commande
//      mélangeant plusieurs taux de TVA ne peut pas tenir sur une seule ligne comptable.
//   3. Par fournisseur — pour rapprocher avec le grand livre auxiliaire fournisseurs.
//
// Limite technique assumée et documentée directement dans le fichier (feuille "Notes") : la
// version gratuite de la bibliothèque qui génère le .xlsx dans le navigateur écrit correctement
// les formats de nombres (€, %) mais pas la mise en forme visuelle (gras, couleurs) — vérifié
// en ouvrant le fichier réel, pas seulement en relisant ce que la bibliothèque rapporte
// elle-même. Un comptable a besoin de bons chiffres et d'une bonne structure, pas de couleurs.
// ============================================================
function buildAccountingExportWorkbook(period){
  const resto = RESTOS.find(r=>r.id===state.resto) || {name:'—', city:''};
  const orders = ordersForPeriod(period).filter(o=>o.status!=='refusee');
  const now = new Date();
  const periodLabel = period==='year' ? 'Année '+now.getFullYear() : fmtMonthYear(now);

  // --- Collecte au niveau LIGNE (pas commande) : une commande à plusieurs taux de TVA ne peut
  // pas être réduite à une seule ligne comptable. ---
  const allLines = [];
  orders.forEach(o=>{
    const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
    orderDocLines(o).forEach(l=>{
      allLines.push({
        date: o.createdAt ? new Date(o.createdAt) : null,
        ref: o.id,
        fournisseur: supplier ? supplier.name : '—',
        article: l.name, qty: l.qty, unit: l.unit||'',
        priceHT: l.price||0, tvaRate: l.tvaRate,
        totalHT: l.total, tvaAmount: calcTvaAmount(l.total, l.tvaRate),
        statut: orderStatusLabel(o.status),
      });
    });
  });

  const wb = XLSX.utils.book_new();

  // ---------- Feuille 1 : Récapitulatif TVA ----------
  const breakdown = tvaBreakdown(allLines.map(l=>({totalHT:l.totalHT, tvaRate:l.tvaRate})));
  const totalHT1 = breakdown.reduce((a,b)=>a+b.baseHT,0);
  const totalTVA1 = breakdown.reduce((a,b)=>a+b.tvaAmount,0);
  const aoa1 = [
    [resto.name],
    [fullAddress(resto) || resto.city || ''],
    [resto.siret ? 'SIRET : '+resto.siret : ''],
    [],
    ['Récapitulatif TVA — '+periodLabel],
    [],
    ['Taux de TVA', 'Base HT', 'Montant TVA', 'Total TTC'],
    ...breakdown.map(b=>[b.rate/100, b.baseHT, b.tvaAmount, b.baseHT+b.tvaAmount]),
    ['TOTAL', totalHT1, totalTVA1, totalHT1+totalTVA1],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(aoa1);
  const headerRow1 = 7; // ligne "Taux de TVA..." (1-indexé)
  for(let r=headerRow1+1; r<=headerRow1+breakdown.length+1; r++){
    if(ws1['A'+r] && r<=headerRow1+breakdown.length) ws1['A'+r].z = '0.0%';
    ['B','C','D'].forEach(col=>{ if(ws1[col+r]) ws1[col+r].z = '#,##0.00 €'; });
  }
  ws1['!cols'] = [{wch:16},{wch:16},{wch:16},{wch:16}];
  ws1['!freeze'] = {xSplit:0, ySplit:headerRow1};
  XLSX.utils.book_append_sheet(wb, ws1, 'Récapitulatif TVA');

  // ---------- Feuille 2 : Détail des achats (au niveau ligne) ----------
  const aoa2 = [
    ['Date','Réf. commande','Fournisseur','Article','Quantité','Unité','Prix unit. HT','Taux TVA','Montant HT','Montant TVA','Montant TTC','Statut'],
    ...allLines.map(l=>[
      l.date, l.ref, l.fournisseur, l.article, l.qty, l.unit,
      l.priceHT, l.tvaRate/100, l.totalHT, l.tvaAmount, l.totalHT+l.tvaAmount, l.statut,
    ]),
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
  for(let r=2; r<=allLines.length+1; r++){
    if(ws2['A'+r]) ws2['A'+r].z = 'dd/mm/yyyy';
    if(ws2['G'+r]) ws2['G'+r].z = '#,##0.00 €';
    if(ws2['H'+r]) ws2['H'+r].z = '0.0%';
    ['I','J','K'].forEach(col=>{ if(ws2[col+r]) ws2[col+r].z = '#,##0.00 €'; });
  }
  ws2['!cols'] = [{wch:12},{wch:13},{wch:22},{wch:26},{wch:10},{wch:9},{wch:13},{wch:10},{wch:13},{wch:13},{wch:13},{wch:14}];
  ws2['!freeze'] = {xSplit:0, ySplit:1};
  ws2['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:allLines.length,c:11}}) };
  XLSX.utils.book_append_sheet(wb, ws2, 'Détail des achats');

  // ---------- Feuille 3 : Par fournisseur ----------
  const bySupplier = {};
  allLines.forEach(l=>{
    if(!bySupplier[l.fournisseur]) bySupplier[l.fournisseur] = { orders: new Set(), totalHT:0, totalTVA:0 };
    bySupplier[l.fournisseur].orders.add(l.ref);
    bySupplier[l.fournisseur].totalHT += l.totalHT;
    bySupplier[l.fournisseur].totalTVA += l.tvaAmount;
  });
  const supplierRows = Object.entries(bySupplier).sort((a,b)=>b[1].totalHT-a[1].totalHT);
  const aoa3 = [
    ['Fournisseur','Nb commandes','Total HT','Total TVA','Total TTC'],
    ...supplierRows.map(([name,x])=>[name, x.orders.size, x.totalHT, x.totalTVA, x.totalHT+x.totalTVA]),
  ];
  const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
  for(let r=2; r<=supplierRows.length+1; r++){
    ['C','D','E'].forEach(col=>{ if(ws3[col+r]) ws3[col+r].z = '#,##0.00 €'; });
  }
  ws3['!cols'] = [{wch:24},{wch:13},{wch:14},{wch:14},{wch:14}];
  ws3['!freeze'] = {xSplit:0, ySplit:1};
  XLSX.utils.book_append_sheet(wb, ws3, 'Par fournisseur');

  // ---------- Feuille 4 : Notes ----------
  const aoa4 = [
    ['À propos de ce fichier'],
    [],
    ['Généré automatiquement à partir des commandes enregistrées dans Mise & Sûre'],
    ['par '+resto.name+', pour la période : '+periodLabel+'.'],
    [],
    ['Ce document reprend les commandes passées via le site — à rapprocher des'],
    ['factures fournisseurs réelles pour la comptabilité officielle ; il ne les'],
    ['remplace pas.'],
    [],
    ['Les montants de TVA sont calculés à partir des taux renseignés dans le'],
    ['catalogue produits, à titre indicatif.'],
    [],
    ['Généré le '+fmtDateLong(now)+' à '+fmtTime(now)+' par Mise & Sûre.'],
  ];
  const ws4 = XLSX.utils.aoa_to_sheet(aoa4);
  ws4['!cols'] = [{wch:78}];
  XLSX.utils.book_append_sheet(wb, ws4, 'Notes');

  return wb;
}
function downloadAccountingExport(period){
  const resto = RESTOS.find(r=>r.id===state.resto);
  ensureSheetJS(() => {
    const wb = buildAccountingExportWorkbook(period);
    const filename = `export-comptable-${(resto?.name||'etablissement').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${period}-${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, filename);
    toast('Export comptable téléchargé');
  });
}
// ============================================================
// MODE CONTRÔLE — rassemble en un clic les documents qu'on cherche dans l'urgence d'un
// contrôle sanitaire ou d'un rendez-vous comptable : le compte-rendu HACCP du mois (s'il est
// activé), l'historique des achats du mois, et l'export comptable du mois. Aucun nouveau
// document créé — seulement les trois déjà existants, réunis en un seul geste plutôt qu'à
// chercher un par un au pire moment pour le faire calmement.
// ============================================================
function downloadControlBundle(period){
  const resto = RESTOS.find(r=>r.id===state.resto);
  const steps = [];
  if(resto && resto.haccpEnabled) steps.push(()=>downloadHaccpReport(period));
  steps.push(()=>downloadHistoryDocument(period));
  steps.push(()=>downloadAccountingExport(period));
  toast(`Préparation de ${steps.length} document${steps.length>1?'s':''}…`);
  // Un léger délai entre chaque téléchargement : certains navigateurs bloquent ou demandent une
  // confirmation si plusieurs fichiers se déclenchent exactement au même instant.
  steps.forEach((step,i)=>setTimeout(step, i*450));
}

  if(!names.length){ toast('Tapez au moins un nom de fournisseur', 'alert'); return; }
  const resto = RESTOS.find(r=>r.id===state.resto);
  if(btn){ btn.disabled = true; btn.textContent = 'Ajout en cours…'; }
  let created = 0, failed = 0;
  // Envoyées une par une (pas en parallèle) pour rester à l'abri d'une limite de débit sur
  // l'API si quelqu'un colle une très longue liste d'un coup.
  for(const name of names){
    try{
      const data = await apiRequest(`/api/restaurants/${resto.remoteId}/suppliers`, {
        method:'POST', body:{ name, category:'Divers', delay:'48h' },
      });
      SUPPLIERS.push({id:'f'+data.supplier.id, remoteId:data.supplier.id, name:data.supplier.name, cat:data.supplier.category, delay:data.supplier.delay, address:'', email:'', reliability:90, spend:0});
      created++;
    } catch(err){ failed++; }
  }
  closeModal();
  render();
  if(failed===0) toast(`${created} fournisseur${created>1?'s':''} ajouté${created>1?'s':''} — complétez les coordonnées quand vous voulez, depuis leur fiche`);
  else toast(`${created} ajouté${created>1?'s':''}, ${failed} en échec — réessayez pour ceux qui manquent`, 'alert');
}

async function confirmDeleteSupplier(id){
  const idx = SUPPLIERS.findIndex(s=>s.id===id);
  if(idx===-1) return;
  const s = SUPPLIERS[idx];
  const resto = RESTOS.find(r=>r.id===state.resto);
  try{
    await apiRequest(`/api/restaurants/${resto.remoteId}/suppliers/${s.remoteId}`, { method:'DELETE' });
    SUPPLIERS.splice(idx,1);
    delete BASKETS[id];
    // Le serveur détache déjà proprement les produits qui pointaient vers ce fournisseur (ON
    // DELETE SET NULL) — sans ce nettoyage local, ils garderaient une référence vers un
    // fournisseur qui n'existe plus jusqu'à la prochaine resynchronisation. supplierName() gère
    // déjà ce cas sans planter (affiche "—"), mais autant que ce soit vrai tout de suite.
    PRODUCTS.forEach(p => { if(p.supplier===id) p.supplier = null; });
    closeModal();
    toast('Fournisseur supprimé');
    render();
  } catch(err){
    toast(err.message, 'alert');
  }
}

============================================================ */
function renderContent(){
  const {role, view} = state;
  if(view==='notifications') return viewNotifications(role);
  if(view==='aide'){
    if(role==='patron') ensureMySupportQuestionsLoaded();
    return viewAide();
  }
  if(view==='carte-fournisseurs') return soloModeEnabled() ? viewPatronDashboard() : viewSupplierMap();
  if(view==='haccp'){
    const restoForHaccp = RESTOS.find(r=>r.id===state.resto);
    if(!restoForHaccp || !restoForHaccp.haccpEnabled){
      if(role==='manager') return viewManagerDashboard();
      if(role==='cuisine') return viewCuisineAccueil();
      if(role==='salle') return viewSalleAccueil();
      return viewPatronDashboard();
    }
    return viewHaccp(role);
  }
  if(view==='inventaire'){
    const restoForInv = RESTOS.find(r=>r.id===state.resto);
    if(!restoForInv || !restoForInv.stockCountsEnabled){
      if(role==='manager') return viewManagerDashboard();
      if(role==='cuisine') return viewCuisineAccueil();
      if(role==='salle') return viewSalleAccueil();
      return viewPatronDashboard();
    }
    return viewInventaire();
  }
  if(role==='patron'){
    if(view==='dashboard') return viewPatronDashboard();
    if(view==='demandes') return soloModeEnabled() ? viewPatronDashboard() : viewPatronDemandes();
    if(view==='stocks') return viewStocks();
    if(view==='recettes'){
      const restoForRecettes = RESTOS.find(r=>r.id===state.resto);
      return (financialsHidden() || (restoForRecettes && restoForRecettes.recipesEnabled===false)) ? viewPatronDashboard() : viewRecipes();
    }
    if(view==='commandes') return viewCommandes('patron');
    if(view==='ecarts') return viewEcarts();
    if(view==='stats') return financialsHidden() ? viewPatronDashboard() : viewStats();
    if(view==='fournisseurs') return viewFournisseurs();
    if(view==='equipe') return soloModeEnabled() ? viewPatronDashboard() : viewEquipe();
    if(view==='multi') return soloModeEnabled() ? viewPatronDashboard() : viewMulti();
    if(view==='parametres') return viewParametres();
  }
  if(role==='manager'){
    if(view==='dashboard') return viewManagerDashboard();
    if(view==='demandes') return viewManagerDemandes();
    if(view==='commandes') return viewCommandes('manager');
    if(view==='stocks') return viewStocks();
    if(view==='livraisons') return viewLivraisons();
  }
  if(role==='cuisine'){
    if(view==='accueil') return viewCuisineAccueil();
    if(view==='signaler'){ openSignalModal('Cuisine', false); return viewCuisineAccueil(); }
    if(view==='stocks') return viewCuisineStocks();
    if(view==='livraisons') return viewLivraisons();
    if(view==='demandes') return viewDemandesList('cuisine');
  }
  if(role==='salle'){
    if(view==='accueil') return viewSalleAccueil();
    if(view==='signaler'){ openSignalModal('Salle', false); return viewSalleAccueil(); }
    if(view==='stocks') return viewSalleStocks();
    if(view==='demandes') return viewDemandesList('salle');
  }
  return '';
}

/* ============================================================
   BON DE COMMANDE — génération PDF (jsPDF) et envoi par email au fournisseur
============================================================ */
function buildOrderPdf(o){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const supplier = SUPPLIERS.find(s=>s.id===o.supplier);
  const marginX = 15;
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text(resto ? resto.name : 'Restaurant', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  y += 7;
  if(resto && resto.address){ doc.text(resto.address, marginX, y); y += 5; }
  if(resto && (resto.postalCode || resto.city)){ doc.text(`${escapeHtml(resto.postalCode||'')} ${escapeHtml(resto.city||'')}`.trim(), marginX, y); y += 5; }
  if(resto && resto.siret){ doc.text(`SIRET : ${resto.siret}`, marginX, y); y += 5; }

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('BON DE COMMANDE', 195, 20, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Référence : ${o.id}`, 195, 27, { align:'right' });
  doc.text(`Date : ${o.date || fmtDateShort(o.createdAt||new Date())}`, 195, 32, { align:'right' });

  y += 10;

  y += 8;
  const hideFin = financialsHidden();
  const pdfLines = (o.lineItems||[]).map(li=>{
    const p = li.productId ? PRODUCTS.find(x=>x.id===li.productId) : null;
    const name = p ? p.name : (li.name || 'Article');
    const unit = p ? p.unit : '';
    const price = li.priceReceived != null ? li.priceReceived : (li.price != null ? li.price : (p?p.price:0));
    const qty = li.qtyReceived != null ? li.qtyReceived : li.qty;
    const tvaRate = li.tvaRate != null ? li.tvaRate : (p ? (p.tvaRate??5.5) : 5.5);
    const totalHT = Math.round(Number(qty)*Number(price)*100)/100;
    return { name, unit, price:Number(price), qty:Number(qty), tvaRate, totalHT };
  });
  const rows = pdfLines.map(l => hideFin
    ? [l.name, `${l.qty} ${l.unit}`.trim()]
    : [l.name, `${l.qty} ${l.unit}`.trim(), `${l.price.toFixed(2)} €`, tvaRateLabel(l.tvaRate), `${l.totalHT.toFixed(2)} €`]
  );
  doc.autoTable ? doc.autoTable({
    startY: y, margin:{left:marginX,right:15},

    styles:{ font:'helvetica', fontSize:10, textColor:[30,30,30] },
    headStyles:{ fillColor:[20,20,20], textColor:255 },
    theme:'grid',
  }) : null;
  if(!hideFin){
    const totalHT = pdfLines.reduce((a,l)=>a+l.totalHT,0);
    const breakdown = tvaBreakdown(pdfLines.map(l=>({totalHT:l.totalHT, tvaRate:l.tvaRate})));
    const totalTVA = breakdown.reduce((a,b)=>a+b.tvaAmount,0);
    const totalTTC = totalHT + totalTVA;
    let finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 8 : y + 8 + rows.length*8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,30,30);
    doc.text(`Total HT : ${fmtEUR(totalHT)}`, 195, finalY, { align:'right' }); finalY += 6;
    breakdown.forEach(b=>{
      doc.setFontSize(9); doc.setTextColor(110,110,105);
      doc.text(`dont TVA à ${tvaRateLabel(b.rate)} sur ${fmtEUR(b.baseHT)} : ${fmtEUR(b.tvaAmount)}`, 195, finalY, { align:'right' });
      finalY += 5;
    });
    doc.setFontSize(10); doc.setTextColor(30,30,30);
    doc.text(`Total TVA : ${fmtEUR(totalTVA)}`, 195, finalY, { align:'right' }); finalY += 8;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,20,20);
    doc.text(`Total TTC : ${fmtEUR(totalTTC)}`, 195, finalY, { align:'right' });
  }

  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,145);
  doc.text("Ce document est un bon de commande émis par l'acheteur — il ne constitue pas une facture et ne remplace pas celle émise par le fournisseur. Les montants de TVA sont calculés à partir des taux renseignés dans le catalogue, à titre indicatif.", marginX, pageHeight-14, { maxWidth:180 });

  return doc;
}

   tableau via autoTable, note de bas de page. Regroupé par catégorie comme la page elle-même,
   tous les produits listés (pas seulement ceux déjà comptés) — pensé pour être imprimé et coché
   à la main pendant qu'on parcourt la réserve, pas juste pour archiver ce qui est déjà su.

function buildInventoryPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const resto = RESTOS.find(r=>r.id===state.resto);
  const marginX = 15;
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text(resto ? resto.name : 'Restaurant', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  y += 7;
  if(resto && resto.address){ doc.text(resto.address, marginX, y); y += 5; }
  if(resto && (resto.postalCode || resto.city)){ doc.text(`${resto.postalCode||''} ${resto.city||''}`.trim(), marginX, y); y += 5; }

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('INVENTAIRE', 195, 20, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Édité le ${fmtDateShort(new Date())}`, 195, 27, { align:'right' });

  y += 10;
  doc.setDrawColor(220,220,215); doc.line(marginX, y, 195, y);
  y += 8;

  const sorted = PRODUCTS.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const groups = groupProductsByCategory(sorted);
  const rows = [];
  groups.forEach(g=>{
    g.items.forEach(p=>{
      const last = lastStockCountForProduct(p.id);
      let releve = '—', date = '—', par = '—';
      if(last){
        releve = `${formatInventoryQty(last.quantity, last.unit||p.unit)} ${last.unit||p.unit||''}` + (last.source==='commande' ? ' (estimation)' : '');
        date = fmtDateShort(last.createdAt);
        par = last.source==='commande' ? 'Via commande' : (last.countedByName || '—');
      }
      const productCell = p.packaging ? `${p.name}\n${p.packaging}` : p.name;
      rows.push([productCell, g.category, releve, date, par]);
    });
  });

  doc.autoTable ? doc.autoTable({
    startY: y, margin:{left:marginX,right:15},
    head: [['Produit','Catégorie','Dernier relevé','Date','Relevé par']],
    body: rows,
    styles:{ font:'helvetica', fontSize:9, textColor:[30,30,30] },
    headStyles:{ fillColor:[20,20,20], textColor:255 },
    theme:'grid',
  }) : null;

  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,145);
  doc.text("Relevé simple de stock, sans rapprochement théorique automatique \u2014 une ligne marquée \u00ab estimation \u00bb est calculée à partir de la dernière quantité connue et de ce qui a été reçu depuis, pas un vrai comptage.", marginX, pageHeight-14, { maxWidth:180 });

  return doc;
}

function downloadAndComposeOrderEmail(id){
  const o = ORDERS.find(x=>x.id===id); if(!o) return;
  const selectEl = document.getElementById('pdf-send-to');
  const customEl = document.getElementById('pdf-send-to-custom');
  const to = (selectEl.value === '__custom__' ? customEl.value.trim() : selectEl.value);
  if(!to){ toast('Merci de renseigner une adresse email', 'alert'); return; }
  const mailtoUrl = buildOrderMailtoUrl();
  // Ordre important, trouvé après un premier essai qui ne s'ouvrait pas correctement : on
  // déclenche le mail EN PREMIER, via un clic simulé sur un vrai lien <a href="mailto:...">
  // (plus fiable qu'une simple redirection par script) — car une fois le téléchargement du PDF
  // lancé, certains navigateurs ne considèrent plus l'action suivante comme venant vraiment
  // d'un geste de la personne, et bloquent alors l'ouverture du mail.
  const tempLink = document.createElement('a');
  tempLink.href = mailtoUrl;
  tempLink.style.display = 'none';
  document.body.appendChild(tempLink);
  tempLink.click();
  document.body.removeChild(tempLink);
  // Le PDF se télécharge juste après — un lien mailto: ne peut techniquement joindre aucun
  // fichier (aucun navigateur ne le permet, c'est une limite de sécurité du web, pas de Mise &
  // Sûre), donc la personne doit le glisser elle-même dans l'email qui vient de s'ouvrir.
  ensureJsPDF(() => {
    const doc = buildOrderPdf(o);
    doc.save(`bon-de-commande-${o.id}.pdf`);
    toast('PDF téléchargé — joignez-le dans l\'email qui vient de s\'ouvrir avant d\'envoyer');
    closeModal();
  });
}

// Avant : si Chart.js (chargé depuis un CDN externe) n'avait pas fini de se charger au moment
// exact où cette fonction s'exécutait — une connexion lente, un CDN temporairement lent à

// c'est précisément le genre de situation qui touche un vrai visiteur avec une connexion moins

function drawCharts(){
  // Aucune de ces cinq zones n'existe sur la page actuelle ? Alors aucun graphique n'est
  // nécessaire ici — inutile de charger Chart.js pour rien (c'était l'un des principaux

// Convertit une couleur hexadécimale (#RGB ou #RRGGBB) en rgba() avec l'opacité voulue —
// utilisé pour dériver les teintes de remplissage des graphiques depuis la couleur d'accent.
// Renvoie null si le format n'est pas reconnu, pour que l'appelant garde sa valeur de repli.
function hexToRgba(hex, alpha){
  if(typeof hex !== 'string') return null;
  let h = hex.trim();
  if(h[0] !== '#') return null;
  h = h.slice(1);
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  if(h.length !== 6 || /[^0-9a-fA-F]/.test(h)) return null;
  const n = parseInt(h, 16);
  return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${alpha})`;
}
function drawChartsNow(){
  const isDark = document.documentElement.classList.contains('theme-dark');
  // Les graphiques lisent la couleur d'accent réellement appliquée (thème de couleurs ou
  // couleur personnalisée de l'établissement) plutôt qu'un noir figé : sans ça, un restaurant
  // qui choisissait "Chaleureux" ou "Frais" voyait toute son interface se teinter... sauf ses
  // graphiques, qui restaient noirs et juraient avec le reste.
  const cssAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const fallbackInk = isDark ? '#EDEDE6' : '#141414';
  const ink = cssAccent || fallbackInk;
  const mutedText = isDark ? '#A3A399' : '#6B6B65';
  const gridColor = isDark ? '#333330' : '#EEEEE7';
  // Teinte de remplissage dérivée de la même couleur d'accent, pour rester cohérente avec les
  // barres et les courbes plutôt que de garder un gris neutre par-dessus une couleur vive.
  const fillTint = hexToRgba(ink, isDark ? 0.18 : 0.10) || (isDark ? 'rgba(237,237,230,0.08)' : 'rgba(20,20,20,0.06)');
  Chart.defaults.font.family = "'Inter',sans-serif";
  Chart.defaults.color = mutedText;

  // Chaque graphique est maintenant isolé dans son propre try/catch : avant, une erreur sur le
  // premier graphique de la page (ex. chartStockValue) empêchait silencieusement tous les
  // suivants de se dessiner, puisqu'une exception non rattrapée arrête l'exécution du reste de
  // la fonction — exactement le genre de panne en cascade qui pouvait donner l'impression
  // qu'"aucun graphique" ne fonctionne, alors qu'un seul avait vraiment un problème.
  function safeChart(label, fn){
    try{ fn(); } catch(err){ console.error(`Mise & Sûre : le graphique "${label}" n'a pas pu s'afficher —`, err); }
  }

  safeChart('Valeur des achats (fournisseurs)', () => {
    const stockValCanvas = document.getElementById('chartStockValue');
    if(!stockValCanvas) return;
    const hideFin = financialsHidden();
    const data = hideFin ? commandesCountBySupplier() : achatsBySupplier();
    charts.stockVal = new Chart(stockValCanvas, {
      type:'bar',
      data:{
        labels: data.map(d=>d.label),
        datasets:[{data:data.map(d=>d.value), backgroundColor:ink, borderRadius:5, maxBarThickness:26}]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{grid:{color:gridColor}, ticks:{callback:v=>hideFin?v:v+' €'}}, y:{grid:{display:false}}}
      }
    });
  });

  safeChart('Fiabilité des fournisseurs', () => {
    const suppCanvas = document.getElementById('chartSuppliers');
    if(!suppCanvas) return;
    const suppliersWithReliability = SUPPLIERS.map(s=>({ s, r: calculateSupplierReliability(s.id) })).filter(x=>x.r!==null);
    charts.supp = new Chart(suppCanvas, {
      type:'bar',
      data:{
        labels: suppliersWithReliability.map(x=>x.s.name.split(' ')[0]),
        datasets:[{label:'Fiabilité %', data:suppliersWithReliability.map(x=>x.r.score), backgroundColor: suppliersWithReliability.map(x=>x.r.score>=95?ink:x.r.score>=90?'#8A8A84':'#A93A2E'), borderRadius:5, maxBarThickness:26}]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{min:70,max:100, grid:{color:gridColor}}, y:{grid:{display:false}}}
      }
    });
  });

  safeChart('Évolution des dépenses', () => {
    const trendCanvas = document.getElementById('chartMonthlyTrend');
    if(!trendCanvas) return;
    const trendPeriod = ensureStatsTrendPeriod();
    const trendWindow = adaptiveTrendWindow(trendPeriod);
    const data = trendPeriod==='annee' ? yearlyTrendData(trendWindow) : trendPeriod==='mois' ? monthlyTrendData(trendWindow) : weeklyTrendData(trendWindow);
    charts.trend = new Chart(trendCanvas, {
      type:'line',
      data:{
        labels: data.map(d=>d.label),
        datasets:[{data:data.map(d=>d.value), borderColor:ink, backgroundColor:fillTint, fill:true, tension:0.3, pointRadius:3}]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, ticks:{callback:v=>v+' €'}}}
      }
    });
  });

  safeChart('Dépenses par fournisseur', () => {
    const spendSuppCanvas = document.getElementById('chartSpendSupplier');
    if(!spendSuppCanvas) return;
    const data = achatsBySupplier();
    charts.spendSupp = new Chart(spendSuppCanvas, {
      type:'bar',
      data:{ labels: data.map(d=>d.label), datasets:[{data:data.map(d=>d.value), backgroundColor:ink, borderRadius:5, maxBarThickness:26}] },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{grid:{color:gridColor}, ticks:{callback:v=>v+' €'}}, y:{grid:{display:false}}}
      }
    });
  });

  safeChart('Dépenses par catégorie', () => {
    const spendCatCanvas = document.getElementById('chartSpendCategory');
    if(!spendCatCanvas) return;
    const data = spendByCategoryData();
    const palette = [ink,'#5B5B55','#8A8A84','#A93A2E','#BDBDB5','#2E4A3A'];
    charts.spendCat = new Chart(spendCatCanvas, {
      type:'doughnut',
      data:{ labels: data.map(d=>d.label), datasets:[{data:data.map(d=>d.value), backgroundColor: data.map((_,i)=>palette[i%palette.length])}] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:12,padding:12}}} }
    });
  });
}

const RESTO_JOURNEY = [

function initRestoJourneyReveal(){
  const wrap = document.getElementById('resto-journey');
  if(!wrap || wrap.dataset.bound) return;
  wrap.dataset.bound = '1';
  const steps = wrap.querySelectorAll('.journey-step');
  const line = wrap.querySelector('.journey-line-fill');
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        steps.forEach((step,i)=>{
          setTimeout(()=>step.classList.add('revealed'), i*220);
        });
        if(line) setTimeout(()=>{ line.style.transform = 'scaleX(1)'; }, 120);
        observer.disconnect();
      }
    });
  }, { threshold:0.25 });
  observer.observe(wrap);
}

function openImageLightbox(src, alt){

  overlay.className = 'lightbox-overlay';
  overlay.id = 'image-lightbox';
  overlay.onclick = (e) => { if(e.target === overlay) closeImageLightbox(); };

    <img src="${src}" alt="${escapeHtml(alt)}">
  `;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', lightboxEscHandler);
}
function closeImageLightbox(){

function initProductCarousel(){
  const wrap = document.getElementById('product-carousel');
  if(!wrap || wrap.dataset.bound) return;
  wrap.dataset.bound = '1';
  const slides = wrap.querySelectorAll('.carousel-slide');
  const captions = wrap.querySelectorAll('.carousel-caption-item');
  const dots = wrap.querySelectorAll('.carousel-dot');
  let idx = 0, timer = null;

  function show(i){
    idx = (i + slides.length) % slides.length;
    slides.forEach((el,k)=>el.classList.toggle('active', k===idx));
    captions.forEach((el,k)=>el.classList.toggle('active', k===idx));
    dots.forEach((el,k)=>el.classList.toggle('active', k===idx));
  }
  function next(){ show(idx+1); }
  function startAutoplay(){
    if(timer) return;
    timer = setInterval(next, 4200);
  }
  function stopAutoplay(){ clearInterval(timer); timer = null; }

  dots.forEach(dot=>{
    dot.addEventListener('click', ()=>{ show(parseInt(dot.dataset.idx,10)); stopAutoplay(); startAutoplay(); });
  });

  // Ne se lance qu'une fois la section réellement visible à l'écran — pas la peine de faire
  // tourner un minuteur pour une section que personne n'a encore fait défiler jusqu'ici.
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ if(entry.isIntersecting) startAutoplay(); else stopAutoplay(); });
  }, { threshold:0.3 });
  observer.observe(wrap);
}

// THREE.JS — chargé UNIQUEMENT sur la page marketing (pas dans le reste du site, pour ne pas
// alourdir l'application pour les personnes déjà connectées) : logo 3D dans le hero, et scène
// 3D du restaurant qui se construit au défilement.
// ============================================================
let THREE_JS_LOADING = false;
// Three.js r128 est chargé depuis un fichier séparé (lib-threejs.js, voir loadThreeJS ci-dessus),
// plutôt que chargé depuis un CDN externe — même raison que Chart.js, jsPDF et Leaflet : un
// serveur tiers indisponible ne doit plus jamais faire échouer silencieusement une partie du
// site. Le chargement reste volontairement paresseux (déclenché seulement à l'arrivée sur la
// page d'accueil publique) pour ne pas alourdir l'application pour les personnes déjà connectées.
function loadThreeJS(callback){
  if(window.THREE){ callback(); return; }
  if(THREE_JS_LOADING){
    document.addEventListener('three-js-ready', callback, { once:true });
    return;
  }
  THREE_JS_LOADING = true;
  const script = document.createElement('script');
  script.src = 'lib-threejs.js';
  script.onload = () => {
    THREE_JS_LOADING = false;
    document.dispatchEvent(new Event('three-js-ready'));
    callback();
  };
  script.onerror = () => { THREE_JS_LOADING = false; console.error("Impossible de charger la bibliothèque 3D — le reste du site continue de fonctionner normalement."); };
  document.head.appendChild(script);
}
// État des deux scènes 3D, pour pouvoir arrêter proprement leur boucle d'animation et leurs
// écouteurs si la page marketing est quittée puis rouverte (sinon plusieurs boucles tourneraient
// en même temps sur des canvas qui n'existent plus).
let MARKETING_3D = { logoRAF:null, restoRAF:null, restoObserver:null, restoResizeHandler:null };
function initMarketing3D(){
  const logoCanvas = document.getElementById('hero-logo-3d');
  if(!logoCanvas) return; // pas sur la page marketing pour l'instant
  loadThreeJS(() => {
    if(document.getElementById('hero-logo-3d') === logoCanvas && logoCanvas){
      cancelAnimationFrame(MARKETING_3D.logoRAF);
      initHeroLogo3D(logoCanvas);
    }
  });
}
// --- Logo 3D : un médaillon (cylindre plat) texturé avec le logo sur ses deux faces, qui
// tourne doucement tout seul et qu'on peut aussi faire pivoter à la souris ou au doigt.
function initHeroLogo3D(canvas){
  const wrap = canvas.parentElement;
  const size = () => Math.min(wrap.clientWidth || 220, wrap.clientHeight || 220);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0, 6.2);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(size(), size());

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(2.5, 3, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.35);
  rim.position.set(-3, -1, -2);
  scene.add(rim);

  const texture = new THREE.TextureLoader().load('icon-512.png');
  texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;
  const faceMat = new THREE.MeshStandardMaterial({ map: texture, roughness:0.45, metalness:0.08 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness:0.55, metalness:0.15 });
  const geometry = new THREE.CylinderGeometry(1.55, 1.55, 0.22, 72);
  const coin = new THREE.Mesh(geometry, [edgeMat, faceMat, faceMat]);
  coin.rotation.x = Math.PI / 2; // les faces plates du cylindre pointent vers la caméra (Z), pas vers le haut (Y)
  scene.add(coin);

  let autoSpeed = 0.45; // radians/seconde, vitesse de rotation automatique au repos
  let velocity = autoSpeed;
  let dragging = false;
  let lastX = 0;
  let lastT = performance.now();

  function pointerDown(e){
    dragging = true;
    lastX = (e.touches ? e.touches[0].clientX : e.clientX);
  }
  function pointerMove(e){
    if(!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - lastX;
    lastX = x;
    coin.rotation.y += dx * 0.012;
    velocity = dx * 0.6; // l'élan de la dernière impulsion continue un peu après le relâchement
  }
  function pointerUp(){ dragging = false; }
  wrap.addEventListener('mousedown', pointerDown);
  wrap.addEventListener('touchstart', pointerDown, { passive:true });
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('touchmove', pointerMove, { passive:true });
  window.addEventListener('mouseup', pointerUp);
  window.addEventListener('touchend', pointerUp);

  function animate(){
    MARKETING_3D.logoRAF = requestAnimationFrame(animate);
    if(!document.body.contains(canvas)) return; // page quittée : on arrête proprement
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if(!dragging){
      // Ralentit progressivement vers la vitesse de croisière après une impulsion manuelle,
      // plutôt que de reprendre brutalement la rotation automatique.
      velocity += (autoSpeed - velocity) * Math.min(dt * 1.5, 1);
      coin.rotation.y += velocity * dt;
    }
    renderer.render(scene, camera);
  }
  animate();

  const onResize = () => { const s = size(); renderer.setSize(s, s); };
  window.addEventListener('resize', onResize);
}

async function completeSetupRestaurant(){
  const fieldIds = ['setup-name','setup-address','setup-postal','setup-city','setup-currency'];
  clearFormErrors('setup-error-slot', fieldIds);
  const name = ((document.getElementById('setup-name')||{}).value || '').trim();
  if(!name){ showFormError('setup-error-slot', "Le nom de l'établissement est requis.", ['setup-name']); return; }
  const address = ((document.getElementById('setup-address')||{}).value || '').trim();
  const postalCode = ((document.getElementById('setup-postal')||{}).value || '').trim();
  const city = ((document.getElementById('setup-city')||{}).value || '').trim() || '—';
  const currency = (document.getElementById('setup-currency')||{}).value || 'EUR';

  try{
    const data = await apiRequest('/api/restaurants', { method:'POST', body:{ name, address, postalCode, city, currency } });

    // Le catalogue, l'équipe, les commandes... continuent de fonctionner en mémoire pour
    // l'instant (seule la couche compte/établissement est déjà connectée au vrai serveur) —
    // on garde donc aussi une copie locale, reliée à l'établissement réel par remoteId.
    const newId = 'r'+nextId();
    RESTOS.push({id:newId, name, address, postalCode, city, currency, remoteId: data.restaurant.id});
    ensureRestoData(newId);
    state.resto = newId;
    loadRestoData(newId);

    if(ACCOUNT && !CREDENTIALS.patron.username){
      const derived = ACCOUNT.email.split('@')[0].toLowerCase().replace(/[^a-z0-9.]/g,'') || 'patron';
      const generatedPassword = generateDefaultPassword(derived);
      CREDENTIALS.patron.username = derived;
      CREDENTIALS.patron.password = generatedPassword;
      if(!NOTIF_STATE.patron.email) NOTIF_STATE.patron.email = ACCOUNT.email;
      toast('Établissement créé — identifiant équipe : ' + escapeHtml(CREDENTIALS.patron.username));
      try{
        await apiRequest('/api/account/team-credentials', { method:'PATCH', body:{ username: derived, newPassword: generatedPassword } });
      } catch(e){ /* pas bloquant : les identifiants restent au moins utilisables pour cette session */ }
    } else {
      toast('Établissement créé — bienvenue !');
    }
    goToSite('team-login');
  } catch(err){
    showFormError('setup-error-slot', err.message, fieldIds);
  }
}

function renderBanner(){
  let html = '';
  // Démo publique — visible en permanence tant que la session dure, avec un chemin de sortie
  // toujours à portée. Coexiste volontairement avec le bandeau d'aperçu de rôle plus bas (pas
  // de retour anticipé ici) : une personne peut très bien être en démo ET prévisualiser
  // l'interface Cuisine en même temps, les deux informations restent alors utiles ensemble.
  if(state.isDemoMode){
    html += `<div class="demo-banner" style="background:var(--accent);color:var(--accent-text);">
      ${iconXs(I.eye)} <span><b>Vous explorez une démo publique</b> — les données sont fictives et rien de ce que vous faites ici n'est conservé. <a href="#" onclick="exitPublicDemo();return false;" style="color:inherit;text-decoration:underline;font-weight:700;">Quitter la démo</a></span>
    </div>`;
  }
  // Imitation d'un compte par l'administrateur — priorité absolue d'affichage (avant même la
  // suppression en attente) : jamais d'ambiguïté possible sur le fait qu'on ne regarde pas son
  // propre compte, avec un chemin de sortie toujours visible.
  if(state.impersonating && state.impersonating.active){
    html += `<div class="demo-banner" style="background:var(--urgent);">
      ${iconXs(I.alertTriangle)} <span><b>Vous visualisez le compte de ${escapeHtml(state.impersonating.label)}</b> en tant qu'administrateur. <a href="#" onclick="exitImpersonation();return false;" style="color:#fff;text-decoration:underline;font-weight:700;">Quitter cette vue</a></span>
    </div>`;
    return html; // rien d'autre ne doit se superposer à ce bandeau tant qu'on imite un compte
  }
  // Compte en cours de suppression (délai de grâce) — visible partout dans le site, pas
  // seulement dans Paramètres, pour que personne ne découvre ça par accident en fin de délai.
  if(ACCOUNT && ACCOUNT.pending_deletion_at){
    const deletionDate = new Date(ACCOUNT.pending_deletion_at);
    const daysLeft = Math.max(0, Math.ceil((deletionDate - new Date()) / (1000*60*60*24)));
    html += `<div class="demo-banner" style="background:var(--urgent);">
      ${iconXs(I.alertTriangle)} <span><b>Suppression de compte demandée</b> — votre compte et tous vos établissements seront définitivement supprimés dans ${daysLeft} jour${daysLeft>1?'s':''} (le ${fmtDateLong(deletionDate)}). <a href="#" onclick="cancelAccountDeletion();return false;" style="color:#fff;text-decoration:underline;font-weight:700;">Annuler la suppression</a></span>
    </div>`;
  }
  if(state.identity==='patron' && state.role!==state.identity){
    // iconXs() (plutôt qu'un remplacement de texte sur "width=24") : I.warn n'a jamais eu
    // d'attribut width/height à remplacer (seulement un viewBox), donc l'ancienne méthode ne
    // faisait rien — l'icône s'affichait alors à une taille énorme, non maîtrisée, dès qu'aucune
    // règle CSS parente ne la contraignait par ailleurs (cf. le commentaire de setSvgSize()).
    html += `<div class="demo-banner">${iconXs(I.warn)} <span><b>Aperçu de l'interface ${ROLE_META[state.role].label}</b> — les actions sont limitées aux permissions de ce rôle. <a href="#" onclick="backToOwnSpace();return false;" style="color:#fff;text-decoration:underline;">Revenir à mon espace Patron</a></span></div>`;
  }
  return html;
}

function render(){
  try{
    // Remise à zéro avant chaque affichage : seule la branche "application connectée" repose
    // la classe app-shell. Sans ce retrait, revenir de l'application vers la page publique
    // laisserait le conteneur en hauteur d'écran fixe, et la page publique ne défilerait plus.
    const appRoot = document.getElementById('app');
    if(appRoot) appRoot.className = '';
    renderInner();
  } catch(err){
    // Filet de sécurité : si un affichage plante pour une raison imprévue, on montre un message
    // clair avec un bouton pour recharger, plutôt qu'une page blanche silencieuse qui donne
    // l'impression que le site est cassé ou figé sans aucune explication.
    console.error('Erreur d\'affichage :', err);
    const appEl = document.getElementById('app');
    if(appEl){
      appEl.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
          <div style="max-width:420px;text-align:center;">
            <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
            <h2 style="margin-bottom:10px;">Un problème d'affichage est survenu</h2>
            <p style="color:#8A8A84;margin-bottom:20px;">Vos données n'ont pas été perdues. Rechargez la page pour continuer.</p>
            <button onclick="window.location.reload()" style="background:#141414;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-weight:600;cursor:pointer;">Recharger la page</button>
          </div>
        </div>
      `;
    }
  }
}

  if(state.site==='account-auth'){

  }

  if(state.site==='reset-password'){

      return;
    }

    document.getElementById('app').innerHTML = renderLoginScreen();

  destroyCharts();

  if(resto) document.title = resto.name + ' — Mise & Sûre';
  const {sidebarHtml, topbarHtml} = renderShell();
  // Marque le conteneur comme "application connectée" : c'est ce qui active les défilements
  // indépendants du menu et du contenu. La page publique et l'écran de connexion partagent le
  // même conteneur et doivent, eux, défiler d'un bloc — d'où le retrait systématique ailleurs.
  document.getElementById('app').className = 'app-shell';
  applyStoredSidebarCollapse();
  document.getElementById('app').innerHTML = `
    ${sidebarHtml}
    <div class="main">
      ${topbarHtml}
      ${renderBanner()}
      <div class="content">${renderContent()}</div>
    </div>
  `;
  requestAnimationFrame(()=>drawCharts());

  // ne trouvent simplement rien) — appelée sans condition ici, comme initSupplierMap juste
  // au-dessus, pour réappliquer recherche et catégories repliées après un vrai rechargement de
  // page (changement de vue, par exemple), sans perturber le fonctionnement habituel en DOM pur.
  requestAnimationFrame(filterInventaireRows);
  if(TOUR_STATE.active) renderTourStep(); else maybeAutoStartTour();

async function loadTeamInvite(token){
  try{
    const data = await apiRequest(`/api/restaurants/public/invite/${token}`);
    const localId = 'r'+nextId();
    RESTOS.push({
      id: localId, name: data.restaurant.name, address:'', postalCode:'',
      city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
      accentColor: data.restaurant.accent_color, logoDataUrl: data.restaurant.logo_url,
      tagline: data.restaurant.tagline, coverPhotoDataUrl: data.restaurant.cover_photo_data_url,
      fontStyle: data.restaurant.font_style, colorTheme: data.restaurant.color_theme,
      defaultDarkMode: data.restaurant.default_dark_mode,
    });
    const d = ensureRestoData(localId);
    d.team = data.team.map(m => ({
      id: 't'+m.id, remoteId: m.id, name: m.name, role: m.role,
      shift:'', status:'actif', username:null, photoDataUrl: m.photo_url,
    }));
    state.resto = localId;
    loadRestoData(localId);
    state.site = 'team-login';
    window.history.replaceState({ site: 'team-login' }, '', window.location.pathname);
    render();
  } catch(err){
    toast(err.message, 'alert');
    goToSite('marketing');
  }
}
async function checkExistingSession(){
  // Fixe tout de suite (avant toute action async) l'état associé à cette toute première page de
  // l'historique — sinon, si la personne navigue (ex : clique sur "Tarifs") avant la fin de cette
  // fonction, cette première entrée resterait sans état défini, et le bouton "précédent" du
  // navigateur ne saurait pas y revenir correctement (il atterrirait sur l'accueil par défaut).
  // IMPORTANT : on garde le "?..." de l'adresse tel quel ici (window.location.search) — sinon,
  // ça efface le jeton Google/Apple ou Stripe avant même que le code un peu plus bas ait eu la
  // chance de le lire, cassant complètement la connexion.
  window.history.replaceState({ site: state.site }, '', window.location.pathname + window.location.search);
  // Si on revient d'une connexion Google/Apple (ou d'un paiement Stripe), les indications
  // arrivent dans l'URL — on les récupère et on nettoie l'adresse tout de suite après.
  const urlParams = new URLSearchParams(window.location.search);
  const tokenFromUrl = urlParams.get('token');
  const oauthError = urlParams.get('oauth') === 'error';
  const checkoutCancelled = urlParams.get('checkout') === 'cancelled';
  const checkoutSuccess = urlParams.get('checkout') === 'success';
  const equipeToken = urlParams.get('equipe');
  if(equipeToken){
    // Lien personnel d'un membre de l'équipe : ce chemin est totalement indépendant du compte
    // du patron (aucun email, aucun abonnement) — on saute directement à l'écran de connexion
    // de son établissement précis.
    window.history.replaceState({}, document.title, window.location.pathname);
    await loadTeamInvite(equipeToken);
    return;
  }
  if(tokenFromUrl){
    AUTH_TOKEN = tokenFromUrl;
    localStorage.setItem(AUTH_TOKEN_KEY, tokenFromUrl);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(oauthError){
    toast("La connexion via Google/Apple a échoué. Merci de réessayer.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutCancelled){
    toast("Paiement annulé — vous pouvez réessayer à tout moment.", 'alert');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if(checkoutSuccess){
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  try{
    const meData = await apiRequest('/api/auth/me');
    ACCOUNT = meData.user;
    if(ACCOUNT.team_username) CREDENTIALS.patron.username = ACCOUNT.team_username;
    try{
      // C'est CETTE étape qui vérifie réellement l'abonnement, quelle que soit la façon dont
      // la personne s'est connectée (email, Google ou Apple) — le serveur bloque avec le code
      // SUBSCRIPTION_REQUIRED si le paiement n'est pas actif.
      //
      // Juste après un paiement Stripe réussi, le navigateur peut revenir sur le site un peu
      // AVANT que Stripe n'ait fini de prévenir notre serveur (le "webhook") que le paiement est
      // passé — sans ça, on risquerait de croire à tort que la personne n'a toujours pas payé.
      // On retente donc plusieurs fois, avec une petite pause, uniquement dans ce cas précis.
      let restosData;
      const maxAttempts = checkoutSuccess ? 6 : 1;
      for(let attempt=1; attempt<=maxAttempts; attempt++){
        try{
          restosData = await apiRequest('/api/restaurants');
          break;
        } catch(e){
          const isLastAttempt = attempt===maxAttempts;
          if(e.code!=='SUBSCRIPTION_REQUIRED' || isLastAttempt) throw e;
          await new Promise(r=>setTimeout(r, 1200));
        }
      }
      state.site = (restosData.restaurants && restosData.restaurants.length) ? 'team-login' : 'setup-restaurant';
      if(restosData.restaurants && restosData.restaurants.length){
        // Le compte a déjà un ou plusieurs établissements réels côté serveur (créés avant ce
        // rechargement de page — après un paiement, par exemple) : on les recharge vraiment
        // dans l'application, plutôt que de repartir d'une liste vide comme si tout avait
        // disparu. Le catalogue/équipe/commandes restent pour l'instant en mémoire locale (voir
        // note plus haut), reliés à l'établissement réel par remoteId.
        RESTOS = restosData.restaurants.map(r => ({
          id: 'r'+nextId(),
          name: r.name,
          address: r.address,
          postalCode: r.postal_code,
          city: r.city,
          currency: r.currency,
          remoteId: r.id,
        }));
        RESTOS.forEach(r => ensureRestoData(r.id));
        state.resto = RESTOS[0].id;
        loadRestoData(RESTOS[0].id);
        syncRestoOperationalData(RESTOS[0].id);
      }
    } catch(restoErr){
      if(restoErr.code === 'SUBSCRIPTION_REQUIRED'){
        // Compte connecté mais pas encore payé : on le laisse sur la page d'accueil, il ira
        // sur "Tarifs" et choisira de payer quand il le souhaite — jamais de redirection forcée.
        state.site = 'marketing';
        window.history.replaceState({ site: state.site }, '', window.location.pathname);
        render();
        return;
      }
      throw restoErr;
    }
  } catch(err){
    // Pas de session de compte (patron) active : si un employé était connecté avant ce
    // rechargement de page, on tente de retrouver SA session grâce au jeton conservé — sans
    // ça, tout rechargement de page renverrait systématiquement à l'écran de connexion, même
    // en pleine utilisation de l'application.
    if(TEAM_TOKEN){
      try{
        const data = await apiRequest('/api/restaurants/team-me');
        const localId = 'r'+nextId();
        RESTOS.push({
          id: localId, name: data.restaurant.name, address:'', postalCode:'',
          city: data.restaurant.city, currency:'EUR', remoteId: data.restaurant.id,
          accentColor: data.restaurant.accent_color, logoDataUrl: data.restaurant.logo_url,
          tagline: data.restaurant.tagline, coverPhotoDataUrl: data.restaurant.cover_photo_data_url,
          fontStyle: data.restaurant.font_style, colorTheme: data.restaurant.color_theme,
          defaultDarkMode: data.restaurant.default_dark_mode,
        });
        const d = ensureRestoData(localId);
        const localEmployeeId = 't'+data.member.id;
        d.team = [{
          id: localEmployeeId, remoteId: data.member.id, name: data.member.name,
          role: data.member.role, photoDataUrl: data.member.photo_url,
        }];
        state.resto = localId;
        loadRestoData(localId);
        state.site = 'team-login';
        login(identityForTeamRole(data.member.role), localEmployeeId);
        const lastView = localStorage.getItem('mise_et_sure_last_view');
        if(lastView) state.view = lastView;
        await syncRestoOperationalData(localId);
      } catch(teamErr){
        // Jeton expiré ou invalide : reste sur 'marketing', la personne devra rouvrir son lien.
        TEAM_TOKEN = null;
        localStorage.removeItem(TEAM_TOKEN_KEY);
      }
    }
  }
  window.history.replaceState({ site: state.site }, '', window.location.pathname);
  render();
}
checkExistingSession();

// ============================================================
// CONNEXION INTERNET — un bandeau discret dès que la connexion tombe, plutôt que de laisser
// la personne découvrir le problème seulement quand une action échoue avec un message
// technique. Redisparaît tout seul dès que la connexion revient.
// ============================================================
function renderOfflineBanner(){
  const zone = document.getElementById('offline-banner-zone');
  if(!zone) return;
  zone.innerHTML = navigator.onLine ? '' : `
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:300;background:#141414;color:#fff;padding:11px 16px;text-align:center;font-size:13px;font-weight:600;box-shadow:0 -4px 16px rgba(0,0,0,0.2);">
      📡 Pas de connexion internet — vos dernières actions n'ont peut-être pas été enregistrées. Reconnectez-vous pour continuer.
    </div>
  `;
}
window.addEventListener('online', renderOfflineBanner);
window.addEventListener('offline', renderOfflineBanner);
renderOfflineBanner();
showIOSInstallBanner();
if('serviceWorker' in navigator){
  // Nécessaire pour que le navigateur propose vraiment d'installer le site comme une
  // application (surtout sur Android/Chrome) — échoue silencieusement si le fichier n'est pas
  // encore présent à côté d'index.html, sans jamais bloquer le reste du site.
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
// Sur Android/Chrome (et navigateurs basés sur Chromium), le téléphone propose de déclencher
// l'installation directement par code — on capture cette occasion dès qu'elle se présente, pour
// pouvoir l'utiliser plus tard avec un simple bouton "Installer maintenant", sans passer par un
// menu. Sur iPhone/Safari, cet événement n'existe pas : ce n'est pas une erreur, juste une
// limite volontaire d'Apple — on affichera alors les instructions manuelles à la place.
let DEFERRED_INSTALL_PROMPT = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
  showInstallBanner();
});
function showInstallBanner(){
  if(!DEFERRED_INSTALL_PROMPT || localStorage.getItem('mise_et_sure_install_banner_dismissed') || document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:200;background:#141414;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13.5px;';
  banner.innerHTML = `
    <span>📱 Installez cette application sur votre téléphone, en un tap</span>
    <button id="install-banner-confirm" style="background:#fff;color:#141414;border:none;padding:7px 16px;border-radius:6px;font-weight:600;cursor:pointer;">Installer</button>
    <button id="install-banner-dismiss" style="background:none;border:none;color:#B8B8B0;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;">×</button>
  `;
  document.body.appendChild(banner);
  document.getElementById('install-banner-confirm').onclick = async () => {
    if(!DEFERRED_INSTALL_PROMPT) return;
    DEFERRED_INSTALL_PROMPT.prompt();
    await DEFERRED_INSTALL_PROMPT.userChoice;
    DEFERRED_INSTALL_PROMPT = null;
    banner.remove();
  };
  document.getElementById('install-banner-dismiss').onclick = () => {
    localStorage.setItem('mise_et_sure_install_banner_dismissed', '1');
    banner.remove();
  };
}
// Sur iPhone/iPad, Safari ne propose JAMAIS rien automatiquement, quel que soit le site — la
// seule façon d'installer est manuelle (bouton Partager, puis "Sur l'écran d'accueil"). Comme
// rien ne se déclenche tout seul, on affiche nous-mêmes ces instructions bien en évidence dès
// l'ouverture de la page, plutôt que de les cacher dans les paramètres où seul le patron les
// verrait — sinon la personne qui reçoit le lien atterrit juste sur le site, sans aucune piste.
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function isRunningStandalone(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function showIOSInstallBanner(){
  if(!isIOSDevice() || isRunningStandalone()) return; // pas concerné, ou déjà installée
  if(localStorage.getItem('mise_et_sure_ios_banner_dismissed') || document.getElementById('ios-install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'ios-install-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:200;background:#141414;color:#fff;padding:14px 16px;font-size:13.5px;';
  banner.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:12px;max-width:520px;margin:0 auto;">
      <div style="flex:1;">Pour installer cette application : appuyez sur <strong>⎋</strong> (Partager) en bas de Safari, puis choisissez « Sur l'écran d'accueil »</div>
      <button id="ios-banner-dismiss" style="background:none;border:none;color:#B8B8B0;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;flex-shrink:0;">×</button>
    </div>
  `;
  document.body.appendChild(banner);
  document.getElementById('ios-banner-dismiss').onclick = () => {
    localStorage.setItem('mise_et_sure_ios_banner_dismissed', '1');
    banner.remove();
  };
}
</script>
